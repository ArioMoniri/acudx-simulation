    content: |
      """Fetch the MuseTalk 1.5 weights the LiveTalking musetalk backend loads, pinned by revision.

      Layout written under /app/models (what avatars/musetalk/utils/utils.py::load_all_model,
      models/vae.py, whisper/audio2feature.py and utils/face_parsing expect):

        musetalkV15/unet.pth, musetalkV15/musetalk.json   TMElyralab/MuseTalk @ 2bcb936e2fddb4d86db4c62fd45b387d0c061571
        sd-vae/config.json, diffusion_pytorch_model.bin   stabilityai/sd-vae-ft-mse @ 31f26fdeee1355a5c34592e401dd41e45d25a493
        whisper/config.json, pytorch_model.bin, preprocessor_config.json
                                                          openai/whisper-tiny @ 169d4a4341b33bc18d8881c4b69c2e104e1cc0af
        face-parse-bisent/79999_iter.pth, resnet18-5c106cde.pth
                                                          ManyOtherFunctions/face-parse-bisent @ 0073b233a5a3c4b1377d4dbf49245017938a72b5
                                                          (sha256 checked against the LFS oids)
        avatars/musetalk/utils/face_detection/detection/sfd/s3fd.pth
                                                          the face_alignment S3FD detector, sha256 prefix 619a316812 (its file name)

      Files land in HF_HOME (the worker keeps it on the Lambda filesystem, so later boots skip the
      download) and are linked into place. Exits non-zero on any mismatch.
      """

      from __future__ import annotations

      import hashlib
      import os
      import shutil
      import sys
      import urllib.request

      from huggingface_hub import hf_hub_download

      APP = os.environ.get("LIVETALKING_DIR", "/app")
      HF = [
          ("TMElyralab/MuseTalk", "2bcb936e2fddb4d86db4c62fd45b387d0c061571",
           [("musetalkV15/unet.pth", "musetalkV15/unet.pth"), ("musetalkV15/musetalk.json", "musetalkV15/musetalk.json")]),
          ("stabilityai/sd-vae-ft-mse", "31f26fdeee1355a5c34592e401dd41e45d25a493",
           [("config.json", "sd-vae/config.json"), ("diffusion_pytorch_model.bin", "sd-vae/diffusion_pytorch_model.bin")]),
          ("openai/whisper-tiny", "169d4a4341b33bc18d8881c4b69c2e104e1cc0af",
           [("config.json", "whisper/config.json"), ("pytorch_model.bin", "whisper/pytorch_model.bin"),
            ("preprocessor_config.json", "whisper/preprocessor_config.json")]),
          ("ManyOtherFunctions/face-parse-bisent", "0073b233a5a3c4b1377d4dbf49245017938a72b5",
           [("79999_iter.pth", "face-parse-bisent/79999_iter.pth"),
            ("resnet18-5c106cde.pth", "face-parse-bisent/resnet18-5c106cde.pth")]),
      ]
      SHA256 = {
          "face-parse-bisent/79999_iter.pth": "468e13ca13a9b43cc0881a9f99083a430e9c0a38abd935431d1c28ee94b26567",
          "face-parse-bisent/resnet18-5c106cde.pth": "5c106cde386e87d4033832f2996f5493238eda96ccf559d1d62760c4de0613f8",
      }
      S3FD_URL = "https://www.adrianbulat.com/downloads/python-fan/s3fd-619a316812.pth"
      S3FD_PREFIX = "619a316812"
      S3FD_DEST = os.path.join(APP, "avatars/musetalk/utils/face_detection/detection/sfd/s3fd.pth")


      def sha256(path: str) -> str:
          h = hashlib.sha256()
          with open(path, "rb") as f:
              for block in iter(lambda: f.read(1 << 20), b""):
                  h.update(block)
          return h.hexdigest()


      def link(src: str, dest: str) -> None:
          os.makedirs(os.path.dirname(dest), exist_ok=True)
          if os.path.lexists(dest):
              os.remove(dest)
          os.symlink(os.path.realpath(src), dest)


      def main() -> int:
          models = os.path.join(APP, "models")
          for repo, rev, files in HF:
              for remote, local in files:
                  path = hf_hub_download(repo_id=repo, filename=remote, revision=rev)
                  want = SHA256.get(local)
                  if want and sha256(path) != want:
                      print(f"acudx: sha256 mismatch for {repo}/{remote}", file=sys.stderr)
                      return 1
                  link(path, os.path.join(models, local))
                  print(f"ok {repo}@{rev[:8]} {remote} -> models/{local}")
          cache = os.path.join(os.environ.get("HF_HOME", "/hf"), "acudx-s3fd", "s3fd-619a316812.pth")
          if not os.path.isfile(cache):
              os.makedirs(os.path.dirname(cache), exist_ok=True)
              tmp = cache + ".part"
              with urllib.request.urlopen(S3FD_URL, timeout=120) as r, open(tmp, "wb") as f:
                  shutil.copyfileobj(r, f)
              os.replace(tmp, cache)
          if not sha256(cache).startswith(S3FD_PREFIX):
              print("acudx: s3fd checksum mismatch", file=sys.stderr)
              return 1
          link(cache, S3FD_DEST)
          print("ok s3fd -> " + S3FD_DEST)
          return 0


      if __name__ == "__main__":
          sys.exit(main())
  - path: /opt/acudx/avatar/acudx_avatar_server.py
    content: |
      """AcuDx avatar runner: LiveTalking (pinned commit) + MuseTalk 1.5, WebRTC out, audio in.

      Runs inside the LiveTalking checkout (cwd /app) on the GPU worker, behind Caddy's
      bearer check at /avatar/*. The gateway (server/voice/avatar/musetalk.py) is the only
      client of the control routes; the browser only ever sees the SDP answer and media.

      Routes (all JSON unless noted):
        GET  /health                 model, sessions, prepared avatars, VRAM, measured infer fps
        GET  /avatars                prepared avatar ids
        PUT  /avatars/{avatar_id}    body = portrait image bytes (jpeg/png); prepares the MuseTalk
                                     latents, face box and blend mask for that face (one frame)
        POST /offer                  {sdp, type, avatar} -> {sdp, type, sessionid} (LiveTalking RTCManager)
        POST /humanaudio             multipart sessionid + file (wav or mp3): lip-sync and stream it
        POST /interrupt_talk         {sessionid}
        POST /is_speaking            {sessionid}
        POST /close                  {sessionid}: stop the render threads and close the peer connection
        GET  /turn                   WebSocket <-> TCP byte bridge to the worker's TURN server, for
                                     clients whose network only allows HTTPS (see docs/architecture/18 6.3)

      The avatar preparation below is a port of LiveTalking avatars/musetalk/genavatar.py
      (Apache-2.0) that reuses the already-loaded VAE instead of loading a second UNet,
      and writes the single portrait frame as 00000000.png (load_avatar sorts frames by
      integer file name).
      """

      from __future__ import annotations

      import asyncio
      import copy
      import json
      import logging
      import os
      import pickle
      import re
      import sys
      import threading
      import time

      AVATAR_PORT = int(os.environ.get("AVATAR_PORT", "8010"))
      MAX_SESSIONS = int(os.environ.get("AVATAR_MAX_SESSIONS", "2"))
      BATCH_SIZE = int(os.environ.get("AVATAR_BATCH_SIZE", "8"))
      TURN_TCP_HOST = os.environ.get("AVATAR_TURN_TCP_HOST", "host.docker.internal")
      TURN_TCP_PORT = int(os.environ.get("AVATAR_TURN_TCP_PORT", "3478"))
      LIVETALKING_REF = os.environ.get("LIVETALKING_REF", "")
      MAX_IMAGE_BYTES = 8 * 1024 * 1024
      AVATAR_ID_RE = re.compile(r"^[a-z0-9_-]{1,64}$")
      MAX_FRAME_H = 720

      # LiveTalking parses its own argv; set it before importing anything from the checkout.
      sys.argv = [sys.argv[0], "--config", "", "--model", "musetalk", "--avatar_id", "acudx_none",
                  "--transport", "webrtc", "--stun", "", "--tts", "edgetts", "--max_session", str(MAX_SESSIONS),
                  "--batch_size", str(BATCH_SIZE), "--listenport", str(AVATAR_PORT)]

      import cv2  # noqa: E402
      import numpy as np  # noqa: E402
      import torch  # noqa: E402
      from aiohttp import WSMsgType, web  # noqa: E402

      from config import parse_args  # noqa: E402

      opt = parse_args()

      import registry  # noqa: E402
      import avatars.musetalk_avatar as mt  # noqa: E402
      from avatars.musetalk.utils.blending import get_crop_box, get_image_prepare_material  # noqa: E402
      from avatars.musetalk.utils.face_parsing import FaceParsing  # noqa: E402
      from avatars.musetalk.utils.preprocessing import coord_placeholder, get_landmark_and_bbox  # noqa: E402
      from server.rtc_manager import RTCManager  # noqa: E402
      from server.routes import humanaudio, interrupt_talk, is_speaking  # noqa: E402
      from server.session_manager import MaxSessionError, session_manager  # noqa: E402

      log = logging.getLogger("acudx.avatar")
      logging.basicConfig(level=logging.INFO, format="%(asctime)s %(levelname)s %(name)s %(message)s")

      STATE: dict = {"infer_fps": None, "infer_fps_at": None, "started_at": time.time(), "ready": False,
                     "prepare_ms": {}}


      class _FpsTap(logging.Handler):
          """LiveTalking logs '------actual avg infer fps:<x>' every 100 frames; keep the last value."""

          def emit(self, record: logging.LogRecord) -> None:
              msg = record.getMessage()
              m = re.search(r"actual avg infer fps:([0-9.]+)", msg)
              if m:
                  STATE["infer_fps"] = round(float(m.group(1)), 2)
                  STATE["infer_fps_at"] = time.time()


      logging.getLogger("utils.logger").addHandler(_FpsTap())

      # Media counters for /health: how many audio frames left for WebRTC and how many carried
      # sound, and how many speaking frames could not be blended (each one would otherwise drop
      # its video frame AND its two audio frames in LiveTalking's process_frames).
      MEDIA = {"audio_frames": 0, "audio_frames_with_sound": 0, "audio_peak": 0, "video_frames": 0,
               "blend_errors": 0}
      import server.webrtc as _lt_webrtc  # noqa: E402

      _orig_push_audio = _lt_webrtc.HumanPlayer.push_audio
      _orig_push_video = _lt_webrtc.HumanPlayer.push_video


      def _push_audio(self, frame, eventpoint=None):
          MEDIA["audio_frames"] += 1
          peak = int(np.abs(frame).max()) if frame.size else 0
          if peak > 64:
              MEDIA["audio_frames_with_sound"] += 1
              MEDIA["audio_peak"] = max(MEDIA["audio_peak"], peak)
          return _orig_push_audio(self, frame, eventpoint)


      def _push_video(self, frame):
          MEDIA["video_frames"] += 1
          return _orig_push_video(self, frame)


      _lt_webrtc.HumanPlayer.push_audio = _push_audio
      _lt_webrtc.HumanPlayer.push_video = _push_video

      t0 = time.monotonic()
      MODEL = mt.load_model()
      mt.warm_up(BATCH_SIZE, MODEL)
      VAE = MODEL[0]
      FACE_PARSER = FaceParsing(left_cheek_width=90, right_cheek_width=90)
      STATE["model_load_ms"] = round((time.monotonic() - t0) * 1000.0, 1)
      _orig_paste = mt.MuseReal.paste_back_frame


      def _paste_back_frame(self, pred_frame, idx: int):
          """Blend the generated mouth into the frame; on a blend failure keep the plain frame so the
          frame and, above all, its audio still go out (upstream drops both on any exception)."""
          try:
              return _orig_paste(self, pred_frame, idx)
          except Exception:  # noqa: BLE001 - counted and surfaced in /health
              MEDIA["blend_errors"] += 1
              return self.frame_list_cycle[idx].copy()


      mt.MuseReal.paste_back_frame = _paste_back_frame
      AVATARS: dict[str, tuple] = {}
      PREP_LOCK = threading.Lock()
      AVATAR_ROOT = "./data/avatars"


      def _avatar_dir(avatar_id: str) -> str:
          return os.path.join(AVATAR_ROOT, avatar_id)


      def _is_prepared(avatar_id: str) -> bool:
          return os.path.isfile(os.path.join(_avatar_dir(avatar_id), "latents.pt"))


      def _load(avatar_id: str) -> tuple:
          if avatar_id not in AVATARS:
              AVATARS[avatar_id] = mt.load_avatar(avatar_id)
          return AVATARS[avatar_id]


      class NoFace(ValueError):
          pass


      @torch.no_grad()
      def prepare_avatar(avatar_id: str, image_bytes: bytes) -> dict:
          """Portrait -> MuseTalk avatar (latents, face box, blend mask) for one frame."""
          started = time.monotonic()
          img = cv2.imdecode(np.frombuffer(image_bytes, dtype=np.uint8), cv2.IMREAD_COLOR)
          if img is None:
              raise ValueError("image could not be decoded")
          h, w = img.shape[:2]
          if h > MAX_FRAME_H:
              scale = MAX_FRAME_H / h
              img = cv2.resize(img, (int(w * scale), MAX_FRAME_H), interpolation=cv2.INTER_AREA)
              h, w = img.shape[:2]
          # H.264 and VP8 encoders want even dimensions.
          img = img[: h - h % 2, : w - w % 2]
          with PREP_LOCK:
              root = _avatar_dir(avatar_id)
              full_dir = os.path.join(root, "full_imgs")
              mask_dir = os.path.join(root, "mask")
              os.makedirs(full_dir, exist_ok=True)
              os.makedirs(mask_dir, exist_ok=True)
              frame_path = os.path.join(full_dir, "00000000.png")
              for _attempt in range(3):
                  cv2.imwrite(frame_path, img)
                  coord_list, frame_list = get_landmark_and_bbox([frame_path], 0)
                  if not coord_list or tuple(coord_list[0]) == tuple(coord_placeholder):
                      raise NoFace("no face found in the portrait")
                  x1, y1, x2, y2 = (int(v) for v in coord_list[0])
                  frame = frame_list[0]
                  y2 = min(y2 + 10, frame.shape[0])  # v1.5 extra_margin, as in genavatar.py
                  coords = [x1, y1, x2, y2]
                  # The blend step pastes into the face box expanded 1.5x (blending.get_crop_box). A
                  # close-up portrait puts that box outside the frame, every speaking frame then fails
                  # in paste_back_frame and is dropped together with its audio, so the call is silent.
                  # Pad the portrait (edge replicate) until the expanded box fits, then detect again.
                  (cx1, cy1, cx2, cy2), _s = get_crop_box(coords, 1.5)
                  fh, fw = frame.shape[:2]
                  pad = max(0, -cx1, -cy1, cx2 - fw, cy2 - fh)
                  if pad == 0:
                      break
                  pad += 4
                  img = cv2.copyMakeBorder(img, pad, pad, pad, pad, cv2.BORDER_REPLICATE)
                  if img.shape[0] > MAX_FRAME_H:
                      scale = MAX_FRAME_H / img.shape[0]
                      img = cv2.resize(img, (int(img.shape[1] * scale), MAX_FRAME_H), interpolation=cv2.INTER_AREA)
                  img = img[: img.shape[0] - img.shape[0] % 2, : img.shape[1] - img.shape[1] % 2]
              else:
                  raise NoFace("the face fills the portrait; no room for the blend box")
              crop = cv2.resize(frame[y1:y2, x1:x2], (256, 256), interpolation=cv2.INTER_LANCZOS4)
              latents = VAE.get_latents_for_unet(crop)
              mask, crop_box = get_image_prepare_material(frame, coords, fp=FACE_PARSER, mode="jaw")
              cv2.imwrite(os.path.join(mask_dir, "00000000.png"), mask)
              with open(os.path.join(root, "mask_coords.pkl"), "wb") as f:
                  pickle.dump([crop_box], f)
              with open(os.path.join(root, "coords.pkl"), "wb") as f:
                  pickle.dump([coords], f)
              torch.save([latents], os.path.join(root, "latents.pt"))
              with open(os.path.join(root, "avator_info.json"), "w") as f:
                  json.dump({"avatar_id": avatar_id, "video_path": "portrait", "bbox_shift": 0}, f)
              AVATARS.pop(avatar_id, None)
              _load(avatar_id)
          ms = round((time.monotonic() - started) * 1000.0, 1)
          STATE["prepare_ms"][avatar_id] = ms
          return {"avatar_id": avatar_id, "width": int(img.shape[1]), "height": int(img.shape[0]),
                  "face_box": [int(v) for v in coords],
                  "prepare_ms": ms}


      def build_avatar_session(sessionid: str, params: dict):
          o = copy.deepcopy(opt)
          o.sessionid = sessionid
          avatar_id = params["avatar"]
          o.avatar_id = avatar_id
          return registry.create("avatar", "musetalk", opt=o, model=MODEL, avatar=_load(avatar_id))


      class TrackedRTCManager(RTCManager):
          """RTCManager that remembers the peer connection per session so /close can end it."""

          def __init__(self, o):
              super().__init__(o)
              self.by_session: dict = {}

          async def _create_pc_and_answer(self, avatar_session, sessionid, offer):
              pc = await super()._create_pc_and_answer(avatar_session, sessionid, offer)
              self.by_session[sessionid] = pc
              return pc


      session_manager.set_max_session(MAX_SESSIONS)
      session_manager.init_builder(build_avatar_session)
      RTC = TrackedRTCManager(opt)


      def _gpu() -> dict:
          out: dict = {"cuda": torch.cuda.is_available()}
          if torch.cuda.is_available():
              free, total = torch.cuda.mem_get_info()
              out.update({"name": torch.cuda.get_device_name(0), "total_mb": total // 2**20, "free_mb": free // 2**20,
                          "process_reserved_mb": torch.cuda.memory_reserved() // 2**20,
                          "process_allocated_mb": torch.cuda.memory_allocated() // 2**20})
          return out


      async def health(_request: web.Request) -> web.Response:
          active = [k for k, v in session_manager.sessions.items() if v is not None]
          prepared = sorted(d for d in os.listdir(AVATAR_ROOT) if _is_prepared(d)) if os.path.isdir(AVATAR_ROOT) else []
          return web.json_response({
              "ok": True, "model": "musetalk-1.5", "runner": "livetalking", "livetalking_ref": LIVETALKING_REF,
              "transport": "webrtc", "fps": opt.fps, "batch_size": BATCH_SIZE, "sessions": len(active),
              "max_sessions": MAX_SESSIONS, "avatars": prepared, "infer_fps": STATE["infer_fps"],
              "model_load_ms": STATE["model_load_ms"], "gpu": _gpu(), "uptime_s": round(time.time() - STATE["started_at"]),
              "media": dict(MEDIA),
          })


      async def list_avatars(_request: web.Request) -> web.Response:
          prepared = sorted(d for d in os.listdir(AVATAR_ROOT) if _is_prepared(d)) if os.path.isdir(AVATAR_ROOT) else []
          return web.json_response({"avatars": prepared})


      async def put_avatar(request: web.Request) -> web.Response:
          avatar_id = request.match_info["avatar_id"]
          if not AVATAR_ID_RE.match(avatar_id):
              return web.json_response({"error": "bad avatar_id"}, status=400)
          body = await request.read()
          if not body or len(body) > MAX_IMAGE_BYTES:
              return web.json_response({"error": "image missing or larger than 8 MB"}, status=400)
          try:
              info = await asyncio.get_running_loop().run_in_executor(None, prepare_avatar, avatar_id, body)
          except NoFace as exc:
              return web.json_response({"error": "no_face", "detail": str(exc)}, status=422)
          except ValueError as exc:
              return web.json_response({"error": "bad_image", "detail": str(exc)}, status=400)
          return web.json_response(info)


      async def offer(request: web.Request) -> web.Response:
          params = await request.json()
          avatar_id = str(params.get("avatar") or "")
          if not AVATAR_ID_RE.match(avatar_id) or not _is_prepared(avatar_id):
              return web.json_response({"error": "avatar_not_prepared", "avatar": avatar_id}, status=409)
          try:
              await asyncio.get_running_loop().run_in_executor(None, _load, avatar_id)
          except Exception as exc:  # noqa: BLE001 - a broken avatar dir is a client-visible error
              return web.json_response({"error": "avatar_load_failed", "detail": type(exc).__name__}, status=500)
          active = sum(1 for v in session_manager.sessions.values() if v is not None)
          if active >= MAX_SESSIONS:
              return web.json_response({"error": "max_sessions", "max_sessions": MAX_SESSIONS}, status=503)
          try:
              return await RTC.handle_offer(request)
          except MaxSessionError:
              return web.json_response({"error": "max_sessions", "max_sessions": MAX_SESSIONS}, status=503)


      async def close(request: web.Request) -> web.Response:
          params = await request.json()
          sid = str(params.get("sessionid") or "")
          session_manager.remove_session(sid)
          pc = RTC.by_session.pop(sid, None)
          if pc is not None:
              await pc.close()
              RTC.pcs.discard(pc)
          return web.json_response({"ok": True, "closed": pc is not None})


      async def turn_bridge(request: web.Request) -> web.WebSocketResponse:
          """Pipe bytes between a WebSocket and the TURN server's TCP listener (TURN over TCP is a byte stream)."""
          ws = web.WebSocketResponse(max_msg_size=1 << 20, heartbeat=20)
          await ws.prepare(request)
          try:
              reader, writer = await asyncio.open_connection(TURN_TCP_HOST, TURN_TCP_PORT)
          except OSError as exc:
              await ws.close(code=1011, message=f"turn unreachable: {type(exc).__name__}".encode())
              return ws

          async def tcp_to_ws() -> None:
              while True:
                  data = await reader.read(65536)
                  if not data:
                      break
                  await ws.send_bytes(data)

          pump = asyncio.create_task(tcp_to_ws())
          try:
              async for msg in ws:
                  if msg.type == WSMsgType.BINARY:
                      writer.write(msg.data)
                      await writer.drain()
                  elif msg.type in (WSMsgType.CLOSE, WSMsgType.ERROR):
                      break
          finally:
              pump.cancel()
              writer.close()
              await ws.close()
          return ws


      async def on_shutdown(_app: web.Application) -> None:
          await RTC.shutdown()


      def main() -> None:
          os.makedirs(AVATAR_ROOT, exist_ok=True)
          app = web.Application(client_max_size=32 * 1024 * 1024)
          app["rtc_manager"] = RTC
          app["opt"] = opt
          app.on_shutdown.append(on_shutdown)
          app.router.add_get("/health", health)
          app.router.add_get("/avatars", list_avatars)
          app.router.add_put("/avatars/{avatar_id}", put_avatar)
          app.router.add_post("/offer", offer)
          app.router.add_post("/humanaudio", humanaudio)
          app.router.add_post("/interrupt_talk", interrupt_talk)
          app.router.add_post("/is_speaking", is_speaking)
          app.router.add_post("/close", close)
          app.router.add_get("/turn", turn_bridge)
          log.info("acudx avatar runner on :%d (batch %d, max sessions %d, model load %.0f ms)", AVATAR_PORT, BATCH_SIZE,
                   MAX_SESSIONS, STATE["model_load_ms"])
          web.run_app(app, host="0.0.0.0", port=AVATAR_PORT, access_log=None)


      if __name__ == "__main__":
          import torch.multiprocessing as tmp
          tmp.set_start_method("spawn", force=True)
          main()
  - path: /opt/acudx/avatar.sh
    permissions: "0755"
    content: |
      #!/usr/bin/env bash
      # Avatar runner bring-up (LiveTalking + MuseTalk 1.5 and the coturn TURN server).
      # Started in the background right after the NVIDIA runtime is registered: the image
      # builds while vLLM loads, and the containers start only after vLLM is healthy and the
      # other GPU side-cars have taken their memory, so the VRAM check sees the real headroom.
      # Progress and the final verdict go to /opt/acudx/public/avatar-status/status.json, which
      # Caddy serves at /avatar-status/status.json behind the bearer (the gateway reads it
      # when /avatar/health does not answer, and reports it in /v1/voice/capabilities).
      set -u
      cd /opt/acudx
      set -a; . ./.env; set +a
      st=/opt/acudx/public/avatar-status
      compose="docker compose -f /opt/acudx/docker-compose.yml"
      mkdir -p "$st" /opt/acudx/avatars
      status() {
        # state reason [total_mb free_mb]
        printf '{"state":"%s","reason":"%s","total_mb":%s,"free_mb":%s,"required_mb":%s,"livetalking_ref":"%s","at":"%s"}\n' \
          "$1" "$2" "${3:-null}" "${4:-null}" "$AVATAR_REQUIRED_MB" "$LIVETALKING_REF" "$(date -u +%FT%TZ)" > "$st/status.json.tmp"
        mv "$st/status.json.tmp" "$st/status.json"
        chmod 0644 "$st/status.json"
        echo "acudx avatar: $1 $2 $(date -u)"
      }
      gpu_mem() { nvidia-smi --query-gpu=memory.total,memory.used --format=csv,noheader,nounits | head -1 | tr -d ' ' | tr ',' ' '; }
      status building ""
      if [ ! -d /opt/acudx/livetalking/.git ]; then
        git clone --filter=blob:none https://github.com/lipku/LiveTalking /opt/acudx/livetalking || { status disabled clone_failed; exit 1; }
      fi
      git -C /opt/acudx/livetalking checkout --quiet "$LIVETALKING_REF" || { status disabled checkout_failed; exit 1; }
      install -m 0644 /opt/acudx/avatar/Dockerfile.acudx /opt/acudx/avatar/acudx-constraints.txt \
        /opt/acudx/avatar/acudx_avatar_server.py /opt/acudx/avatar/acudx_fetch_models.py /opt/acudx/livetalking/
      $compose build avatar >/var/log/acudx-avatar-build.log 2>&1 || { status disabled build_failed; exit 1; }
      status waiting "vllm_health"
      for _ in $(seq 1 240); do
        $compose exec -T vllm curl -sf -o /dev/null http://localhost:8000/health >/dev/null 2>&1 && break
        # A vLLM that exited will not come back by itself; measure VRAM without it rather than wait 40 min.
        cid=$($compose ps -aq vllm 2>/dev/null)
        [ -n "$cid" ] && [ "$(docker inspect -f '{{.State.Status}}' "$cid" 2>/dev/null)" = exited ] && break
        sleep 10
      done
      status waiting "chatterbox_health"
      for _ in $(seq 1 180); do
        cid=$($compose ps -q chatterbox 2>/dev/null)
        [ -n "$cid" ] && [ "$(docker inspect -f '{{.State.Health.Status}}' "$cid" 2>/dev/null)" = healthy ] && break
        sleep 10
      done
      read -r total used <<< "$(gpu_mem)"
      free=$((total - used))
      if [ "$free" -lt "$AVATAR_REQUIRED_MB" ]; then
        # 40 GB cards: vLLM 0.60 + Chatterbox + speaches + Kokoro may leave too little for MuseTalk.
        status disabled insufficient_vram "$total" "$free"
        exit 0
      fi
      status starting "" "$total" "$free"
      $compose up -d turn avatar
      for _ in $(seq 1 120); do
        if $compose exec -T avatar curl -sf -o /dev/null http://localhost:8010/health >/dev/null 2>&1; then
          read -r total2 used2 <<< "$(gpu_mem)"
          status ready "used_by_avatar_mb=$((used2 - used))" "$total2" "$((total2 - used2))"
          exit 0
        fi
        sleep 10
      done
      status disabled start_timeout "$total" "$free"
runcmd:
  - mkdir -p /opt/acudx/caddy /opt/acudx/chatterbox-cache /opt/acudx/chatterbox-voices /opt/acudx/public/diag /opt/acudx/public/avatar-status /opt/acudx/avatars
  # Diagnostics secret: HMAC-SHA256(key=WORKER_TOKEN, "acudx-diag-v1"), hex, 32 characters.
  # The gateway derives the same value (server/providers/gpu_worker.py diag_secret).
  - |
    . /opt/acudx/.env
    if ! grep -q '^WORKER_DIAG_SECRET=' /opt/acudx/.env; then
      s=$(printf '%s' acudx-diag-v1 | openssl dgst -sha256 -hmac "$WORKER_TOKEN" -r | cut -c1-32)
      [ ${#s} -eq 32 ] || { echo "acudx: could not derive the diagnostics secret" >&2; exit 1; }
      echo "WORKER_DIAG_SECRET=$s" >> /opt/acudx/.env
    fi
  # TURN secret for the avatar call: HMAC-SHA256(key=WORKER_TOKEN, "acudx-turn-v1"), hex, 32
  # characters (server/voice/avatar/musetalk.py turn_secret); relay on the primary address.
  - |
    . /opt/acudx/.env
    if ! grep -q '^TURN_SECRET=' /opt/acudx/.env; then
      t=$(printf '%s' acudx-turn-v1 | openssl dgst -sha256 -hmac "$WORKER_TOKEN" -r | cut -c1-32)
      [ ${#t} -eq 32 ] || { echo "acudx: could not derive the TURN secret" >&2; exit 1; }
      echo "TURN_SECRET=$t" >> /opt/acudx/.env
      echo "TURN_RELAY_IP=$(ip -4 route get 1.1.1.1 | awk '{for (i = 1; i < NF; i++) if ($i == "src") print $(i + 1)}')" >> /opt/acudx/.env
    fi
  - nohup /opt/acudx/diag.sh >/dev/null 2>&1 &
  - |
    FS=$(ls -d /lambda/nfs/* 2>/dev/null | head -1)
    if [ -n "$FS" ]; then mkdir -p "$FS/hf" && rm -rf /opt/acudx/hf && ln -s "$FS/hf" /opt/acudx/hf; else mkdir -p /opt/acudx/hf; fi
  # The public IP is not known before launch, so the manager renders
  # WORKER_DOMAIN=auto and the worker derives <ip-with-dashes>.sslip.io itself
  # (the manager derives the identical name from the API-reported IP).
  - |
    if grep -q '^WORKER_DOMAIN=auto$' /opt/acudx/.env; then
      ip=""
      for src in https://api.ipify.org https://checkip.amazonaws.com https://ifconfig.me/ip; do
        ip=$(curl -fsS --max-time 10 --retry 5 --retry-delay 3 "$src" | tr -d '[:space:]') && [ -n "$ip" ] && break
      done
      [ -n "$ip" ] || { echo "acudx: could not resolve public IP" >&2; exit 1; }
      sed -i "s|^WORKER_DOMAIN=auto$|WORKER_DOMAIN=$(echo "$ip" | tr . -).sslip.io|" /opt/acudx/.env
    fi
  # Chatterbox Multilingual is built from the pinned commit (no published multilingual image)
  # with the AcuDx override Dockerfile copied into the checkout.
  - |
    set -a && . /opt/acudx/.env && set +a
    if [ ! -d /opt/acudx/chatterbox-tts-api ]; then
      git clone --filter=blob:none https://github.com/travisvn/chatterbox-tts-api /opt/acudx/chatterbox-tts-api
    fi
    git -C /opt/acudx/chatterbox-tts-api checkout --quiet "$CHATTERBOX_REF"
    install -m 0644 /opt/acudx/chatterbox.Dockerfile /opt/acudx/chatterbox-tts-api/docker/Dockerfile.acudx.gpu
  # Core first (Caddy, vLLM, STT, Kokoro) so /healthz turns green as soon as the model
  # loads; the Chatterbox image build runs afterwards and attaches when done.
  # Lambda Stack ships the NVIDIA container toolkit but dockerd has no "nvidia" runtime
  # name registered (boot log 2026-10-20: "unknown or invalid runtime name: nvidia");
  # register it and restart docker so both --gpus and device reservations work.
  - (command -v nvidia-ctk >/dev/null && nvidia-ctk runtime configure --runtime=docker && systemctl restart docker) || true
  # The avatar image builds in parallel with the vLLM start; avatar.sh waits for vLLM and Chatterbox
  # health and checks VRAM before starting the runner (it never blocks the steps below).
  - nohup /opt/acudx/avatar.sh >/var/log/acudx-avatar.log 2>&1 &
  # vLLM reserves a fraction of the card at start-up and refuses to start when another
  # process already holds that memory (worker 10, 2026-10-20: once Chatterbox reached the
  # GPU, vLLM died with "Engine core initialization failed"). So vLLM starts alone and the
  # GPU side-cars start only after its health check passes (compose --wait, 40 min cap).
  - cd /opt/acudx && set -a && . ./.env && set +a && docker compose up -d caddy
  - |
    cd /opt/acudx && set -a && . ./.env && set +a
    timeout 2400 docker compose up -d --wait vllm || echo "acudx - vllm did not become healthy within 40 min" >&2
  - cd /opt/acudx && set -a && . ./.env && set +a && docker compose up -d speaches kokoro
  - cd /opt/acudx && set -a && . ./.env && set +a && docker compose up -d --build chatterbox
  # Task 24 check: a fresh container from the same service definition reports what torch sees.
  - |
    cd /opt/acudx && set -a && . ./.env && set +a
    docker compose run --rm --no-deps --entrypoint /app/.venv/bin/python chatterbox -c "import torch; print('torch', torch.__version__, 'cuda build', torch.version.cuda, 'cuda available', torch.cuda.is_available(), 'devices', torch.cuda.device_count())" >/var/log/acudx-chatterbox-gpu.log 2>&1 || echo "acudx: chatterbox torch check failed" >>/var/log/acudx-chatterbox-gpu.log
  - nohup /opt/acudx/seed-voices.sh >/var/log/acudx-seed-voices.log 2>&1 &
