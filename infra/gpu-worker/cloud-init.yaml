      class PrepQueue:
          """One preparation at a time on the GPU, lowest priority number first, then first come first
          served. Live 2026-10-21: a learner who clicked the voice button while the case's look ladder was
          being prepared waited 85 to 90 s, because the call's portrait queued behind every look on a
          plain lock (and was then prepared a second time). Calls ask with priority 0, the ladder with 1."""

          def __init__(self) -> None:
              self._cv = threading.Condition()
              self._busy = False
              self._seq = 0
              self._waiting: list = []

          def acquire(self, priority: int) -> None:
              import heapq  # noqa: PLC0415
              with self._cv:
                  self._seq += 1
                  me = (int(priority), self._seq)
                  heapq.heappush(self._waiting, me)
                  while self._busy or self._waiting[0] != me:
                      self._cv.wait()
                  heapq.heappop(self._waiting)
                  self._busy = True

          def release(self) -> None:
              with self._cv:
                  self._busy = False
                  self._cv.notify_all()

          def depth(self) -> int:
              with self._cv:
                  return len(self._waiting) + (1 if self._busy else 0)


