#cloud-config
# AcuDx on-demand GPU worker (Lambda Cloud, Lambda Stack 24.04 image).
# Launched by server/providers/gpu_worker.py and terminated when idle.
# Serves, behind Caddy with automatic TLS on <ip>.sslip.io:
#   /v1/*        vLLM OpenAI-compatible LLM (model from WORKER_LLM_MODEL)
#   /tts/*       Chatterbox Multilingual TTS API (OpenAI-compatible /v1/audio/speech,
#                23 languages including Turkish; voice name carries the language)
#   /tts-en/*    Kokoro FastAPI (English-only secondary, OpenAI-compatible /v1/audio/speech)
#   /stt/*       speaches (faster-whisper large-v3-turbo, OpenAI-compatible /v1/audio/transcriptions)
#   /avatar/*    AcuDx avatar runner: LiveTalking + MuseTalk 1.5 real-time talking head (WebRTC out,
#                TTS audio in, the case portrait as the reference face); see avatar.sh
#   /imagegen/*  per-case patient appearance: FLUX.2 [klein] 4B (Apache-2.0) image edits of the case
#                portrait into the patient's current state; see imagegen.sh
#   /avatar-status/status.json  the runner's bring-up state (building | waiting | starting | ready |
#                disabled with a reason such as insufficient_vram), readable while the runner is down
# Plus coturn on 3478 UDP and TCP and TLS on 443 at turn.<domain> (host network): the WebRTC media
# path for browsers, with TURN REST credentials derived from WORKER_TOKEN
# (server/voice/avatar/musetalk.py). Public 443 is an nginx SNI router (edge.conf): turn.<domain>
# goes to coturn's TLS listener, everything else to Caddy on 127.0.0.1:8443.
#   /healthz     vLLM /health only (the TTS and STT side-cars never gate readiness)
#   /diag/<s>/   final boot-diagnostics snapshot (see diag.sh)
# Every route requires: Authorization: Bearer ${WORKER_TOKEN}. The check sits first inside
# one `route` block: Caddy sorts a bare `respond` after `handle`, so a top-level
# `respond @unauth 401` next to a catch-all `handle` is never reached (review 04 O1).
#
# Diagnostics secret (review 04 O1): WORKER_DIAG_SECRET is the first 32 hex characters of
# HMAC-SHA256(key=WORKER_TOKEN, message="acudx-diag-v1"), computed here with openssl and by
# the gateway in server/providers/gpu_worker.py (diag_secret). Only that derived value ever
# appears in a plaintext URL; the bearer token itself never leaves TLS.
#
# Image pins (verified against the registries on 2026-10-19 and 2026-10-20):
#   vllm/vllm-openai:v0.11.0                      (Docker Hub)
#   ghcr.io/speaches-ai/speaches:0.8.3-cuda       (GHCR tags list; 0.9.0 is still rc)
#   ghcr.io/remsky/kokoro-fastapi-gpu:v0.2.4      (GHCR tags list)
#   caddy:2.9.1                                   (Docker Hub; Caddyfile validated with 2.9.1)
#   nginx:1.30.6-alpine                           (Docker Hub stable; stream + ssl_preread built in,
#                                                  edge.conf validated with nginx -t on 2026-10-20)
#   ghcr.io/astral-sh/uv:0.8.22                   (GHCR manifest, Chatterbox build stage)
#   ghcr.io/coturn/coturn:4.18.0-debian           (GHCR; same tag as Docker Hub coturn/coturn, 2026-09-08)
#   python:3.12-slim-bookworm                     (Docker Hub, avatar runner base)
#   LiveTalking: github.com/lipku/LiveTalking commit c7269433a2b6ecebcd9342445d2ecc882c98b0da (main,
#     2026-10-20, Apache-2.0), built here with torch 2.9.1 cu128 (the README's tested stack) and the
#     constraint file below; MuseTalk 1.5 weights from Hugging Face pinned by revision in
#     acudx_fetch_models.py (TMElyralab/MuseTalk 2bcb936e, stabilityai/sd-vae-ft-mse 31f26fde,
#     openai/whisper-tiny 169d4a43, ManyOtherFunctions/face-parse-bisent 0073b233 sha256-checked).
#   Chatterbox: travisvn/chatterbox-tts-api has no published multilingual image
#     (Docker Hub tags v1.0.1 / latest / gpu all date from 2025-06-03, before the
#     multilingual model landed), so the image is BUILT here from the pinned main
#     commit a5f466128e4baa8e4cceb3bba9b7ca9de6f7ec6b with the AcuDx override
#     Dockerfile below (based on docker/Dockerfile.uv.gpu at that commit), and
#     chatterbox-multilingual pinned to c33cc0286ad166f14dd143c02c2a1c3309ab4727
#     (head of its exp branch on 2026-10-20; torch==2.6.0, torchaudio==2.6.0), and setuptools
#     pinned to 80.9.0 because resemble-perth 1.0.1 still imports pkg_resources (setuptools 82 dropped it).
#
# VRAM budget on one A100 40 GB (docs/research/14 section 2.2, planning numbers):
#   vLLM          --gpu-memory-utilization 0.60 -> 24 GB: Qwen3-14B-AWQ weights about 10 GB + KV cache
#                 (Qwen3-32B-AWQ needs about 18 GB of weights and left too little KV cache at 0.60 on a
#                 40 GB card: worker 7 died with "Engine core initialization failed"; use 32B on 80 GB cards)
#   Chatterbox    about 4 GB (Multilingual 500M, fp16)
#   speaches      about 3 GB (large-v3-turbo fp16; the turbo decoder is 4 layers)
#   Kokoro        under 1 GB per replica (two replicas, kokoro and kokoro2)
#   chatterbox2   about 4 GB, second Chatterbox replica, started only on cards with 70 GB or more
#   headroom      about 8 GB for CUDA context, batching and the MuseTalk avatar runner
#   avatar        MuseTalk 1.5 fp16 UNet + VAE + whisper-tiny + face detector, shared by every call;
#                 avatar.sh starts it only when nvidia-smi shows AVATAR_REQUIRED_MB free after the
#                 other side-cars loaded, else status.json says disabled / insufficient_vram and the
#                 tile falls back to the animated portrait. An H100 80 GB always has the room.
write_files:
  - path: /opt/acudx/.env
    permissions: "0600"
    content: |
      WORKER_TOKEN=__WORKER_TOKEN__
      WORKER_LLM_MODEL=__WORKER_LLM_MODEL__
      WORKER_DOMAIN=__WORKER_DOMAIN__
      HF_HOME=/opt/acudx/hf
      CHATTERBOX_REF=a5f466128e4baa8e4cceb3bba9b7ca9de6f7ec6b
      LIVETALKING_REF=c7269433a2b6ecebcd9342445d2ecc882c98b0da
      AVATAR_REQUIRED_MB=5000
      AVATAR_MAX_SESSIONS=2
      ACUDX_IMAGE_REGISTRY=ghcr.io/ariomoniri
      CHATTERBOX_CACHE=/opt/acudx/chatterbox-cache
      AVATAR_CACHE=/opt/acudx/avatar-cache
  - path: /opt/acudx/Caddyfile
    content: |
      # Port 80 belongs to the boot-diagnostics server (python, see diag.sh) until vLLM is
      # healthy, so Caddy obtains its certificates with TLS-ALPN-01. Public 443 is the nginx SNI
      # router (edge.conf): turn.<domain> goes to coturn's TLS listener, everything else (and every
      # acme-tls/1 challenge) to this Caddy on 127.0.0.1:8443, hence https_port and alt_tlsalpn_port.
      {
        auto_https disable_redirects
        https_port 8443
        acme_ca https://acme-v02.api.letsencrypt.org/directory
        servers {
          protocols h1 h2
        }
      }
      # Certificate only: coturn serves turns:turn.<domain>:443 with it (avatar.sh copies it out).
      turn.{$WORKER_DOMAIN} {
        tls {
          issuer acme {
            disable_http_challenge
            alt_tlsalpn_port 8443
          }
        }
        respond 404
      }
      {$WORKER_DOMAIN} {
        tls {
          issuer acme {
            disable_http_challenge
            alt_tlsalpn_port 8443
          }
        }
        route {
          @unauth not header Authorization "Bearer {$WORKER_TOKEN}"
          respond @unauth 401
          # Chatterbox runs at about 0.7 x real time per stream on an H100, so two calls speaking
          # Turkish at once on one process starve each other (10 s gaps, docs/architecture/18 6.3.8).
          # A second replica (80 GB cards only, see runcmd) takes the second call. /health answers 200
          # while the model loads, so a replica counts as healthy only once it reports ready.
          handle_path /tts/* {
            reverse_proxy chatterbox:4123 chatterbox2:4123 {
              lb_policy least_conn
              lb_try_duration 2s
              health_uri /health
              health_body initialization_state.{1,4}ready
              health_interval 10s
              flush_interval -1
            }
          }
          # Two Kokoro replicas: one Kokoro FastAPI process synthesises one request at a time, so a
          # second live call waited up to 2.7 s for its first chunk (docs/architecture/18 6.3.6).
          handle_path /tts-en/* {
            reverse_proxy kokoro:8880 kokoro2:8880 {
              lb_policy least_conn
              lb_try_duration 2s
              health_uri /health
              health_interval 15s
              flush_interval -1
            }
          }
          handle_path /stt/* {
            reverse_proxy speaches:8000
          }
          handle_path /avatar/* {
            reverse_proxy avatar:8010
          }
          handle_path /imagegen/* {
            reverse_proxy imagegen:8020
          }
          handle /avatar-status/* {
            root * /srv
            file_server
          }
          # The worker is ready once it can serve a live call: vLLM or the avatar runner answering /health
          # (docs/architecture/18 6.8). vLLM loads last (it reserves its share of the card after the
          # side-cars), so the call no longer waits for it; LLM requests answer 502 until it is up.
          handle /healthz {
            rewrite * /health
            reverse_proxy vllm:8000 avatar:8010 {
              lb_policy first
              lb_try_duration 2s
              health_uri /health
              health_interval 5s
            }
          }
          handle /diag/{$WORKER_DIAG_SECRET}/* {
            root * /srv
            file_server
          }
          handle {
            reverse_proxy vllm:8000
          }
        }
      }
  # Public 443: an nginx stream (layer 4) SNI router, nothing terminated here. TURN over TLS must
  # share 443 with the API so browsers behind HTTPS-only proxies and firewalls reach it; the
  # ClientHello's server name decides: turn.<domain> -> coturn's TLS listener (5349, loopback
  # only), anything else -> Caddy (8443). ACME tls-alpn-01 challenges (ALPN acme-tls/1) always go
  # to Caddy, also for turn.<domain>, so Caddy can obtain that certificate for coturn.
  - path: /opt/acudx/edge.conf
    content: |
      worker_processes auto;
      error_log /dev/stderr warn;
      events { worker_connections 4096; }
      stream {
        map $ssl_preread_alpn_protocols $acudx_acme {
          ~\bacme-tls/1\b 1;
          default 0;
        }
        map "$acudx_acme:$ssl_preread_server_name" $acudx_upstream {
          ~^1: 127.0.0.1:8443;
          ~^0:turn\. 127.0.0.1:5349;
          default 127.0.0.1:8443;
        }
        server {
          listen 443;
          ssl_preread on;
          proxy_pass $acudx_upstream;
          proxy_connect_timeout 5s;
          proxy_timeout 2h;
        }
      }
  # Chatterbox latency patch (docs/architecture/18 section 6.3.8): cached voice conditionals, a
  # generate lock and a short first streamed chunk. Copied into the pinned checkout as
  # app/acudx_patch.py and imported at the end of app/main.py by the Dockerfile below.
  - path: /opt/acudx/chatterbox-acudx-patch.py
    content: |
      """AcuDx latency patch for chatterbox-tts-api a5f4661 (docs/architecture/18 section 6.3.8).

      Installed by cloud-init as app/acudx_patch.py and imported at the end of app/main.py.

      1. Prepared voice conditionals are cached. Upstream ``generate(audio_prompt_path=...)`` calls
         ``prepare_conditionals`` on every request (and on every streamed chunk): librosa load and
         resample of the reference clip, the S3Gen reference embedding, the speech tokenizer and the
         voice encoder, about 1.3 s on an H100 before the first token. The cache key is the voice id
         (the clip's file name in the voice library) plus the sha256 of the clip, so a replaced clip
         never reuses old conditionals; uploads, deletes and renames in the voice library drop the
         voice's entries as well. A hit hands the model a fresh Conditionals wrapper around the cached
         tensors with the request's exaggeration, so nothing in the cache is mutated.
      2. ``generate`` is serialised with a lock. The model keeps the conditionals on ``self.conds``;
         two requests in the default executor could otherwise run one voice's text with the other's
         conditionals (a second live call speaking at the same time).
      3. The streaming endpoint sends the first clause as its own short chunk (first comma or clause
         mark after 3 to 10 words, else the first 8 words), so the runner gets audio after one short
         T3 pass; the rest is chunked as before.

      No torch.compile and no CUDA graphs: these hosts need eager mode (vLLM runs --enforce-eager).
      """

      from __future__ import annotations

      import dataclasses
      import hashlib
      import os
      import threading
      import time
      from collections import OrderedDict, deque
      from typing import Any, Callable

      FIRST_CLAUSE_MIN_WORDS = int(os.getenv("ACUDX_FIRST_CLAUSE_MIN_WORDS", "3"))
      FIRST_CLAUSE_MAX_WORDS = int(os.getenv("ACUDX_FIRST_CLAUSE_MAX_WORDS", "10"))
      FIRST_CLAUSE_FALLBACK_WORDS = int(os.getenv("ACUDX_FIRST_CLAUSE_WORDS", "8"))
      FIRST_CLAUSE_MIN_REST_WORDS = 3
      CONDS_CACHE_MAX = int(os.getenv("ACUDX_CONDS_CACHE_MAX", "32"))
      _CLAUSE_END = (",", ";", ":", ".", "!", "?", "…")

      STATS: dict[str, Any] = {"conds_hits": 0, "conds_misses": 0, "conds_invalidations": 0,
                               "last_prepare_ms": None, "first_clause_splits": 0}


      def first_clause(text: str, *, min_words: int = FIRST_CLAUSE_MIN_WORDS, max_words: int = FIRST_CLAUSE_MAX_WORDS,
                       fallback_words: int = FIRST_CLAUSE_FALLBACK_WORDS,
                       min_rest: int = FIRST_CLAUSE_MIN_REST_WORDS) -> tuple[str, str]:
          """(head, rest): the first clause of ``text`` and what follows; rest is "" when no split helps."""
          words = text.split()
          if len(words) < min_words + min_rest:
              return text.strip(), ""
          for i, w in enumerate(words[:max_words], start=1):
              if i >= min_words and w.endswith(_CLAUSE_END) and len(words) - i >= min_rest:
                  return " ".join(words[:i]), " ".join(words[i:])
          k = max(min_words, min(fallback_words, max_words))
          if len(words) - k < min_rest or len(words) <= max_words:
              return text.strip(), ""
          return " ".join(words[:k]), " ".join(words[k:])


      def _join(a: str, b: str, text: str) -> str:
          # Put back the ", " (or "; ", ": ") upstream's split removed between the two pieces.
          for sep in (", ", "; ", ": "):
              if b and f"{a}{sep}{b.split()[0]}" in text:
                  return f"{a}{sep}{b}"
          return f"{a} {b}"


      def merge_tiny(chunks: list, min_words: int = FIRST_CLAUSE_MIN_WORDS, text: str = "") -> list:
          """Fold chunks under ``min_words`` words into their neighbour. Upstream's long-sentence split cuts
          at every ", ", so "Terliyorum, biraz midem ..." became a one-word chunk; T3 often ran on for
          4 to 18 s of audio on such a chunk (live timings 2026-10-21), a long gap and garbled speech."""
          out: list = []
          carry = ""
          for c in chunks:
              c = _join(carry, c, text) if carry else c
              carry = ""
              if len(c.split()) < min_words:
                  carry = c
                  continue
              out.append(c)
          if carry:
              if out:
                  out[-1] = _join(out[-1], carry, text)
              else:
                  out.append(carry)
          return out


      def split_with_first_clause(split: Callable[..., list], text: str, *args: Any, **kwargs: Any) -> list:
          """[first clause, optional second clause (TUNING second_max_words), the rest as upstream chunks],
          with chunks under three words folded into a neighbour."""
          if not TUNING.get("first_clause", True):
              return merge_tiny(list(split(text, *args, **kwargs)), text=text)
          head, rest = first_clause(text, max_words=int(TUNING.get("first_max_words") or FIRST_CLAUSE_MAX_WORDS))
          if not rest:
              return merge_tiny(list(split(text, *args, **kwargs)), text=text)
          STATS["first_clause_splits"] += 1
          out = [head]
          second = int(TUNING.get("second_max_words") or 0)
          if second:
              mid, rest = first_clause(rest, max_words=second, fallback_words=second)
              out.append(mid)
              if not rest:
                  return out
          return out + merge_tiny(list(split(rest, *args, **kwargs)), text=rest)


      def _sha256(path: str) -> str:
          h = hashlib.sha256()
          with open(path, "rb") as f:
              for block in iter(lambda: f.read(1 << 16), b""):
                  h.update(block)
          return h.hexdigest()


      def voice_id(path: str) -> str:
          return os.path.splitext(os.path.basename(path))[0]


      class ConditionalsCache:
          """Prepared conditionals per (voice id, clip sha256). The sha is memoised per (path, mtime, size)
          so a hit costs one stat call."""

          def __init__(self, clone: Callable[[Any, float, Any], Any], max_entries: int = CONDS_CACHE_MAX):
              self._clone = clone
              self._max = max_entries
              self._conds: OrderedDict[tuple[str, str], Any] = OrderedDict()
              self._sha: dict[str, tuple[int, int, str]] = {}
              self._lock = threading.Lock()

          def key(self, path: str) -> tuple[str, str]:
              st = os.stat(path)
              memo = self._sha.get(path)
              if memo is None or memo[:2] != (st.st_mtime_ns, st.st_size):
                  memo = (st.st_mtime_ns, st.st_size, _sha256(path))
                  self._sha[path] = memo
              return voice_id(path), memo[2]

          def prepare(self, model: Any, original: Callable[..., None], wav_fpath: str, exaggeration: float = 0.5) -> None:
              try:
                  k = self.key(str(wav_fpath))
              except OSError:
                  original(model, wav_fpath, exaggeration=exaggeration)
                  return
              with self._lock:
                  cached = self._conds.get(k)
                  if cached is not None:
                      self._conds.move_to_end(k)
              if cached is not None:
                  STATS["conds_hits"] += 1
                  model.conds = self._clone(cached, float(exaggeration), getattr(model, "device", None))
                  return
              t0 = time.perf_counter()
              original(model, wav_fpath, exaggeration=exaggeration)
              STATS["last_prepare_ms"] = round((time.perf_counter() - t0) * 1000.0, 1)
              STATS["conds_misses"] += 1
              with self._lock:
                  self._conds[k] = model.conds
                  while len(self._conds) > self._max:
                      self._conds.popitem(last=False)
              # The model may adjust conds.t3 in place for another exaggeration; keep the cached object apart.
              model.conds = self._clone(model.conds, float(exaggeration), getattr(model, "device", None))

          def invalidate(self, voice: str | None = None) -> int:
              with self._lock:
                  keys = [k for k in self._conds if voice is None or k[0] == voice]
                  for k in keys:
                      del self._conds[k]
                  if voice is None:
                      self._sha.clear()
                  else:
                      for p in [p for p in self._sha if voice_id(p) == voice]:
                          del self._sha[p]
              STATS["conds_invalidations"] += len(keys)
              return len(keys)

          def __len__(self) -> int:
              return len(self._conds)


      def torch_clone(conds: Any, exaggeration: float, device: Any) -> Any:
          import torch

          t3 = dataclasses.replace(conds.t3, emotion_adv=exaggeration * torch.ones(1, 1, 1))
          t3 = t3.to(device=device) if device is not None else t3
          return type(conds)(t3, dict(conds.gen))


      CACHE = ConditionalsCache(torch_clone)
      GENERATE_LOCK = threading.RLock()


      # Per-generate timings (the last 40 calls) for GET /acudx/stats: where the first chunk's time goes.
      TIMINGS: deque = deque(maxlen=40)
      # Runtime switches (POST /acudx/tuning, behind the worker bearer). t3_autocast runs only the T3 decoder
      # under torch.autocast (bf16 or fp16); eager mode either way, no compile, no CUDA graphs.
      TUNING: dict[str, Any] = {"t3_autocast": os.getenv("ACUDX_T3_AUTOCAST") or None,
                                "first_clause": os.getenv("ACUDX_FIRST_CLAUSE", "1") != "0",
                                "first_max_words": FIRST_CLAUSE_MAX_WORDS,
                                "second_max_words": int(os.getenv("ACUDX_SECOND_CLAUSE_WORDS", "0")),
                                # T3 speech-token cap per request: base + per_char x characters (0 = upstream's 1000).
                                "t3_tokens_per_char": float(os.getenv("ACUDX_T3_TOKENS_PER_CHAR", "3.0")),
                                "t3_tokens_base": int(os.getenv("ACUDX_T3_TOKENS_BASE", "25"))}
      _AUTOCAST = {"bf16": "bfloat16", "fp16": "float16"}


      def token_cap(text: str) -> int | None:
          """Most speech tokens (25 a second) T3 may write for ``text``. Live 2026-10-22 (H100 SXM5, Turkish):
          normal clauses took 1.8 to 2.6 tokens a character, but short ones ran on to 4 to 7 s of audio
          ("Hayır doktor bey," 18 characters, 122 tokens, 4.8 s), and the first audio of a clause waits for its
          whole generation, so a run-on cost 1 to 2 s of speech start. The cap leaves ample room (3 per
          character plus 25, about 1 s) and cuts only such a tail."""
          per = float(TUNING.get("t3_tokens_per_char") or 0)
          if per <= 0:
              return None
          return int(int(TUNING.get("t3_tokens_base") or 0) + per * len(str(text or "").strip()))


      def drop_alignment_hooks(t3: Any) -> int:
          """Remove the attention hooks a finished T3 inference left behind; how many were removed.

          Upstream T3.inference (chatterbox-multilingual c33cc02) builds a new AlignmentStreamAnalyzer on every
          call, and each one registers forward hooks on three attention layers that are never removed. Every
          hook copies its layer's attention to the CPU on every decoder step, so after n requests a step pays
          3 n device-to-host copies: the decoder slowed with the worker's age (13.4 ms a token fresh, 17 to 24
          ms later, docs/architecture/18 6.3.10). Only hooks whose function is the analyzer's
          ``attention_forward_hook`` are removed."""
          n = 0
          try:
              layers = t3.tfmr.layers
          except AttributeError:
              return 0
          for layer in layers:
              hooks = getattr(getattr(layer, "self_attn", None), "_forward_hooks", None)
              if not hooks:
                  continue
              for hid in [k for k, f in hooks.items() if getattr(f, "__name__", "") == "attention_forward_hook"]:
                  del hooks[hid]
                  n += 1
          STATS["t3_hooks_dropped"] = STATS.get("t3_hooks_dropped", 0) + n
          return n


      def t3_hook_count(t3: Any) -> int:
          try:
              return sum(len(getattr(layer.self_attn, "_forward_hooks", {}) or {}) for layer in t3.tfmr.layers)
          except AttributeError:
              return -1


      def _timed(store: dict, key: str, fn: Callable[..., Any], *, autocast: bool = False,
                 sync: bool = False, after: Any = None) -> Callable[..., Any]:
          def run(*args, **kwargs):
              t0 = time.perf_counter()
              cap = store.pop("_cap", None) if key == "t3_ms" else None
              if cap:
                  kwargs["max_new_tokens"] = min(int(kwargs.get("max_new_tokens") or 1000), int(cap))
                  store["token_cap"] = kwargs["max_new_tokens"]
              dtype = _AUTOCAST.get(str(TUNING.get("t3_autocast"))) if autocast else None
              if dtype:
                  import torch

                  with torch.autocast("cuda", dtype=getattr(torch, dtype)):
                      out = fn(*args, **kwargs)
              else:
                  out = fn(*args, **kwargs)
              if sync:
                  import torch

                  if torch.cuda.is_available():
                      torch.cuda.synchronize()
              store[key] = store.get(key, 0.0) + (time.perf_counter() - t0) * 1000.0
              if key == "t3_ms":
                  store["t3_hooks_dropped"] = drop_alignment_hooks(after) if after is not None else None
              if key == "t3_ms" and hasattr(out, "shape"):
                  store["tokens"] = int(out.shape[-1])
                  if cap and store["tokens"] >= int(store.get("token_cap") or 0):
                      store["capped"] = True
                      STATS["t3_capped"] = STATS.get("t3_capped", 0) + 1
              return out

          return run


      def _instrument(model: Any) -> dict:
          """Wrap the model's T3, S3Gen and watermarker calls once; returns the timing dict they fill."""
          store = model.__dict__.setdefault("_acudx_timing", {})
          if model.__dict__.get("_acudx_instrumented"):
              return store
          model.__dict__["_acudx_instrumented"] = True
          try:
              model.t3.inference = _timed(store, "t3_ms", model.t3.inference, autocast=True, after=model.t3)
              model.s3gen.inference = _timed(store, "s3gen_ms", model.s3gen.inference, sync=True)
              model.watermarker.apply_watermark = _timed(store, "watermark_ms", model.watermarker.apply_watermark)
          except AttributeError:
              pass
          return store


      def exit_on_fatal_cuda(exc: BaseException) -> bool:
          """A CUDA error such as "an illegal memory access" leaves the process's CUDA context unusable: every later
          request failed while /health still said ready (live 2026-10-22). Exit so the container restarts (compose
          restart: unless-stopped) and Caddy sends the calls to the other replica meanwhile."""
          msg = f"{type(exc).__name__}: {exc}"
          if "CUDA error" not in msg and "CUBLAS_STATUS" not in msg and "cuDNN error" not in msg:
              return False
          STATS["fatal_cuda"] = msg[:200]
          print("acudx: fatal CUDA error, exiting for a restart:", msg[:200], flush=True)
          threading.Timer(0.5, lambda: os._exit(70)).start()
          return True


      def patch_model_class(cls: Any, cache: ConditionalsCache = CACHE, lock: Any = GENERATE_LOCK) -> None:
          if getattr(cls, "_acudx_patched", False):
              return
          orig_prepare = cls.prepare_conditionals
          orig_generate = cls.generate

          def prepare_conditionals(self, wav_fpath, exaggeration=0.5):
              t0 = time.perf_counter()
              cache.prepare(self, orig_prepare, wav_fpath, exaggeration=exaggeration)
              self.__dict__.setdefault("_acudx_timing", {})["conds_ms"] = (time.perf_counter() - t0) * 1000.0

          def generate(self, *args, **kwargs):
              t_wait = time.perf_counter()
              with lock:
                  t0 = time.perf_counter()
                  store = _instrument(self)
                  store.clear()
                  text = kwargs.get("text", args[0] if args else "")
                  store["_cap"] = token_cap(str(text))
                  try:
                      out = orig_generate(self, *args, **kwargs)
                  except Exception as exc:
                      exit_on_fatal_cuda(exc)
                      raise
                  store.pop("_cap", None)
                  row = {k: round(v, 1) if isinstance(v, float) else v for k, v in store.items()}
                  row.update(chars=len(str(text)), words=len(str(text).split()), lock_wait_ms=round((t0 - t_wait) * 1000.0, 1),
                             total_ms=round((time.perf_counter() - t0) * 1000.0, 1),
                             audio_ms=round(out.shape[-1] / float(getattr(self, "sr", 24000)) * 1000.0) if hasattr(out, "shape") else None,
                             t3_autocast=TUNING.get("t3_autocast"), at=round(time.time(), 3))
                  TIMINGS.append(row)
                  return out

          cls.prepare_conditionals = prepare_conditionals
          cls.generate = generate
          cls._acudx_patched = True


      def patch_voice_library(cls: Any, cache: ConditionalsCache = CACHE) -> None:
          if getattr(cls, "_acudx_patched", False):
              return
          for name in ("add_voice", "delete_voice"):
              orig = getattr(cls, name)

              def wrapped(self, voice_name, *args, _orig=orig, **kwargs):
                  try:
                      return _orig(self, voice_name, *args, **kwargs)
                  finally:
                      cache.invalidate(str(voice_name).strip())

              setattr(cls, name, wrapped)
          orig_rename = cls.rename_voice

          def rename_voice(self, old_name, new_name, *args, **kwargs):
              try:
                  return orig_rename(self, old_name, new_name, *args, **kwargs)
              finally:
                  cache.invalidate(str(old_name).strip())
                  cache.invalidate(str(new_name).strip())

          cls.rename_voice = rename_voice
          cls._acudx_patched = True


      def patch_streaming_split(speech_module: Any) -> None:
          orig = speech_module.split_text_for_streaming
          if getattr(orig, "_acudx_patched", False):
              return

          def split_text_for_streaming(text, *args, **kwargs):
              return split_with_first_clause(orig, text, *args, **kwargs)

          split_text_for_streaming._acudx_patched = True
          speech_module.split_text_for_streaming = split_text_for_streaming


      # --------------------------------------------------------------------------------------------------------
      # Token-level streaming (docs/architecture/18 6.3.11). Upstream speaks a chunk only after T3 has written
      # every speech token of it and S3Gen has rendered the whole chunk, so the first audio of a Turkish clause
      # waited 1.45 to 2.1 s on a shared H100. Here T3 hands each token over as it is sampled and S3Gen renders a
      # window as soon as enough tokens are there, in the same thread and on the same CUDA stream (a T3 thread
      # beside S3Gen on a side stream ran T3 at 30 ms a token instead of 13 and once ended in "CUDA error: an
      # illegal memory access", live 2026-10-22), the way
      # CosyVoice2 streams the same decoder: the flow re-runs on every token so far (its fixed noise keeps the
      # rendered prefix stable) and only the new mel frames are vocoded, with the last 8 mel frames and the
      # source signal carried into the next window and the 160 ms seam cross-faded (raised cosine, gains sum to one).
      # The watermark is applied to every piece. A failure before the first piece falls back to upstream.
      # --------------------------------------------------------------------------------------------------------
      SPEECH_TOKEN_SAMPLES = 960       # 24 kHz / 25 tokens a second
      MEL_CACHE_FRAMES = 8             # CosyVoice2 mel_cache_len
      SOURCE_CACHE_SAMPLES = MEL_CACHE_FRAMES * 480
      LOOKAHEAD_TOKENS = 3             # flow pre_lookahead_len: the last 3 tokens are rendered only at the end

      TUNING.update({
          "stream_tokens": os.getenv("ACUDX_STREAM_TOKENS", "1") != "0",
          # Tokens before the first window, then the growth of each later window (the last value repeats). T3 waits
          # while a window renders, so each window must arrive before the audio already sent has played out.
          "stream_schedule": [int(v) for v in os.getenv("ACUDX_STREAM_SCHEDULE", "24,24,48,64").split(",") if v.strip()],
          "stream_watermark": os.getenv("ACUDX_STREAM_WATERMARK", "1") != "0",
          # The flow re-runs over the voice's reference prompt (up to 10 s, 250 tokens, 500 mel frames) plus the
          # clause on every window, so the prompt sets the cost of a window (350 to 500 ms live). Streamed clauses
          # may use only its last N tokens (0 = all of it); every window of a clause uses the same prompt.
          "stream_prompt_tokens": int(os.getenv("ACUDX_STREAM_PROMPT_TOKENS", "0")),
          # Euler steps of the flow's CFM decoder for streamed clauses (upstream 10).
          "stream_flow_steps": int(os.getenv("ACUDX_STREAM_FLOW_STEPS", "10")),
      })
      _FLOW_STEPS = threading.local()


      def trimmed_prompt(ref: dict, keep_tokens: int, tensor: Any = None) -> dict:
          """The S3Gen reference with only its last ``keep_tokens`` prompt tokens and their 2 mel frames each."""
          tok = ref.get("prompt_token")
          if not keep_tokens or tok is None or tok.shape[1] <= keep_tokens:
              return ref
          n = int(tok.shape[1])
          out = dict(ref)
          out["prompt_token"] = tok[:, n - keep_tokens:]
          feat = ref["prompt_feat"][:, : 2 * n]
          out["prompt_feat"] = feat[:, feat.shape[1] - 2 * keep_tokens:]
          plen = ref.get("prompt_token_len")
          if plen is not None and tensor is not None:
              out["prompt_token_len"] = tensor([keep_tokens], dtype=plen.dtype, device=plen.device)
          elif plen is not None:
              out["prompt_token_len"] = [keep_tokens]
          if out.get("prompt_feat_len") is not None and tensor is not None:
              out["prompt_feat_len"] = tensor([2 * keep_tokens], device=out["prompt_feat"].device)
          return out


      def _install_flow_steps(s3: Any) -> None:
          """Let a streamed clause choose the flow decoder's Euler steps (the decoder is called with 10)."""
          dec = getattr(getattr(s3, "flow", None), "decoder", None)
          if dec is None or getattr(dec, "_acudx_steps", False):
              return
          orig = dec.forward

          def forward(*args, **kwargs):
              steps = getattr(_FLOW_STEPS, "n", None)
              if steps and "n_timesteps" in kwargs:
                  kwargs["n_timesteps"] = int(steps)
              return orig(*args, **kwargs)

          dec.forward = forward
          dec._acudx_steps = True
      STREAM_TIMINGS: deque = deque(maxlen=40)


      def window_targets(schedule: list, n_max: int = 4096):
          """Token counts at which a window is rendered: schedule [20, 16, 32] -> 20, 36, 68, 100, ..."""
          sched = [max(4, int(v)) for v in (schedule or [20])]
          at = sched[0]
          i = 1
          while at <= n_max:
              yield at
              at += sched[min(i, len(sched) - 1)]
              i += 1


      def fade_in(n: int):
          """Raised-cosine fade-in of n samples; with 1 - it as the fade-out the two always sum to one (CosyVoice2
          cross-fades with the two halves of a Hamming window, which add up to 1.08 in the middle of the seam)."""
          import numpy as np

          return (0.5 - 0.5 * np.cos(np.pi * (np.arange(n, dtype=np.float64) + 0.5) / max(1, n))).astype("float32")


      def crossfade(new_head, old_tail, window):
          """The first len(window) samples of ``new_head`` faded in over the last ones of ``old_tail``."""
          k = min(len(window), new_head.shape[-1], old_tail.shape[-1])
          if k <= 0:
              return new_head
          w = window[:k] if k == len(window) else fade_in(k)
          out = new_head.copy()
          out[..., :k] = new_head[..., :k] * w + old_tail[..., -k:] * (1.0 - w)
          return out


      class Vocoder:
          """Mel windows -> audio pieces with the CosyVoice2 seam handling (mel and source cache, cross-fade).
          ``hift(mel, cache_source) -> (wav, source)`` is S3Gen's hift_inference; arrays are numpy on the way out."""

          def __init__(self, hift, *, to_numpy, cat, trim_fade=None):
              self.hift = hift
              self.to_numpy = to_numpy
              self.cat = cat
              self.cache = None
              self.window = fade_in(SOURCE_CACHE_SAMPLES)
              self.trim_fade = trim_fade
              self.first = True

          def piece(self, mel, final: bool, empty_source):
              if self.cache is not None:
                  mel = self.cat(self.cache["mel"], mel)
                  src = self.cache["source"]
              else:
                  src = empty_source
              wav, source = self.hift(mel, src)
              wav = self.to_numpy(wav)
              if self.cache is not None:
                  wav = crossfade(wav, self.cache["speech"], self.window)
              if not final:
                  self.cache = {"mel": mel[:, :, -MEL_CACHE_FRAMES:], "source": source[:, :, -SOURCE_CACHE_SAMPLES:],
                                "speech": wav[..., -SOURCE_CACHE_SAMPLES:]}
                  wav = wav[..., :-SOURCE_CACHE_SAMPLES]
              if self.first and self.trim_fade is not None and wav.shape[-1]:
                  n = min(len(self.trim_fade), wav.shape[-1])
                  wav = wav.copy()
                  wav[..., :n] = wav[..., :n] * self.trim_fade[:n]
              self.first = False
              return wav


      def _t3_tokens(model, t3_cond, text_tokens, *, max_new_tokens, temperature, cfg_weight, repetition_penalty,
                     min_p, top_p, stop):
          """Upstream T3.inference (chatterbox-multilingual c33cc02, MIT License, Resemble AI) as a generator that
          yields each sampled speech token as soon as it exists; ``stop()`` returning True ends it early."""
          import torch
          from transformers.generation.logits_process import (MinPLogitsWarper, RepetitionPenaltyLogitsProcessor,
                                                              TopPLogitsWarper)
          from chatterbox.models.t3.inference.alignment_stream_analyzer import AlignmentStreamAnalyzer
          from chatterbox.models.t3.inference.t3_hf_backend import T3HuggingfaceBackend

          t3 = model.t3
          with torch.inference_mode():
              text_tokens = torch.atleast_2d(text_tokens).to(dtype=torch.long, device=t3.device)
              initial = t3.hp.start_speech_token * torch.ones_like(text_tokens[:, :1])
              embeds, len_cond = t3.prepare_input_embeds(t3_cond=t3_cond, text_tokens=text_tokens, speech_tokens=initial,
                                                         cfg_weight=cfg_weight)
              analyzer = None
              if t3.hp.is_multilingual:
                  analyzer = AlignmentStreamAnalyzer(t3.tfmr, None, text_tokens_slice=(len_cond, len_cond + text_tokens.size(-1)),
                                                     alignment_layer_idx=9, eos_idx=t3.hp.stop_speech_token)
              try:
                  patched = T3HuggingfaceBackend(config=t3.cfg, llama=t3.tfmr, speech_enc=t3.speech_emb,
                                                 speech_head=t3.speech_head, alignment_stream_analyzer=analyzer)
                  device = embeds.device
                  bos = torch.tensor([[t3.hp.start_speech_token]], dtype=torch.long, device=device)
                  bos_embed = t3.speech_emb(bos) + t3.speech_pos_emb.get_fixed_embedding(0)
                  bos_embed = torch.cat([bos_embed, bos_embed])
                  output = patched(inputs_embeds=torch.cat([embeds, bos_embed], dim=1), past_key_values=None, use_cache=True,
                                   output_attentions=True, output_hidden_states=True, return_dict=True)
                  past = output.past_key_values
                  generated = bos.clone()
                  top_p_w = TopPLogitsWarper(top_p=top_p)
                  min_p_w = MinPLogitsWarper(min_p=min_p)
                  rep = RepetitionPenaltyLogitsProcessor(penalty=float(repetition_penalty))
                  for i in range(max_new_tokens):
                      if stop():
                          break
                      logits_step = output.logits[:, -1, :]
                      cond, uncond = logits_step[0:1, :], logits_step[1:2, :]
                      logits = cond + torch.as_tensor(cfg_weight, device=cond.device, dtype=cond.dtype) * (cond - uncond)
                      if patched.alignment_stream_analyzer is not None:
                          if logits.dim() == 1:
                              logits = logits.unsqueeze(0)
                          last = generated[0, -1].item() if len(generated[0]) > 0 else None
                          logits = patched.alignment_stream_analyzer.step(logits, next_token=last)
                      ids = generated[:1, ...]
                      logits = rep(ids, logits)
                      if temperature != 1.0:
                          logits = logits / temperature
                      logits = top_p_w(ids, min_p_w(ids, logits))
                      next_token = torch.multinomial(torch.softmax(logits, dim=-1), num_samples=1)
                      generated = torch.cat([generated, next_token], dim=1)
                      tok = int(next_token.view(-1)[0].item())
                      if tok == t3.hp.stop_speech_token:
                          break
                      yield tok
                      emb = t3.speech_emb(next_token) + t3.speech_pos_emb.get_fixed_embedding(i + 1)
                      output = patched(inputs_embeds=torch.cat([emb, emb]), past_key_values=past, output_attentions=True,
                                       output_hidden_states=True, return_dict=True)
                      past = output.past_key_values
              finally:
                  drop_alignment_hooks(t3)


      def stream_generate(model, *, text, language_id, audio_prompt_path=None, exaggeration=0.5, cfg_weight=0.5,
                          temperature=0.8, repetition_penalty=2.0, min_p=0.05, top_p=1.0, emit, stop=None) -> dict:
          """Speak ``text`` piece by piece: ``emit(float32 numpy array at model.sr)`` is called for every piece as
          soon as it is rendered. Holds the generate lock for the whole clause. Returns its timings."""
          import torch
          import torch.nn.functional as F
          from chatterbox.mtl_tts import SUPPORTED_LANGUAGES, punc_norm

          stop = stop or threading.Event()
          t_wait = time.perf_counter()
          with GENERATE_LOCK:
              t0 = time.perf_counter()
              row: dict = {"chars": len(str(text)), "words": len(str(text).split()), "lock_wait_ms": round((t0 - t_wait) * 1000.0, 1),
                           "streamed": True, "pieces": 0, "passes": 0, "s3gen_ms": 0.0, "watermark_ms": 0.0}
              if language_id and language_id.lower() not in SUPPORTED_LANGUAGES:
                  raise ValueError(f"Unsupported language_id '{language_id}'")
              if audio_prompt_path:
                  model.prepare_conditionals(audio_prompt_path, exaggeration=exaggeration)
              if float(exaggeration) != float(model.conds.t3.emotion_adv[0, 0, 0].item()):
                  from chatterbox.models.t3.modules.cond_enc import T3Cond

                  c = model.conds.t3
                  model.conds.t3 = T3Cond(speaker_emb=c.speaker_emb, cond_prompt_speech_tokens=c.cond_prompt_speech_tokens,
                                          emotion_adv=exaggeration * torch.ones(1, 1, 1)).to(device=model.device)
              row["conds_ms"] = round((time.perf_counter() - t0) * 1000.0, 1)
              norm = punc_norm(text)
              tt = model.tokenizer.text_to_tokens(norm, language_id=language_id.lower() if language_id else None).to(model.device)
              tt = torch.cat([tt, tt], dim=0)
              tt = F.pad(F.pad(tt, (1, 0), value=model.t3.hp.start_text_token), (0, 1), value=model.t3.hp.stop_text_token)
              cap = token_cap(str(text)) or 1000
              row["token_cap"] = cap
              tokens: list = []
              s3 = model.s3gen
              ref = trimmed_prompt(model.conds.gen, int(TUNING.get("stream_prompt_tokens") or 0), torch.tensor)
              row["prompt_tokens"] = int(ref["prompt_token"].shape[1]) if ref.get("prompt_token") is not None else None
              _install_flow_steps(s3)
              steps = int(TUNING.get("stream_flow_steps") or 10)
              row["flow_steps"] = steps
              targets = window_targets(TUNING.get("stream_schedule") or [24, 24, 48, 64])
              next_at = next(targets)
              mel_done = 0
              empty = torch.zeros(1, 1, 0, device=model.device)
              voc = Vocoder(lambda m, c: s3.hift_inference(m, c), to_numpy=lambda w: w.squeeze(0).detach().float().cpu().numpy(),
                            cat=lambda a, b: torch.cat([a, b], dim=2),
                            trim_fade=s3.trim_fade.detach().float().cpu().numpy() if hasattr(s3, "trim_fade") else None)
              gen = _t3_tokens(model, model.conds.t3, tt, max_new_tokens=min(1000, int(cap)), temperature=temperature,
                               cfg_weight=cfg_weight, repetition_penalty=repetition_penalty, min_p=min_p, top_p=top_p,
                               stop=stop.is_set)
              t3_ms = 0.0

              def render(final: bool) -> None:
                  nonlocal mel_done
                  tp = time.perf_counter()
                  _FLOW_STEPS.n = steps if steps != 10 else None
                  try:
                      with torch.inference_mode():
                          toks = torch.tensor([tokens], dtype=torch.long, device=model.device)
                          mel = s3.flow_inference(toks, ref_dict=ref, finalize=final)
                  finally:
                      _FLOW_STEPS.n = None
                  with torch.inference_mode():
                      new = mel[:, :, mel_done:]
                      mel_done = int(mel.shape[2])
                      if new.shape[2] == 0 and not final:
                          return
                      wav = voc.piece(new, final, empty)
                  row["passes"] += 1
                  row["s3gen_ms"] += (time.perf_counter() - tp) * 1000.0
                  if wav.shape[-1] == 0:
                      return
                  if TUNING.get("stream_watermark", True):
                      tw = time.perf_counter()
                      wav = model.watermarker.apply_watermark(wav, sample_rate=model.sr)
                      row["watermark_ms"] += (time.perf_counter() - tw) * 1000.0
                  if row["pieces"] == 0:
                      row["first_audio_ms"] = round((time.perf_counter() - t0) * 1000.0, 1)
                      row["first_tokens"] = len(tokens)
                  row["pieces"] += 1
                  emit(wav)

              try:
                  ts = time.perf_counter()
                  for tok in gen:
                      tokens.append(tok)
                      if len(tokens) >= next_at:
                          t3_ms += (time.perf_counter() - ts) * 1000.0
                          while next_at <= len(tokens):
                              next_at = next(targets)
                          if len(tokens) > LOOKAHEAD_TOKENS:
                              render(False)
                          ts = time.perf_counter()
                  t3_ms += (time.perf_counter() - ts) * 1000.0
                  if tokens and not stop.is_set():
                      render(True)
              finally:
                  gen.close()
              row["tokens"] = len(tokens)
              row["t3_ms"] = round(t3_ms, 1)
              row["audio_ms"] = round(len(tokens) * SPEECH_TOKEN_SAMPLES / 24.0)
              row["total_ms"] = round((time.perf_counter() - t0) * 1000.0, 1)
              row["s3gen_ms"] = round(row["s3gen_ms"], 1)
              row["watermark_ms"] = round(row["watermark_ms"], 1)
              row["capped"] = bool(row.get("tokens") and row["tokens"] >= min(1000, int(cap)))
              row["at"] = round(time.time(), 3)
              STREAM_TIMINGS.append(row)
              STATS["streamed_clauses"] = STATS.get("streamed_clauses", 0) + 1
              return row


      def patch_streaming_route(speech_module: Any) -> None:
          """Replace the /v1/audio/speech/stream generator with one that sends each clause piece by piece
          (stream_generate). TUNING stream_tokens off, a model without the multilingual T3, or a failure before a
          clause's first piece runs upstream's whole-clause generate for that clause instead."""
          orig = speech_module.generate_speech_streaming
          if getattr(orig, "_acudx_patched", False):
              return

          async def generate_speech_streaming(text, voice_sample_path, language_id="en", exaggeration=None,
                                              cfg_weight=None, temperature=None, streaming_chunk_size=None,
                                              streaming_strategy=None, streaming_quality=None):
              import asyncio

              model = speech_module.get_model()
              multilingual = bool(getattr(getattr(getattr(model, "t3", None), "hp", None), "is_multilingual", False))
              if not TUNING.get("stream_tokens", True) or model is None or not multilingual:
                  async for b in orig(text, voice_sample_path, language_id, exaggeration, cfg_weight, temperature,
                                      streaming_chunk_size, streaming_strategy, streaming_quality):
                      yield b
                  return
              cfg = speech_module.Config
              exaggeration = exaggeration if exaggeration is not None else cfg.EXAGGERATION
              cfg_weight = cfg_weight if cfg_weight is not None else cfg.CFG_WEIGHT
              temperature = temperature if temperature is not None else cfg.TEMPERATURE
              if len(text) > cfg.MAX_TOTAL_LENGTH:
                  raise speech_module.HTTPException(status_code=400, detail={"error": {
                      "message": f"Input text too long. Maximum {cfg.MAX_TOTAL_LENGTH} characters allowed.",
                      "type": "invalid_request_error"}})
              st = speech_module.get_streaming_settings(streaming_chunk_size, streaming_strategy, streaming_quality)
              chunks = speech_module.split_text_for_streaming(text, chunk_size=st["chunk_size"], strategy=st["strategy"],
                                                              quality=st["quality"])
              yield speech_module.create_wav_header(model.sr, 1, 16)
              loop = asyncio.get_running_loop()
              stop = threading.Event()
              try:
                  for chunk in chunks:
                      q: asyncio.Queue = asyncio.Queue()
                      sent = {"n": 0}

                      def emit(wav, _q=q):
                          loop.call_soon_threadsafe(_q.put_nowait, wav)

                      def run(_chunk=chunk, _emit=emit):
                          return stream_generate(model, text=_chunk, language_id=language_id, audio_prompt_path=voice_sample_path,
                                                 exaggeration=exaggeration, cfg_weight=cfg_weight, temperature=temperature,
                                                 emit=_emit, stop=stop)

                      fut = loop.run_in_executor(None, run)
                      fut.add_done_callback(lambda _f, _q=q: loop.call_soon_threadsafe(_q.put_nowait, None))
                      while True:
                          wav = await q.get()
                          if wav is None:
                              break
                          sent["n"] += 1
                          yield _pcm16(wav)
                      try:
                          await fut
                      except Exception as exc:  # noqa: BLE001 - this clause again the upstream way, if nothing went out
                          STATS["stream_failures"] = STATS.get("stream_failures", 0) + 1
                          STATS["stream_last_error"] = f"{type(exc).__name__}: {exc}"[:200]
                          if sent["n"] or exit_on_fatal_cuda(exc):
                              raise
                          wav = await loop.run_in_executor(None, lambda _c=chunk: model.generate(
                              text=_c, audio_prompt_path=voice_sample_path, exaggeration=exaggeration, cfg_weight=cfg_weight,
                              temperature=temperature, language_id=language_id))
                          yield _pcm16(wav.squeeze(0).cpu().numpy() if hasattr(wav, "cpu") else wav)
              finally:
                  stop.set()   # the client went away (a cut reply): the clause in flight stops and frees the lock

          generate_speech_streaming._acudx_patched = True
          speech_module.generate_speech_streaming = generate_speech_streaming


      def _pcm16(wav) -> bytes:
          import numpy as np

          a = np.clip(np.asarray(wav, dtype=np.float32).reshape(-1), -1.0, 1.0)
          return (a * 32767.0).astype("<i2").tobytes()


      def install() -> None:
          from app.api.endpoints import speech
          from app.core import voice_library
          from chatterbox.mtl_tts import ChatterboxMultilingualTTS
          from chatterbox.tts import ChatterboxTTS

          patch_model_class(ChatterboxMultilingualTTS)
          patch_model_class(ChatterboxTTS)
          patch_voice_library(voice_library.VoiceLibrary)
          patch_streaming_split(speech)
          patch_streaming_route(speech)
          # Counters for the live checks (GET /tts/acudx/stats through Caddy, behind the bearer).
          from app.main import app as api

          def stats() -> dict:
              try:
                  from app.core.tts_model import get_model

                  m = get_model()
                  hooks = t3_hook_count(m.t3) if m is not None else None
              except Exception:  # noqa: BLE001 - the counters stay readable without the model
                  hooks = None
              return {**STATS, "conds_cached": len(CACHE), "tuning": dict(TUNING), "t3_hooks": hooks,
                      "timings": list(TIMINGS), "stream_timings": list(STREAM_TIMINGS)}

          api.add_api_route("/acudx/stats", stats, methods=["GET"])

          async def tuning(body: dict) -> dict:
              if "t3_autocast" in body:
                  v = body.get("t3_autocast")
                  if v not in (None, "bf16", "fp16"):
                      return {"error": "t3_autocast must be null, bf16 or fp16"}
                  TUNING["t3_autocast"] = v
              if "first_clause" in body:
                  TUNING["first_clause"] = bool(body["first_clause"])
              for key in ("stream_tokens", "stream_watermark"):
                  if key in body:
                      TUNING[key] = bool(body[key])
              if "stream_schedule" in body:
                  try:
                      sched = [max(4, min(200, int(v))) for v in list(body["stream_schedule"])[:8]]
                  except (TypeError, ValueError):
                      return {"error": "stream_schedule must be a list of integers"}
                  if not sched:
                      return {"error": "stream_schedule must not be empty"}
                  TUNING["stream_schedule"] = sched
              for key, lo, hi in (("first_max_words", 3, 20), ("second_max_words", 0, 30), ("t3_tokens_base", 0, 200),
                                  ("stream_prompt_tokens", 0, 250), ("stream_flow_steps", 2, 10)):
                  if key in body:
                      try:
                          TUNING[key] = max(lo, min(hi, int(body[key])))
                      except (TypeError, ValueError):
                          return {"error": f"{key} must be an integer"}
              if "t3_tokens_per_char" in body:
                  try:
                      TUNING["t3_tokens_per_char"] = max(0.0, min(10.0, float(body["t3_tokens_per_char"])))
                  except (TypeError, ValueError):
                      return {"error": "t3_tokens_per_char must be a number"}
              TIMINGS.clear()
              return dict(TUNING)

          api.add_api_route("/acudx/tuning", tuning, methods=["POST"])
          STATS["installed"] = True
          print("acudx: conditionals cache, generate lock, first-clause split and token-level streaming installed")
  # Chatterbox build override (task 24, "No CUDA GPUs are available"). Same layers as
  # docker/Dockerfile.uv.gpu at a5f4661 with three changes: uv is pinned (upstream copies
  # ghcr.io/astral-sh/uv:latest), chatterbox-multilingual is pinned to a commit (upstream
  # installs the moving exp branch) and resolved under a constraint that keeps the cu124
  # torch wheels, and the build fails unless torch reports a CUDA build. The runtime GPU
  # attachment is made explicit in the compose service (runtime: nvidia).
  - path: /opt/acudx/chatterbox.Dockerfile
    content: |
      FROM nvidia/cuda:12.4.1-runtime-ubuntu22.04
      ENV PYTHONUNBUFFERED=1 PYTHONDONTWRITEBYTECODE=1 DEBIAN_FRONTEND=noninteractive
      # Python 3.11 comes from uv (a managed CPython build), not the deadsnakes PPA: on 2026-10-21 the
      # PPA answered 503 for minutes, the image did not build and the worker never had a voice.
      # The Ubuntu archive packages are fetched with retries.
      RUN apt-get -o Acquire::Retries=8 update \
          && apt-get -o Acquire::Retries=8 install -y --no-install-recommends ca-certificates \
             git wget curl build-essential ffmpeg libsndfile1 \
          && rm -rf /var/lib/apt/lists/*
      COPY --from=ghcr.io/astral-sh/uv:0.8.22 /uv /bin/uv
      ENV UV_PYTHON_INSTALL_DIR=/opt/uv-python UV_HTTP_TIMEOUT=120
      WORKDIR /app
      RUN uv python install 3.11 && uv venv --python 3.11
      ENV VIRTUAL_ENV=/app/.venv
      ENV PATH="/app/.venv/bin:$PATH"
      ARG TORCH_INDEX_URL=https://download.pytorch.org/whl/cu124
      ARG TORCH_VERSION=2.6.0+cu124
      ARG TORCHAUDIO_VERSION=2.6.0+cu124
      ARG TORCHVISION_VERSION=0.21.0+cu124
      ARG CHATTERBOX_MULTILINGUAL_REF=c33cc0286ad166f14dd143c02c2a1c3309ab4727
      RUN uv pip install "torch==${TORCH_VERSION}" "torchvision==${TORCHVISION_VERSION}" \
          "torchaudio==${TORCHAUDIO_VERSION}" --index-url "${TORCH_INDEX_URL}"
      RUN printf 'torch==%s\ntorchaudio==%s\ntorchvision==%s\n' "${TORCH_VERSION}" "${TORCHAUDIO_VERSION}" \
          "${TORCHVISION_VERSION}" > /app/torch-constraints.txt
      # setuptools stays below 82: resemble-perth 1.0.1 (the watermarker ChatterboxMultilingualTTS
      # builds in __init__) imports pkg_resources, which setuptools 82.0.0 (2026-02-08) removed.
      # perth swallows that ImportError and sets PerthImplicitWatermarker = None, so model init
      # failed with "'NoneType' object is not callable" (workers 2 and 3, 2026-10-20). The pin also
      # goes into the constraint file so the chatterbox install cannot upgrade it again.
      RUN uv pip install "setuptools==80.9.0" fastapi "uvicorn[standard]" python-dotenv python-multipart \
          requests psutil pydub sse-starlette \
          && echo "setuptools==80.9.0" >> /app/torch-constraints.txt
      RUN uv pip install --constraint /app/torch-constraints.txt \
          "git+https://github.com/travisvn/chatterbox-multilingual.git@${CHATTERBOX_MULTILINGUAL_REF}"
      RUN python -c "import sys, torch; print('torch', torch.__version__, 'cuda', torch.version.cuda); sys.exit(0 if torch.version.cuda else 1)"
      # The failure above surfaced only at model load; fail the build instead.
      RUN python -c "import sys, perth; print('perth watermarker', perth.PerthImplicitWatermarker); sys.exit(0 if perth.PerthImplicitWatermarker else 1)"
      COPY app/ ./app/
      COPY main.py ./
      COPY voice-sample.mp3 ./voice-sample.mp3
      # The AcuDx patch (app/acudx_patch.py, copied in by runcmd) is installed when app.main loads; a
      # failure falls back to upstream behaviour and says so in the log. The build only reports.
      RUN printf '\ntry:\n    from app import acudx_patch as _acudx_patch\n    _acudx_patch.install()\nexcept Exception as _exc:  # noqa: BLE001\n    print("acudx: patch not installed:", type(_exc).__name__, _exc)\n' >> app/main.py \
          && (python -c "import app.main, app.acudx_patch as p; print('acudx patch installed', p.STATS.get('installed', False))" \
              || echo "acudx: patch import check failed")
      RUN mkdir -p /cache /voices /data/long_text_jobs
      ENV PORT=4123 EXAGGERATION=0.5 CFG_WEIGHT=0.5 TEMPERATURE=0.8 VOICE_SAMPLE_PATH=/app/voice-sample.mp3 \
          MAX_CHUNK_LENGTH=280 MAX_TOTAL_LENGTH=3000 DEVICE=cuda MODEL_CACHE_DIR=/cache VOICE_LIBRARY_DIR=/voices \
          HOST=0.0.0.0 LONG_TEXT_DATA_DIR=/data/long_text_jobs LONG_TEXT_MAX_LENGTH=100000 \
          LONG_TEXT_CHUNK_SIZE=2500 LONG_TEXT_SILENCE_PADDING_MS=200 LONG_TEXT_JOB_RETENTION_DAYS=7 \
          LONG_TEXT_MAX_CONCURRENT_JOBS=3
      ENV NVIDIA_VISIBLE_DEVICES=all NVIDIA_DRIVER_CAPABILITIES=compute,utility
      EXPOSE 4123
      HEALTHCHECK --interval=30s --timeout=30s --start-period=5m --retries=3 \
          CMD curl -f http://localhost:4123/health || exit 1
      CMD ["/app/.venv/bin/python", "main.py"]
  - path: /opt/acudx/docker-compose.yml
    content: |
      services:
        vllm:
          image: vllm/vllm-openai:v0.11.0
          deploy:
            resources:
              reservations:
                devices:
                  - driver: nvidia
                    count: all
                    capabilities: [gpu]
          runtime: nvidia
          ipc: host
          environment:
            - HF_HOME=/hf
            - NVIDIA_VISIBLE_DEVICES=all
            - NVIDIA_DRIVER_CAPABILITIES=compute,utility
          volumes: [ "/opt/acudx/hf:/hf" ]
          # 0.60 leaves room for Chatterbox (about 4 GB), speaches (about 3 GB) and Kokoro
          # on a 40 GB card; see the VRAM budget in the header comment.
          # --enforce-eager: on Lambda A100 SXM4 hosts CUDA graph capture fails with
          # "CUDA error: operation not permitted" (workers 7, 11, 12 on 2026-10-20; the A10
          # worker 9 served fine). Eager mode costs some decode speed but always starts.
          command: >
            --model ${WORKER_LLM_MODEL} --max-model-len 16384
            --gpu-memory-utilization ${VLLM_GPU_UTIL:-0.60} --enable-prefix-caching --enforce-eager
            --enable-auto-tool-choice --tool-call-parser hermes
            --served-model-name acudx-llm
          healthcheck:
            test: ["CMD-SHELL", "curl -sf http://localhost:8000/health || exit 1"]
            interval: 20s
            retries: 90
        chatterbox:
          build:
            context: /opt/acudx/chatterbox-tts-api
            dockerfile: docker/Dockerfile.acudx.gpu
          image: acudx/chatterbox-tts-api:a5f4661-cu124
          # A replica whose CUDA context broke exits (acudx_patch exit_on_fatal_cuda) and comes back by itself.
          restart: unless-stopped
          # The NVIDIA runtime is registered by runcmd (nvidia-ctk) before any container starts;
          # naming it here makes the toolkit inject /dev/nvidia* from NVIDIA_VISIBLE_DEVICES in
          # addition to the device reservation (task 24: the container saw no GPU).
          runtime: nvidia
          deploy:
            resources:
              reservations:
                devices:
                  - driver: nvidia
                    count: all
                    capabilities: [gpu]
          environment:
            - PORT=4123
            - HOST=0.0.0.0
            - DEVICE=cuda
            - USE_MULTILINGUAL_MODEL=true
            - MODEL_CACHE_DIR=/cache
            - VOICE_LIBRARY_DIR=/voices
            - VOICE_SAMPLE_PATH=/app/voice-sample.mp3
            - MAX_CHUNK_LENGTH=280
            - NVIDIA_VISIBLE_DEVICES=all
            - NVIDIA_DRIVER_CAPABILITIES=compute,utility
          volumes:
            - ${CHATTERBOX_CACHE:-/opt/acudx/chatterbox-cache}:/cache
            - /opt/acudx/chatterbox-voices:/voices
            - /opt/acudx/chatterbox-acudx-patch.py:/app/app/acudx_patch.py:ro
          healthcheck:
            test: ["CMD-SHELL", "curl -sf http://localhost:4123/health || exit 1"]
            interval: 20s
            retries: 60
        chatterbox2:
          # Second replica from the same image (started by runcmd on 80 GB cards only).
          image: acudx/chatterbox-tts-api:a5f4661-cu124
          # A replica whose CUDA context broke exits (acudx_patch exit_on_fatal_cuda) and comes back by itself.
          restart: unless-stopped
          # The NVIDIA runtime is registered by runcmd (nvidia-ctk) before any container starts;
          # naming it here makes the toolkit inject /dev/nvidia* from NVIDIA_VISIBLE_DEVICES in
          # addition to the device reservation (task 24: the container saw no GPU).
          runtime: nvidia
          deploy:
            resources:
              reservations:
                devices:
                  - driver: nvidia
                    count: all
                    capabilities: [gpu]
          environment:
            - PORT=4123
            - HOST=0.0.0.0
            - DEVICE=cuda
            - USE_MULTILINGUAL_MODEL=true
            - MODEL_CACHE_DIR=/cache
            - VOICE_LIBRARY_DIR=/voices
            - VOICE_SAMPLE_PATH=/app/voice-sample.mp3
            - MAX_CHUNK_LENGTH=280
            - NVIDIA_VISIBLE_DEVICES=all
            - NVIDIA_DRIVER_CAPABILITIES=compute,utility
          volumes:
            - ${CHATTERBOX_CACHE:-/opt/acudx/chatterbox-cache}:/cache
            - /opt/acudx/chatterbox-voices:/voices
            - /opt/acudx/chatterbox-acudx-patch.py:/app/app/acudx_patch.py:ro
          healthcheck:
            test: ["CMD-SHELL", "curl -sf http://localhost:4123/health || exit 1"]
            interval: 20s
            retries: 60
        kokoro:
          image: ghcr.io/remsky/kokoro-fastapi-gpu:v0.2.4
          deploy:
            resources:
              reservations:
                devices:
                  - driver: nvidia
                    count: all
                    capabilities: [gpu]
          environment: [ "NVIDIA_VISIBLE_DEVICES=all" ]
        kokoro2:
          image: ghcr.io/remsky/kokoro-fastapi-gpu:v0.2.4
          deploy:
            resources:
              reservations:
                devices:
                  - driver: nvidia
                    count: all
                    capabilities: [gpu]
          environment: [ "NVIDIA_VISIBLE_DEVICES=all" ]
        speaches:
          image: ghcr.io/speaches-ai/speaches:0.8.3-cuda
          deploy:
            resources:
              reservations:
                devices:
                  - driver: nvidia
                    count: all
                    capabilities: [gpu]
          environment:
            # Whisper large-v3-turbo in CTranslate2 form (https://huggingface.co/deepdml/faster-whisper-large-v3-turbo-ct2);
            # preloaded at start and never unloaded so the first dictation does not pay the load.
            - PRELOAD_MODELS=["deepdml/faster-whisper-large-v3-turbo-ct2"]
            - STT_MODEL_TTL=-1
            - WHISPER__COMPUTE_TYPE=float16
            - HF_HOME=/hf
          volumes: [ "/opt/acudx/hf:/hf" ]
        # Public 443 (SNI router, edge.conf); host network so it reaches coturn's loopback TLS port.
        edge:
          image: nginx:1.30.6-alpine
          network_mode: host
          restart: unless-stopped
          volumes:
            - /opt/acudx/edge.conf:/etc/nginx/nginx.conf:ro
        caddy:
          image: caddy:2.9.1
          ports: [ "127.0.0.1:8443:8443" ]
          env_file: /opt/acudx/.env
          volumes:
            - /opt/acudx/Caddyfile:/etc/caddy/Caddyfile:ro
            - /opt/acudx/caddy:/data
            # Final diagnostics snapshot, served at /diag/<secret>/ behind the bearer.
            - /opt/acudx/public/diag:/srv/diag:ro
            - /opt/acudx/public/avatar-status:/srv/avatar-status:ro
        # Avatar runner (avatar.sh starts it after the VRAM check). Media leaves through coturn.
        avatar:
          build:
            context: /opt/acudx/livetalking
            dockerfile: Dockerfile.acudx
          image: acudx/avatar-runner:c726943-cu128
          runtime: nvidia
          # One GPU: the card everything shares (0). Multi-GPU hosts: a card of its own (runcmd AVATAR_GPU).
          deploy:
            resources:
              reservations:
                devices:
                  - driver: nvidia
                    device_ids: ["${AVATAR_GPU:-0}"]
                    capabilities: [gpu]
          extra_hosts: [ "host.docker.internal:host-gateway" ]
          environment:
            - HF_HOME=/hf
            - AVATAR_PORT=8010
            # Latency defaults (docs/architecture/18 6.3); the gateway can override them per call.
            - AVATAR_BATCH_SIZE=4
            - AVATAR_AHEAD_FRAMES=6
            - AVATAR_LOOKAHEAD_FRAMES=4
            - AVATAR_IDLE_FRAMES=75
            - AVATAR_AV_SHIFT_MS=160
            - AVATAR_CACHE_DIR=/avatar-cache
            - AVATAR_MAX_SESSIONS=${AVATAR_MAX_SESSIONS}
            - AVATAR_DEDICATED_GPU=${AVATAR_DEDICATED_GPU:-0}
            - AVATAR_TURN_TCP_HOST=host.docker.internal
            - TURN_SECRET=${TURN_SECRET}
            - WORKER_DOMAIN=${WORKER_DOMAIN}
            # /turn_check dials the host's own address (the public IP is NATed and does not hairpin)
            - AVATAR_TURN_HOST_ADDR=${TURN_RELAY_IP}
            - LIVETALKING_REF=${LIVETALKING_REF}
            - NVIDIA_VISIBLE_DEVICES=${AVATAR_GPU:-0}
            - NVIDIA_DRIVER_CAPABILITIES=compute,utility
          volumes:
            - /opt/acudx/hf:/hf
            - /opt/acudx/avatars:/app/data/avatars
            - ${AVATAR_CACHE:-/opt/acudx/avatar-cache}:/avatar-cache
            # The AcuDx runner code is mounted, not baked in: the image key covers only its dependencies.
            - /opt/acudx/avatar/acudx_avatar_server.py:/app/acudx_avatar_server.py:ro
            - /opt/acudx/avatar/acudx_fetch_models.py:/app/acudx_fetch_models.py:ro
            - /opt/acudx/avatar/acudx_register.py:/app/acudx_register.py:ro
        # Per-case appearance edits (FLUX.2 klein 4B, Apache-2.0); imagegen.sh starts it after the runner.
        imagegen:
          build:
            context: /opt/acudx/imagegen
          image: acudx/imagegen:flux2-klein-4b-cu128
          runtime: nvidia
          deploy:
            resources:
              reservations:
                devices:
                  - driver: nvidia
                    device_ids: ["${IMAGEGEN_GPU:-0}"]
                    capabilities: [gpu]
          environment:
            - HF_HOME=/hf
            - IMAGEGEN_PORT=8020
            # Fewer stranded blocks between edits of different sizes (the cache is emptied after each).
            - PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True
            - NVIDIA_VISIBLE_DEVICES=${IMAGEGEN_GPU:-0}
            - NVIDIA_DRIVER_CAPABILITIES=compute,utility
          volumes: [ "/opt/acudx/hf:/hf", "/opt/acudx/imagegen/acudx_imagegen.py:/app/acudx_imagegen.py:ro" ]
        # TURN for the avatar call (RFC 8656, coturn). Host networking so the relay ports reach
        # the runner's container addresses; 3478 is open publicly (lambda_cloud.py rules) and the
        # TLS listener (5349) is reached only through the edge router on 443 (turn.<domain>), with
        # the Let's Encrypt certificate Caddy obtained for that name (copied by avatar.sh).
        # DTLS is off by default in coturn 4.18; it has no --no-dtls flag (an unknown flag exits 255,
        # which is how the first TLS build lost TURN entirely, 2026-10-20).
        turn:
          image: ghcr.io/coturn/coturn:4.18.0-debian
          network_mode: host
          volumes: [ "/opt/acudx/turn-tls:/tls:ro" ]
          command: >
            -n --log-file=stdout --listening-port=3478 --fingerprint --use-auth-secret
            --static-auth-secret=${TURN_SECRET} --realm=acudx --relay-ip=${TURN_RELAY_IP}
            ${TURN_TLS_ARGS:---no-tls}
            --min-port=49160 --max-port=49260 --no-multicast-peers
            --allowed-peer-ip=172.16.0.0-172.31.255.255 --allowed-peer-ip=${TURN_RELAY_IP}
  # Voice library seeding: Chatterbox picks the synthesis language from the voice's
  # metadata, so one voice per language is uploaded once the API is up. The reference
  # clip is the repository's bundled sample; institutions replace it with consented
  # actor recordings through POST /voices (docs/architecture/18 section 4.2).
  # Boot diagnostics (review 04 O1): a stdlib HTTP server on :80 serves a redacted
  # cloud-init log and docker status under /diag/<WORKER_DIAG_SECRET>/ so the gateway can
  # read boot logs without SSH (GET /admin/gpu/boot-log). It stops by itself once vLLM's
  # /health has answered 200 for 5 minutes in a row; the last snapshot then stays readable
  # through Caddy on 443 at the same path, behind the bearer.
  - path: /opt/acudx/diag.sh
    permissions: "0755"
    content: |
      #!/usr/bin/env bash
      set -u
      . /opt/acudx/.env
      [ -n "${WORKER_TOKEN:-}" ] && [ -n "${WORKER_DIAG_SECRET:-}" ] || { echo "acudx: diag secret missing" >&2; exit 1; }
      pub=/opt/acudx/public
      d="$pub/diag/$WORKER_DIAG_SECRET"
      compose="docker compose -f /opt/acudx/docker-compose.yml"
      healthy_for_s=300
      # Only /opt/acudx/public is ever served (never .env); index files stop directory listings.
      mkdir -p "$d"
      echo "acudx worker" > "$pub/index.html"
      echo "acudx worker diagnostics" > "$pub/diag/index.html"
      # Drop every line that could carry a credential before it reaches a served file.
      # Remove credentials, not words: the old filter dropped every line containing
      # "token", which hid vLLM tokenizer errors (worker 11, 2026-10-20). Now only
      # header-shaped lines and the literal secrets are removed.
      redact() { grep -viE 'authorization:|bearer [A-Za-z0-9._-]{8,}|api[_-]?key[=:]|secret[=:]|password[=:]' | grep -vF -- "$WORKER_TOKEN" | grep -vF -- "$WORKER_DIAG_SECRET"; }
      snapshot() {
        { date -u
          echo "--- docker ps"; docker ps --format '{{.Names}} {{.Status}}' 2>&1
          for svc in vllm caddy edge avatar turn chatterbox chatterbox2 kokoro kokoro2; do
            echo "--- $svc logs (last 40 lines, redacted)"
            $compose logs --no-color --tail 40 "$svc" 2>&1 | redact
          done
          # The root cause of a vLLM start-up failure sits far above the final traceback.
          echo "--- vllm root-cause lines (errors and memory, redacted)"
          $compose logs --no-color vllm 2>&1 | grep -E 'Error|error|Exception|CUDA|memory|Memory|OOM|insufficient|ValueError|Traceback|raise ' | tail -60 | redact
          echo "--- chatterbox torch check"; redact < /var/log/acudx-chatterbox-gpu.log 2>/dev/null
          echo "--- chatterbox voice seeding"; tail -8 /var/log/acudx-seed-voices.log 2>/dev/null
          echo "--- avatar status"; cat /opt/acudx/public/avatar-status/status.json 2>/dev/null
          echo "--- avatar bring-up (last 20 lines)"; tail -20 /var/log/acudx-avatar.log 2>/dev/null | redact
          echo "--- avatar image build (last 15 lines)"; tail -15 /var/log/acudx-avatar-build.log 2>/dev/null | redact
          echo "--- imagegen bring-up and build (last 10 + 10 lines)"; tail -10 /var/log/acudx-imagegen.log 2>/dev/null | redact
          tail -10 /var/log/acudx-imagegen-build.log 2>/dev/null | redact
          echo "--- imagegen logs (last 20 lines)"; docker compose -f /opt/acudx/docker-compose.yml logs --tail 20 imagegen 2>/dev/null | redact
          echo "--- nvidia-smi"; nvidia-smi --query-gpu=name,memory.total,memory.used --format=csv 2>&1
        } > "$d/docker-status.txt.tmp"
        mv "$d/docker-status.txt.tmp" "$d/docker-status.txt"
        redact < /var/log/cloud-init-output.log > "$d/cloud-init-output.log.tmp" 2>/dev/null
        mv "$d/cloud-init-output.log.tmp" "$d/cloud-init-output.log"
        chmod 0644 "$d/docker-status.txt" "$d/cloud-init-output.log"
      }
      python3 -m http.server 80 --bind 0.0.0.0 --directory "$pub" >/var/log/acudx-diag.log 2>&1 &
      srv=$!
      healthy_since=""
      while true; do
        snapshot
        if $compose exec -T vllm curl -sf -o /dev/null http://localhost:8000/health >/dev/null 2>&1; then
          now=$(date +%s)
          [ -n "$healthy_since" ] || healthy_since=$now
          if [ $((now - healthy_since)) -ge "$healthy_for_s" ]; then
            kill "$srv" 2>/dev/null
            # The side-cars (avatar runner, coturn, Kokoro) come up after vLLM, so the snapshot keeps
            # refreshing every 60 s, readable only through Caddy on 443 behind the bearer (live
            # finding 2026-10-20: a coturn start failure was invisible in the frozen snapshot).
            while true; do
              snapshot
              echo "--- diagnostics server on :80 stopped after vLLM /health answered 200 for ${healthy_for_s} s; snapshot refreshed $(date -u) and served by Caddy on 443 behind the bearer" >> "$d/docker-status.txt"
              sleep 60
            done
          fi
        else
          healthy_since=""
        fi
        sleep 30
      done
  - path: /opt/acudx/seed-voices.sh
    permissions: "0755"
    content: |
      #!/usr/bin/env bash
      # The API is only on the compose network (no host port), so seed from inside the container,
      # and only once the model is loaded: /health answers 200 while initializing (and on an init
      # error). Before this, every upload went to 127.0.0.1:4123 on the host and failed, the library
      # stayed empty, and an unknown voice fell back to the default sample with language "en", so
      # Turkish text was synthesised as English (live finding 2026-10-20).
      set -u
      compose="docker compose -f /opt/acudx/docker-compose.yml"
      seed() {
        local svc=$1
        for i in $(seq 1 180); do
          $compose exec -T "$svc" curl -sf http://localhost:4123/health 2>/dev/null | grep -q '"initialization_state":"ready"' && break
          sleep 10
        done
        # Each replica keeps the library metadata in memory, so each one gets the uploads (the files
        # and metadata live on the shared /voices volume).
        for spec in acudx_tr_female:tr acudx_tr_male:tr acudx_en_female:en acudx_en_male:en; do
          name=${spec%%:*}; lang=${spec##*:}
          $compose exec -T "$svc" curl -sf -X POST http://localhost:4123/voices -F "voice_name=$name" \
            -F "language=$lang" -F "voice_file=@/app/voice-sample.mp3" >/dev/null \
            && echo "acudx: $svc voice $name ($lang) seeded" \
            || echo "acudx: $svc voice $name already present or upload failed" >&2
        done
        # Warm-up: the first synthesis on a fresh container took 13.6 s (CUDA kernels, conditionals),
        # the next ones 1.4 to 2.7 s; pay it here, not on a learner's first patient line. Every seeded
        # voice goes through the streaming route once, so its conditionals are in the AcuDx cache
        # (app/acudx_patch.py) before the first call.
        for v in acudx_tr_female acudx_tr_male acudx_en_female acudx_en_male; do
          $compose exec -T "$svc" curl -sf -o /dev/null -X POST http://localhost:4123/v1/audio/speech/stream \
            -H "Content-Type: application/json" \
            -d "{\"input\": \"Merhaba doktor, hazırım. Buyurun, sizi dinliyorum.\", \"voice\": \"$v\", \"streaming_chunk_size\": 60, \"streaming_strategy\": \"sentence\"}" \
            && echo "acudx: $svc warm-up with $v done"
        done
        $compose exec -T "$svc" curl -sf http://localhost:4123/acudx/stats | head -c 400 && echo
      }
      seed chatterbox
      [ -n "$($compose ps -q chatterbox2 2>/dev/null)" ] && seed chatterbox2
      # Kokoro (both replicas) loads its voice pack on the first request.
      for k in kokoro kokoro2; do
        $compose exec -T caddy wget -q -O /dev/null --header "Content-Type: application/json" \
          --post-data '{"model":"kokoro","input":"Hello doctor, I am ready.","voice":"af_heart","response_format":"wav"}' \
          "http://$k:8880/v1/audio/speech" && echo "acudx: $k warm-up done"
      done
  - path: /opt/acudx/avatar/Dockerfile.acudx
    content: |
      # AcuDx avatar runner: LiveTalking @ c7269433a2b6ecebcd9342445d2ecc882c98b0da + MuseTalk 1.5.
      # Built on the worker from the pinned checkout (no published LiveTalking image). torch 2.9.1 cu128
      # is what the LiveTalking README tests (Ubuntu 24.04, Python 3.12, CUDA 12.8); the wheels carry
      # their own CUDA runtime, so the base is a plain Python image.
      FROM python:3.12-slim-bookworm
      ENV PYTHONUNBUFFERED=1 PYTHONDONTWRITEBYTECODE=1 DEBIAN_FRONTEND=noninteractive PIP_NO_CACHE_DIR=1
      RUN apt-get update && apt-get install -y --no-install-recommends ffmpeg libgl1 libglib2.0-0 curl ca-certificates \
          && rm -rf /var/lib/apt/lists/*
      WORKDIR /app
      ARG TORCH_INDEX_URL=https://download.pytorch.org/whl/cu128
      ARG TORCH_VARIANT=+cu128
      RUN pip install "torch==2.9.1${TORCH_VARIANT}" "torchvision==0.24.1${TORCH_VARIANT}" "torchaudio==2.9.1${TORCH_VARIANT}" \
          --index-url "${TORCH_INDEX_URL}"
      COPY acudx-constraints.txt /tmp/acudx-constraints.txt
      COPY requirements.txt /tmp/livetalking-requirements.txt
      RUN printf 'torch==2.9.1%s\ntorchvision==0.24.1%s\ntorchaudio==2.9.1%s\n' "${TORCH_VARIANT}" "${TORCH_VARIANT}" \
            "${TORCH_VARIANT}" >> /tmp/acudx-constraints.txt \
          && pip install -c /tmp/acudx-constraints.txt -r /tmp/livetalking-requirements.txt \
             huggingface_hub dlib-bin face_recognition_models click pillow \
          && pip install --no-deps -c /tmp/acudx-constraints.txt face_recognition
      RUN python -c "import torch, aiortc, cv2, face_recognition, diffusers, transformers; print('torch', torch.__version__, 'cuda build', torch.version.cuda)"
      COPY . /app
      EXPOSE 8010
      HEALTHCHECK --interval=20s --timeout=10s --start-period=15m --retries=3 CMD curl -sf http://localhost:8010/health || exit 1
      CMD ["sh", "-c", "python acudx_fetch_models.py && exec python acudx_avatar_server.py"]
