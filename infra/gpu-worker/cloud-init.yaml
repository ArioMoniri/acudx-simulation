      TRACE: dict = {}


      def _push_audio(self, frame, eventpoint=None):
          MEDIA["audio_frames"] += 1
          peak = int(np.abs(frame).max()) if frame.size else 0
          if peak > 64:
              MEDIA["audio_frames_with_sound"] += 1
              MEDIA["audio_peak"] = max(MEDIA["audio_peak"], peak)
              t_in = TRACE.get("speech_in_at")
              if t_in is not None and TRACE.get("speech_out_at") is None:
                  TRACE["speech_out_at"] = time.monotonic()
                  a = getattr(self, "_HumanPlayer__audio", None)
                  v = getattr(self, "_HumanPlayer__video", None)
                  TRACE["last"] = {"in_to_sender_ms": round((TRACE["speech_out_at"] - t_in) * 1000.0, 1),
                                   "audio_queue_frames": a._queue.qsize() if a is not None else None,
                                   "video_queue_frames": v._queue.qsize() if v is not None else None}
          return _orig_push_audio(self, frame, eventpoint)


      def _push_video(self, frame):
