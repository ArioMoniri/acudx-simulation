  - path: /opt/acudx/imagegen/acudx_imagegen.py
    content: |
      """AcuDx image edit server (FLUX.2 [klein] 4B, Apache-2.0), behind Caddy's bearer at /imagegen/*.

        GET  /health   {ok, loaded, model, revision, mode, gpu, stats}; ok only once the weights are loaded
        POST /edit     {image_b64 (jpeg/png), prompt, seed, steps (1-8, default 4), width?, height?}
                       -> image/jpeg; headers X-Gen-Ms, X-Mode, X-Steps, X-Seed

      Mode: "gpu" when the card has room for the whole pipeline (IMAGEGEN_FULL_MB free), else "offload"
      (diffusers model CPU offload: only the module that runs sits on the GPU, about 9 GB peak), else
      "sequential" (layer by layer, a few GB, slow), else the server reports ok false with reason
      insufficient_vram. One edit at a time (a lock), run in a thread so /health stays responsive. The
      gateway is the only client.
      """

      from __future__ import annotations

      import asyncio
      import base64
      import io
      import logging
      import os
      import threading
      import time

      import torch
      from aiohttp import web
      from PIL import Image

      REPO = os.environ.get("IMAGEGEN_REPO", "black-forest-labs/FLUX.2-klein-4B")
      REVISION = os.environ.get("IMAGEGEN_REVISION", "e7b7dc27f91deacad38e78976d1f2b499d76a294")
      PORT = int(os.environ.get("IMAGEGEN_PORT", "8020"))
      FULL_MB = int(os.environ.get("IMAGEGEN_FULL_MB", "20000"))
      OFFLOAD_MB = int(os.environ.get("IMAGEGEN_OFFLOAD_MB", "9000"))
      SEQUENTIAL_MB = int(os.environ.get("IMAGEGEN_SEQUENTIAL_MB", "3000"))
      MAX_SIDE = 1024

      log = logging.getLogger("acudx.imagegen")
      logging.basicConfig(level=logging.INFO, format="%(asctime)s %(levelname)s %(name)s %(message)s")
      STATE: dict = {"loaded": False, "mode": None, "reason": None, "load_ms": None, "edits": 0, "last_ms": None,
                     "started_at": time.time()}
      PIPE = None
      LOCK = threading.Lock()


      def _free_mb() -> int:
          free, _total = torch.cuda.mem_get_info()
          return free // 2**20


      def load() -> None:
          global PIPE
          t = time.monotonic()
          try:
              from diffusers import Flux2KleinPipeline  # noqa: PLC0415

              free = _free_mb()
              if free < SEQUENTIAL_MB:
                  STATE.update(reason=f"insufficient_vram: {free} MB free, {SEQUENTIAL_MB} MB needed")
                  log.warning(STATE["reason"])
                  return
              # Weights only (the repository also carries a single-file checkpoint of the same model).
              from huggingface_hub import snapshot_download  # noqa: PLC0415

              path = snapshot_download(REPO, revision=REVISION, allow_patterns=[
                  "model_index.json", "scheduler/*", "text_encoder/*", "tokenizer/*", "transformer/*", "vae/*"])
              pipe = Flux2KleinPipeline.from_pretrained(path, torch_dtype=torch.bfloat16)
              if free >= FULL_MB:
                  pipe.to("cuda")
                  mode = "gpu"
              elif free >= OFFLOAD_MB:
                  pipe.enable_model_cpu_offload()
                  mode = "offload"
              else:
                  # 40 GB cards after vLLM, voice and the runner: layer by layer, slow but a few GB.
                  pipe.enable_sequential_cpu_offload()
                  mode = "sequential"
              pipe.set_progress_bar_config(disable=True)
              PIPE = pipe
              # Warm-up edit: the first real edit on a fresh worker took 147 to 154 s (weights paged in
              # from the network filesystem, kernels picked), the next ones 14 to 16 s (live 2026-10-21).
              # Pay that here, before /health reports loaded.
              w0 = time.monotonic()
              try:
                  _edit(Image.new("RGB", (512, 512), (128, 128, 128)), "a grey square", 0, 2, 512, 512)
              except Exception as exc:  # noqa: BLE001 - reported, the server still serves
                  log.warning("imagegen warm-up failed: %s", type(exc).__name__)
              STATE.update(loaded=True, mode=mode, reason=None, free_mb_at_load=free,
                           warm_ms=round((time.monotonic() - w0) * 1000.0, 1),
                           load_ms=round((time.monotonic() - t) * 1000.0, 1))
              log.info("FLUX.2 klein 4B loaded (%s, %s MB free) in %.0f ms", mode, free, STATE["load_ms"])
          except Exception as exc:  # noqa: BLE001 - reported in /health
              STATE.update(reason=f"load_failed: {type(exc).__name__}: {exc}"[:300])
              log.exception("imagegen load failed")


      def _edit(image: Image.Image, prompt: str, seed: int, steps: int, width: int, height: int) -> Image.Image:
          gen = torch.Generator(device="cuda").manual_seed(seed)
          with LOCK, torch.inference_mode():
              try:
                  try:
                      out = PIPE(image=image, prompt=prompt, width=width, height=height, num_inference_steps=steps,
                                 guidance_scale=1.0, generator=gen)
                  except TypeError:
                      out = PIPE(image=image, prompt=prompt, num_inference_steps=steps, generator=gen)
              finally:
                  # Give the card back after every edit. Live 2026-10-21 on an A100 40 GB: after eight
                  # edits this process held 8.8 GB in torch's cache with 82 MB left on the card, so the
                  # call's runner could not prepare the next face and both answered 500.
                  if torch.cuda.is_available():
                      torch.cuda.empty_cache()
          return out.images[0]


      def _size(w: int, h: int) -> tuple[int, int]:
          s = min(1.0, MAX_SIDE / max(w, h))
          return max(256, int(w * s) // 16 * 16), max(256, int(h * s) // 16 * 16)


      async def health(_r: web.Request) -> web.Response:
          gpu = {}
          if torch.cuda.is_available():
              free, total = torch.cuda.mem_get_info()
              gpu = {"name": torch.cuda.get_device_name(0), "free_mb": free // 2**20, "total_mb": total // 2**20,
                     "reserved_mb": torch.cuda.memory_reserved() // 2**20}
          return web.json_response({"ok": bool(STATE["loaded"]), "model": REPO, "revision": REVISION,
                                    "licence": "Apache-2.0", **STATE, "gpu": gpu})


      async def edit(request: web.Request) -> web.Response:
          if not STATE["loaded"]:
              return web.json_response({"error": "not_loaded", "reason": STATE["reason"]}, status=503)
          body = await request.json()
          try:
              raw = base64.b64decode(str(body.get("image_b64") or ""), validate=True)
              src = Image.open(io.BytesIO(raw)).convert("RGB")
          except Exception:  # noqa: BLE001
              return web.json_response({"error": "bad_image"}, status=400)
          prompt = str(body.get("prompt") or "").strip()[:2000]
          if not prompt:
              return web.json_response({"error": "prompt required"}, status=400)
          seed = int(body.get("seed") or 0) & 0x7FFFFFFF
          steps = max(1, min(8, int(body.get("steps") or 4)))
          w, h = _size(int(body.get("width") or src.width), int(body.get("height") or src.height))
          t = time.monotonic()
          try:
              out = await asyncio.get_running_loop().run_in_executor(None, _edit, src.resize((w, h), Image.LANCZOS),
                                                                     prompt, seed, steps, w, h)
          except torch.cuda.OutOfMemoryError:
              # The card is shared with live calls (a runner preparing a picture takes a few GB for a
              # while); give the memory back and let the gateway retry.
              torch.cuda.empty_cache()
              STATE["oom"] = STATE.get("oom", 0) + 1
              return web.json_response({"error": "oom", "free_mb": _free_mb()}, status=503)
          except Exception as exc:  # noqa: BLE001 - reported to the gateway, which retries 5xx
              log.exception("edit failed")
              return web.json_response({"error": "edit_failed", "detail": type(exc).__name__}, status=500)
          ms = round((time.monotonic() - t) * 1000.0, 1)
          out = out.convert("RGB").resize((src.width, src.height), Image.LANCZOS)
          buf = io.BytesIO()
          out.save(buf, format="JPEG", quality=93)
          STATE["edits"] += 1
          STATE["last_ms"] = ms
          return web.Response(body=buf.getvalue(), content_type="image/jpeg", headers={
              "X-Gen-Ms": str(ms), "X-Mode": str(STATE["mode"]), "X-Steps": str(steps), "X-Seed": str(seed)})


      def main() -> None:
          threading.Thread(target=load, daemon=True).start()
          app = web.Application(client_max_size=16 * 1024 * 1024)
          app.router.add_get("/health", health)
          app.router.add_post("/edit", edit)
          web.run_app(app, host="0.0.0.0", port=PORT, access_log=None)


      if __name__ == "__main__":
          main()
