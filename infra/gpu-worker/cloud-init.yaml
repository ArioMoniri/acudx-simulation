      def framing_differs(shape_a, box_a, shape_b, box_b, tol: float = 0.06) -> bool:
          """True when two avatars' frames differ in size, or their face boxes differ in centre or size by
          more than ``tol`` of the face height: a cross-fade between them would show two faces, so /switch
          cuts instead (a look prepared before registration, or one ``align_to`` could not place)."""
          if tuple(shape_a[:2]) != tuple(shape_b[:2]):
              return True
          ax1, ay1, ax2, ay2 = (float(v) for v in box_a)
          bx1, by1, bx2, by2 = (float(v) for v in box_b)
          fh = max(1.0, ay2 - ay1)
          return (abs((ax1 + ax2) - (bx1 + bx2)) / 2.0 > tol * fh or abs((ay1 + ay2) - (by1 + by2)) / 2.0 > tol * fh
                  or abs((ax2 - ax1) - (bx2 - bx1)) > tol * fh or abs((ay2 - ay1) - (by2 - by1)) > tol * fh)


      def extend_portrait(img: np.ndarray, top: int, bottom: int, left: int, right: int) -> np.ndarray:
          """Grow the portrait on the sides that need it without streaks. Right at the seam the border
          is the mirrored image (texture continues, no hard edge); within ``feather`` px it fades into
          the edge colours smeared outwards and blurred across (replicate, then a wide Gaussian), so the
          old edge-replicate streaks are averaged away and no mirrored features (a second chin, an ear)
          appear. The original pixels are kept exactly."""
          if max(top, bottom, left, right) <= 0:
              return img
          h, w = img.shape[:2]
          mirrored = cv2.copyMakeBorder(img, top, bottom, left, right, cv2.BORDER_REFLECT_101)
          smeared = cv2.copyMakeBorder(img, top, bottom, left, right, cv2.BORDER_REPLICATE)
          pad = max(top, bottom, left, right)
          sigma = max(8.0, pad / 2.0)
          blurred = cv2.GaussianBlur(smeared, (0, 0), sigmaX=sigma, sigmaY=sigma, borderType=cv2.BORDER_REPLICATE)
          H, W = mirrored.shape[:2]
          ys = np.arange(H, dtype=np.float32)[:, None]
          xs = np.arange(W, dtype=np.float32)[None, :]
          dx = np.maximum(np.maximum(left - xs, xs - (left + w - 1)), 0.0)
          dy = np.maximum(np.maximum(top - ys, ys - (top + h - 1)), 0.0)
          d = np.sqrt(dx * dx + dy * dy)
          feather = float(max(6, min(16, pad // 3)))
          keep = np.clip(1.0 - d / feather, 0.0, 1.0)
          keep = (keep * keep * (3.0 - 2.0 * keep))[..., None]  # smoothstep: no visible seam in the fade
          out = keep * mirrored.astype(np.float32) + (1.0 - keep) * blurred.astype(np.float32)
          out[top:top + h, left:left + w] = img
          return np.clip(out, 0, 255).astype(np.uint8)


      def _ease(u: float, k: int) -> float:
          """(1 - cos(k pi u)) / 2: zero velocity at u = 0 and u = 1, so LiveTalking's ping-pong
          playback of the loop (mirror_index) turns around without a jolt."""
          return (1.0 - math.cos(k * math.pi * u)) / 2.0


      def idle_transforms(n: int, box: list[int]) -> list[np.ndarray]:
          """Affine transforms for a subtle idle head motion around a pivot under the chin: a slow
          sway (+-0.7 degrees), a small nod (1.2 px) and a slight drift (0.8 px); identity for n == 1."""
          x1, y1, x2, y2 = box
          bh = y2 - y1
          pivot = ((x1 + x2) / 2.0, y2 + 0.25 * bh)
          out = []
          for t in range(n):
              u = t / (n - 1) if n > 1 else 0.0
              angle = 0.7 * (2.0 * _ease(u, 1) - 1.0) if n > 1 else 0.0
              nod = 1.2 * _ease(u, 2) if n > 1 else 0.0
              drift = 0.8 * (2.0 * _ease(u, 3) - 1.0) if n > 1 else 0.0
              m = cv2.getRotationMatrix2D(pivot, angle, 1.0 + 0.003 * _ease(u, 2))
              m[0, 2] += drift
              m[1, 2] += nod
              out.append(m)
          return out


      def head_mask(shape: tuple, box: list[int]) -> np.ndarray:
          """Soft ellipse over the head (face box, hair above, chin), 1 inside, feathered: only the head
          moves in the idle loop, shoulders and background stay still."""
          x1, y1, x2, y2 = box
          bw, bh = x2 - x1, y2 - y1
          top, bottom = y1 - 0.75 * bh, y2 + 0.12 * bh
          center = (int(round((x1 + x2) / 2.0)), int(round((top + bottom) / 2.0)))
          axes = (int(round(0.85 * bw)), int(round((bottom - top) / 2.0)))
          m = np.zeros(shape[:2], dtype=np.float32)
          cv2.ellipse(m, center, axes, 0, 0, 360, 1.0, -1)
          sigma = max(3.0, 0.12 * bh)
          return cv2.GaussianBlur(m, (0, 0), sigmaX=sigma, sigmaY=sigma)[..., None]


      def _box_after(m: np.ndarray, box: list[int], shape: tuple) -> list[int]:
          x1, y1, x2, y2 = box
          pts = np.array([[x1, y1, 1], [x2, y1, 1], [x1, y2, 1], [x2, y2, 1]], dtype=np.float32) @ m.T
          cx, cy = pts[:, 0].mean(), pts[:, 1].mean()
          w, h = x2 - x1, y2 - y1
          nx1, ny1 = int(round(cx - w / 2.0)), int(round(cy - h / 2.0))
          nx1 = max(0, min(nx1, shape[1] - w))
          ny1 = max(0, min(ny1, shape[0] - h))
          return [nx1, ny1, nx1 + w, ny1 + h]


      def replay_steps(img: np.ndarray, steps: list) -> np.ndarray:
          """Repeat a base portrait's preparation (resizes, even crops, extensions) on another picture of
          the same size, so a variant gets exactly the base's frame."""
          for step in steps:
              kind = step[0]
              if kind == "resize":
                  img = cv2.resize(img, (int(step[1]), int(step[2])), interpolation=cv2.INTER_AREA)
              elif kind == "crop":
                  img = img[: int(step[2]), : int(step[1])]
              elif kind == "extend":
                  img = extend_portrait(img, *(int(v) for v in step[1:5]))
          return img


      def _base_info(ref: str) -> dict:
          with open(os.path.join(_avatar_dir(ref), "avator_info.json")) as f:
              return json.load(f)


      def prepare_avatar(avatar_id: str, image_bytes: bytes, idle_frames: int | None = None,
                         ref: str | None = None, priority: int = PREP_PRIORITY_LADDER) -> dict:
          """Prepare once per picture: a second request for the same picture (same content key) returns the
          existing preparation, a picture another worker prepared is copied from AVATAR_CACHE_DIR, anything
          else is prepared in PREP_QUEUE order (a call's picture before the case's look ladder)."""
          started = time.monotonic()
          n = max(1, min(int(idle_frames if idle_frames is not None else IDLE_FRAMES), 150))
          if ref:
              if not _is_prepared(ref) or not os.path.isfile(os.path.join(_avatar_dir(ref), "source.png")):
                  raise RefNotPrepared(ref)
              n = int(_base_info(ref).get("idle_frames") or n)
          key = content_key(image_bytes, ref, n)
          # Already prepared on this worker: answered at once, not behind the preparation in progress (live
          # 2026-10-22 a call's portrait, prepared before, waited 14.7 s in the queue behind a look of the ladder).
          if _prepared_key(avatar_id) == key:
              _load(avatar_id)
              return _info_reply(avatar_id, False, cached="local", queue_ms=0.0,
                                 prepare_ms=round((time.monotonic() - started) * 1000.0, 1))
          queued = time.monotonic()
          PREP_QUEUE.acquire(priority)
          try:
              waited = round((time.monotonic() - queued) * 1000.0, 1)
              if _prepared_key(avatar_id) == key:
                  _load(avatar_id)
                  return _info_reply(avatar_id, False, cached="local", queue_ms=waited,
                                     prepare_ms=round((time.monotonic() - started) * 1000.0, 1))
              if _from_cache(avatar_id, key):
                  AVATARS.pop(avatar_id, None)
                  _load(avatar_id)
                  ms = round((time.monotonic() - started) * 1000.0, 1)
                  STATE["prepare_ms"][avatar_id] = ms
                  return _info_reply(avatar_id, True, cached="filesystem", queue_ms=waited, prepare_ms=ms)
              PREP_YIELDS["on"] = priority != PREP_PRIORITY_CALL
              info = _prepare_locked(avatar_id, image_bytes, n, ref, key)
          finally:
              PREP_YIELDS["on"] = True
              PREP_QUEUE.release()
          threading.Thread(target=_to_cache, args=(avatar_id, key), daemon=True).start()
          info.update({"prepared": True, "cached": None, "queue_ms": waited, "content_key": key,
                       "prepare_ms": round((time.monotonic() - started) * 1000.0, 1)})
          STATE["prepare_ms"][avatar_id] = info["prepare_ms"]
          return info


      @torch.no_grad()
      def _prepare_locked(avatar_id: str, image_bytes: bytes, n: int, ref: str | None, key: str) -> dict:
          """Portrait -> MuseTalk avatar: an idle loop of ``idle_frames`` frames (latents, face boxes,
          blend masks per frame). 1 frame = the still portrait.

          ``ref``: the base avatar this picture is an edit of (the same patient in another state). The
          picture is registered onto the base's source portrait (acudx_register.align_to), then gets the
          base's own preparation steps and face box, so base and variant share one frame, crop and
          landmarks and a cross-fade between them shows one face, never two."""
          started = time.monotonic()
          phases: dict = {}
          img = cv2.imdecode(np.frombuffer(image_bytes, dtype=np.uint8), cv2.IMREAD_COLOR)
          if img is None:
              raise ValueError("image could not be decoded")
          registration = None
          detect_info = None
          base = None
          coords = None
          steps: list = []
          padded = 0
          root = _avatar_dir(avatar_id)
          full_dir = os.path.join(root, "full_imgs")
          mask_dir = os.path.join(root, "mask")
          if ref:
              if not _is_prepared(ref) or not os.path.isfile(os.path.join(_avatar_dir(ref), "source.png")):
                  raise RefNotPrepared(ref)
              info = _base_info(ref)
              src = cv2.imread(os.path.join(_avatar_dir(ref), "source.png"), cv2.IMREAD_COLOR)
              img, registration = acudx_register.align_to(src, img)
              steps = [list(s) for s in info.get("steps") or []]
              padded = int(info.get("extended_px") or 0)
              base = replay_steps(img, steps)
              coords = [int(v) for v in info["face_box"]]
              if base.shape[1] != int(info["width"]) or base.shape[0] != int(info["height"]):
                  raise ValueError("registered picture does not match the base frame")
              n = int(info.get("idle_frames") or n)
          for d in (full_dir, mask_dir):
              os.makedirs(d, exist_ok=True)
              for f in os.listdir(d):
                  os.remove(os.path.join(d, f))
          cv2.imwrite(os.path.join(root, "source.png"), img)
          if base is None:
              h, w = img.shape[:2]
              if h > MAX_FRAME_H:
                  scale = MAX_FRAME_H / h
                  img = cv2.resize(img, (int(w * scale), MAX_FRAME_H), interpolation=cv2.INTER_AREA)
                  steps.append(["resize", img.shape[1], img.shape[0]])
                  h, w = img.shape[:2]
              # H.264 and VP8 encoders want even dimensions.
              img = img[: h - h % 2, : w - w % 2]
              steps.append(["crop", img.shape[1], img.shape[0]])
              raw_box = _detect_fixed(img, os.path.join(root, "detect.png"))
              detect_info = dict(STATE.get("last_detect") or {})
              if raw_box is None:
                  raise NoFace("no face found in the portrait")
              # One detection: after a resize or an extension the box is moved with the picture (scaled,
              # then shifted by the added top and left borders) instead of detected again. Live 2026-10-22
              # (H100): each detection took 3 to 4 s and a close-up portrait needed two or three.
              raw = list(raw_box)
              phases["detections"] = 1
              # Each pass only moves the box (no detection), so a close-up can take several small passes.
              for _attempt in range(8):
                  phases["extend_passes"] = _attempt
                  frame = img
                  x1, y1, x2, y2 = (int(round(v)) for v in raw)
                  x1, y1 = max(0, x1), max(0, y1)
                  x2, y2 = min(x2, frame.shape[1]), min(y2, frame.shape[0])
                  y2 = min(y2 + 10, frame.shape[0])  # v1.5 extra_margin, as in genavatar.py
                  coords = [x1, y1, x2, y2]
                  # The blend step pastes into the face box expanded 1.5x (blending.get_crop_box). A
                  # close-up portrait puts that box outside the frame, every speaking frame then fails
                  # in paste_back_frame and is dropped together with its audio, so the call is silent.
                  # Extend the portrait (mirrored, blurred; see extend_portrait) until the expanded box
                  # fits with room for the idle motion, then detect again.
                  (cx1, cy1, cx2, cy2), _s = get_crop_box(coords, 1.5)
                  fh, fw = frame.shape[:2]
                  margin = 12
                  need = [max(0, -cy1), max(0, cy2 - fh), max(0, -cx1), max(0, cx2 - fw)]  # top, bottom, left, right
                  if max(need) == 0:
                      break
                  sides = [k + margin if k else 0 for k in need]
                  # Keep the result within MAX_FRAME_H by shrinking the portrait first (the face box and
                  # so the needed border shrink with it), instead of padding and then shrinking again.
                  grown_h = img.shape[0] + sides[0] + sides[1]
                  if grown_h > MAX_FRAME_H:
                      s = MAX_FRAME_H / float(grown_h)
                      oh, ow = img.shape[:2]
                      img = cv2.resize(img, (int(img.shape[1] * s), int(img.shape[0] * s)), interpolation=cv2.INTER_AREA)
                      steps.append(["resize", img.shape[1], img.shape[0]])
                      sides = [int(math.ceil(k * s)) if k else 0 for k in sides]
                      sx, sy = img.shape[1] / float(ow), img.shape[0] / float(oh)
                      raw = [raw[0] * sx, raw[1] * sy, raw[2] * sx, raw[3] * sy]
                  padded = max(padded, max(sides))
                  img = extend_portrait(img, *sides)
                  steps.append(["extend", *sides])
                  raw = [raw[0] + sides[2], raw[1] + sides[0], raw[2] + sides[2], raw[3] + sides[0]]
                  img = img[: img.shape[0] - img.shape[0] % 2, : img.shape[1] - img.shape[1] % 2]
                  steps.append(["crop", img.shape[1], img.shape[0]])
              else:
                  raise NoFace("the face fills the portrait; no room for the blend box")
              base = frame
          phases["detect_ms"] = (time.monotonic() - started) * 1000.0
          mask = head_mask(base.shape, coords) if n > 1 else None
          coords_list, mask_coords, latents = [], [], []
          writes: list = []
          png = [int(cv2.IMWRITE_PNG_COMPRESSION), PNG_LEVEL]
          frames_boxes = []
          for i, m in enumerate(idle_transforms(n, coords)):
              if mask is not None and i > 0:
                  warped = cv2.warpAffine(base, m, (base.shape[1], base.shape[0]), flags=cv2.INTER_LINEAR,
                                          borderMode=cv2.BORDER_REFLECT_101)
                  fr = np.clip(mask * warped.astype(np.float32) + (1.0 - mask) * base.astype(np.float32),
                               0, 255).astype(np.uint8)
                  box = _box_after(m, coords, base.shape)
              else:
                  fr, box = base, list(coords)
              frames_boxes.append((fr, box))

          def _parse(item):
              # Face parsing is mostly CPU work around a small GPU forward: PARSERS threads run it side by
              # side (live 2026-10-22, H100: 92 ms a frame, 6.9 s of a 20 s preparation, one at a time).
              _yield_to_speech()
              with torch.no_grad():
                  return get_image_prepare_material(item[0], item[1], fp=FACE_PARSER, mode="jaw")

          t2 = time.monotonic()
          parsed = PARSERS.map(_parse, frames_boxes)
          for i, (fr, box) in enumerate(frames_boxes):
              _yield_to_speech()
              bx1, by1, bx2, by2 = box
              t1 = time.monotonic()
              crop = cv2.resize(fr[by1:by2, bx1:bx2], (256, 256), interpolation=cv2.INTER_LANCZOS4)
              latents.append(VAE.get_latents_for_unet(crop))
              phases["vae_ms"] = phases.get("vae_ms", 0.0) + (time.monotonic() - t1) * 1000.0
          for i, ((fr, box), (fmask, crop_box)) in enumerate(zip(frames_boxes, parsed)):
              name = f"{i:08d}.png"
              # The PNG writes run beside the remaining parsing (cv2 releases the GIL).
              writes.append(WRITER.submit(cv2.imwrite, os.path.join(full_dir, name), fr, png))
              writes.append(WRITER.submit(cv2.imwrite, os.path.join(mask_dir, name), fmask, png))
              coords_list.append(box)
              mask_coords.append(crop_box)
          phases["vae_parse_ms"] = (time.monotonic() - t2) * 1000.0
          t4 = time.monotonic()
          for w in writes:
              w.result()
          phases["write_wait_ms"] = (time.monotonic() - t4) * 1000.0
          with open(os.path.join(root, "mask_coords.pkl"), "wb") as f:
              pickle.dump(mask_coords, f)
          with open(os.path.join(root, "coords.pkl"), "wb") as f:
              pickle.dump(coords_list, f)
          torch.save(latents, os.path.join(root, "latents.pt"))
          with open(os.path.join(root, "avator_info.json"), "w") as f:
              json.dump({"avatar_id": avatar_id, "video_path": "portrait", "bbox_shift": 0,
                         "acudx_prep": PREP_VERSION, "idle_frames": n, "extended_px": padded,
                         "face_box": [int(v) for v in coords], "width": int(base.shape[1]),
                         "height": int(base.shape[0]), "steps": steps, "ref": ref,
                         "registration": registration, "content_key": key}, f)
          AVATARS.pop(avatar_id, None)
          t5 = time.monotonic()
          _load(avatar_id)
          phases["load_ms"] = (time.monotonic() - t5) * 1000.0
          ms = round((time.monotonic() - started) * 1000.0, 1)
          # Hand the preparation's VAE and face-parser buffers back: on a shared 40 GB card the image edit
          # server needs them for the next picture (live 2026-10-21: every edit after the first ran out
          # of memory while a call was up).
          if torch.cuda.is_available():
              torch.cuda.empty_cache()
          return {"avatar_id": avatar_id, "width": int(base.shape[1]), "height": int(base.shape[0]),
                  "face_box": [int(v) for v in coords], "idle_frames": n, "extended_px": padded,
                  "extension": "mirrored+blurred" if padded else "none", "prepare_ms": ms, "ref": ref,
                  "registration": registration, "phases_ms": {k: round(v, 1) for k, v in phases.items()},
                  "detect": detect_info}


      class RefNotPrepared(ValueError):
          pass


      # (h, w) every detection runs on: half the frame. A portrait's face fills a third of it or more, and
      # the box is scaled back (about 2 px of rounding at 720 px).
      DETECT_CANVAS = (MAX_FRAME_H // 2, 384)
      # A preparation pauses between frames while a call on this GPU speaks (at most this long per pause):
      # live 2026-10-22 (H100 SXM5) the case's look ladder, prepared during the first lines of a call that
      # opened on the portrait, cut the runner to 64.7 fps with 88 underruns and slowed the voice.
      PREP_YIELD_MAX_S = float(os.environ.get("AVATAR_PREP_YIELD_MAX_S", "20"))


      # False while the picture a learner's call is waiting for is prepared (priority call): that one never
      # pauses. PREP_QUEUE runs one preparation at a time, so one flag is enough.
      PREP_YIELDS = {"on": True}


      def _yield_to_speech() -> None:
          # Also on a card of its own: the image edits and the ladder's preparations share it with the runner
          # (live 2026-10-22, 2x H100: 68 fps and 31 underruns while six looks were prepared during the lines).
          if not PREP_YIELDS["on"]:
              return
          t0 = time.monotonic()
          while time.monotonic() - t0 < PREP_YIELD_MAX_S:
              if not any(getattr(v, "speaking", False) for v in list(session_manager.sessions.values()) if v is not None):
                  return
              time.sleep(0.05)


      DETECT_MODE = os.environ.get("AVATAR_DETECT_MODE", "fast")   # fast | legacy (MuseTalk's get_landmark_and_bbox steps)
      # dlib HOG upsampling for the landmarks' face location in fast mode. 1 is upstream's (face_recognition's
      # default), so the box is MuseTalk's to the pixel; it costs about 60 ms on the 360 px canvas (0: 16 ms, but
      # the landmark box moved 2 to 8 px, live 2026-10-22). 1 is also tried when 0 finds nothing, and the S3FD box
      # is used when HOG never finds the face.
      HOG_UPSAMPLE = int(os.environ.get("AVATAR_HOG_UPSAMPLE", "1"))
      S3FD_MIN_SCORE = 0.05


      def _canvas_for(img: np.ndarray) -> tuple[np.ndarray, float]:
          """``img`` scaled to fit DETECT_CANVAS and pasted top-left on it (black), and the scale."""
          ch, cw = DETECT_CANVAS
          h, w = img.shape[:2]
          s = min(1.0, ch / float(h), cw / float(w))
          src = img if s == 1.0 else cv2.resize(img, (int(w * s), int(h * s)), interpolation=cv2.INTER_AREA)
          canvas = np.zeros((ch, cw, 3), dtype=np.uint8)
          canvas[: src.shape[0], : src.shape[1]] = src
          return canvas, s


      def _landmark_box(face_land_mark: np.ndarray, f: tuple) -> tuple:
          """MuseTalk's get_landmark_and_bbox box rule (bbox_shift 0): from the nose bridge (landmark 29) up by the
          distance to the chin, the landmarks' horizontal extent and the chin; the S3FD box when that is unusable."""
          half_face_coord = face_land_mark[29]
          half_face_dist = np.max(face_land_mark[:, 1]) - half_face_coord[1]
          upper_bond = max(0, half_face_coord[1] - half_face_dist)
          x1, y1, x2, y2 = (np.min(face_land_mark[:, 0]), int(upper_bond), np.max(face_land_mark[:, 0]),
                            np.max(face_land_mark[:, 1]))
          if y2 - y1 <= 0 or x2 - x1 <= 0 or x1 < 0:
              return tuple(f)
          return (x1, y1, x2, y2)


      def _lm_array(lm: dict) -> np.ndarray:
          return np.array(lm["chin"] + lm["left_eyebrow"] + lm["right_eyebrow"] + lm["nose_bridge"] + lm["nose_tip"]
                          + lm["left_eye"] + lm["right_eye"] + lm["top_lip"] + lm["bottom_lip"]).astype(np.int32)


      def s3fd_boxes(net, pic: np.ndarray, device: str) -> tuple[np.ndarray, dict]:
          """S3FD on one picture (RGB, as upstream get_detections_for_batch feeds it) with the anchor decode
          vectorised: every anchor scoring above 0.05 at once, instead of upstream batch_detect's Python loop that builds two small tensors and copies one box to the
          CPU per anchor (detection/sfd/detect.py; live 2026-10-22 some portraits spent 15 to 20 s there). Same
          priors, variances (0.1, 0.2) and threshold, so the boxes are upstream's; returns (N, 5) x1 y1 x2 y2 score
          and the timings."""
          import torch.nn.functional as F

          if "cuda" in str(device):
              torch.backends.cudnn.benchmark = True    # as upstream; the canvas has one fixed size
          t0 = time.monotonic()
          x = (pic.astype(np.float32) - np.array([104, 117, 123], dtype=np.float32)).transpose(2, 0, 1)[None]
          with torch.no_grad():
              olist = net(torch.from_numpy(np.ascontiguousarray(x)).to(device))
              if torch.cuda.is_available():
                  torch.cuda.synchronize()
              t1 = time.monotonic()
              rows = []
              for i in range(len(olist) // 2):
                  cls = F.softmax(olist[i * 2], dim=1)[0, 1]          # (H, W)
                  reg = olist[i * 2 + 1][0]                           # (4, H, W)
                  stride = float(2 ** (i + 2))
                  hw = (cls > S3FD_MIN_SCORE).nonzero()
                  if hw.numel() == 0:
                      continue
                  score = cls[hw[:, 0], hw[:, 1]]
                  loc = reg[:, hw[:, 0], hw[:, 1]].t()                # (K, 4)
                  axc = stride / 2 + hw[:, 1].float() * stride
                  ayc = stride / 2 + hw[:, 0].float() * stride
                  size = stride * 4
                  cx = axc + loc[:, 0] * 0.1 * size
                  cy = ayc + loc[:, 1] * 0.1 * size
                  bw = size * torch.exp(loc[:, 2] * 0.2)
                  bh = size * torch.exp(loc[:, 3] * 0.2)
                  x1, y1 = cx - bw / 2, cy - bh / 2
                  rows.append(torch.stack([x1, y1, x1 + bw, y1 + bh, score], dim=1))
              out = torch.cat(rows).float().cpu().numpy() if rows else np.zeros((0, 5), np.float32)
          return out, {"s3fd_net_ms": round((t1 - t0) * 1000.0, 1), "s3fd_decode_ms": round((time.monotonic() - t1) * 1000.0, 1),
                       "s3fd_candidates": int(out.shape[0])}


      def _sfd_first(boxes: np.ndarray) -> tuple | None:
          """Upstream detect_from_batch + get_detections_for_batch: NMS 0.3, scores above 0.5, the first box, clipped."""
          from face_detection.detection.sfd.bbox import nms

          if boxes.shape[0] == 0:
              return None
          keep = nms(boxes, 0.3)
          kept = [b for b in boxes[keep, :] if b[-1] > 0.5]
          if not kept:
              return None
          d = np.clip(kept[0], 0, None)
          return tuple(int(v) for v in d[:-1])


      def detect_face(img: np.ndarray, mode: str | None = None) -> tuple[list | None, dict]:
          """The MuseTalk face box of ``img`` (on the fixed half-size canvas, mapped back), with per-phase timings.

          ``legacy`` runs MuseTalk's get_landmark_and_bbox steps one by one (dlib HOG face location upsampled once
          plus the 68 landmarks, then S3FD with upstream's per-anchor decode); ``fast`` (default) runs S3FD with the
          vectorised decode and HOG without upsampling (see HOG_UPSAMPLE). The box rule is upstream's in both."""
          import face_recognition
          from avatars.musetalk.utils import preprocessing as mt_pre

          mode = mode or DETECT_MODE
          canvas, s = _canvas_for(img)
          rgb = cv2.cvtColor(canvas, cv2.COLOR_BGR2RGB)
          info: dict = {"mode": mode, "canvas": [int(canvas.shape[1]), int(canvas.shape[0])]}
          t0 = time.monotonic()
          if mode == "legacy":
              lms = face_recognition.face_landmarks(rgb)
              info["landmarks_ms"] = round((time.monotonic() - t0) * 1000.0, 1)
              t1 = time.monotonic()
              f = mt_pre.fa.get_detections_for_batch(np.asarray([canvas]))[0]
              info["s3fd_ms"] = round((time.monotonic() - t1) * 1000.0, 1)
          else:
              det = mt_pre.fa.face_detector
              boxes, tim = s3fd_boxes(det.face_detector, rgb, det.device)
              info.update(tim)
              f = _sfd_first(boxes)
              info["s3fd_ms"] = round((time.monotonic() - t0) * 1000.0, 1)
              t1 = time.monotonic()
              locs = face_recognition.face_locations(rgb, number_of_times_to_upsample=HOG_UPSAMPLE)
              if not locs and HOG_UPSAMPLE < 1:
                  locs = face_recognition.face_locations(rgb, number_of_times_to_upsample=1)
                  info["hog_retry"] = True
              info["hog_ms"] = round((time.monotonic() - t1) * 1000.0, 1)
              if not locs and f is not None:
                  locs = [(f[1], f[2], f[3], f[0])]      # (top, right, bottom, left) from the S3FD box
                  info["landmarks_on"] = "s3fd_box"
              t2 = time.monotonic()
              lms = face_recognition.face_landmarks(rgb, face_locations=locs[:1]) if locs else []
              info["landmarks_ms"] = round((time.monotonic() - t2) * 1000.0, 1)
          info["total_ms"] = round((time.monotonic() - t0) * 1000.0, 1)
          if f is None:
              return None, info
          flm = _lm_array(lms[0]) if lms else np.zeros((68, 2), dtype=np.int32)
          box = _landmark_box(flm, f)
          info["box_canvas"] = [int(v) for v in box]
          if tuple(box) == tuple(coord_placeholder):
              return None, info
          return [float(v) / s for v in box], info


      def _detect_fixed(img: np.ndarray, path: str = "") -> list | None:
          """The face box of ``img`` on a canvas of one fixed size at half resolution (DETECT_CANVAS): MuseTalk's S3FD
          turns cudnn.benchmark on, so each new size was autotuned first (11.9 to 15.3 s live 2026-10-22). The
          picture is scaled to fit and pasted top-left, so the box maps back by the scale. Timings of the last call in
          STATE["last_detect"]."""
          box, info = detect_face(img)
          STATE["last_detect"] = info
          return box


      class _WarmingFeatQueue(queue.Queue):
          """The session's feature queue. Its consumer is the session's inference thread, so the first
          UNet + VAE batch on that thread and its CUDA stream can be paid here, during the idle frames
          right after the call connects, instead of on the patient's first line (live run 2026-10-20:
          the first line of every call spent 2.06 s between audio in and audio out, the next ones 56 to
          86 ms). It runs after a few idle batches so the first frame is not delayed."""

          def __init__(self, sess, maxsize: int = 1, after: int = 3):
              super().__init__(maxsize=maxsize)
              self._sess, self._after, self._gets = sess, after, 0

          def get(self, block=True, timeout=None):
              item = super().get(block, timeout)
              self._gets += 1
              if self._gets == self._after:
                  _warm_session(self._sess)
              return item


      @torch.no_grad()
      def _warm_session(sess) -> None:
          t = time.perf_counter()
          feats = [np.zeros((50, 384), dtype=np.float32) for _ in range(sess.batch_size)]
          st = sess.__dict__.get("_acudx_stream")
          if st is None and torch.cuda.is_available():
              st = sess._acudx_stream = torch.cuda.Stream()
          try:
              if st is not None:
                  with torch.cuda.stream(st):
                      _orig_infer(sess, 0, feats)
                  st.synchronize()
              else:
                  _orig_infer(sess, 0, feats)
          except Exception as exc:  # noqa: BLE001 - a failed warm-up only costs the first line its latency
              log.warning("session warm-up failed: %s", type(exc).__name__)
          sess._acudx_warm_ms = round((time.perf_counter() - t) * 1000.0, 1)
          log.info("session %s warm-up %.0f ms", getattr(sess, "sessionid", "?"), sess._acudx_warm_ms)


      def _bounded(params: dict, key: str, default: int, lo: int, hi: int) -> int:
          try:
              v = int(params.get(key, default))
          except (TypeError, ValueError):
              v = default
          return max(lo, min(hi, v))


      def build_avatar_session(sessionid: str, params: dict):
          tuning = params.get("tuning") if isinstance(params.get("tuning"), dict) else {}
          o = copy.deepcopy(opt)
          o.sessionid = sessionid
          o.batch_size = _bounded(tuning, "batch_size", BATCH_SIZE, 2, 16)
          o.r = _bounded(tuning, "lookahead_frames", LOOKAHEAD_FRAMES, 4, 10)
          avatar_id = params["avatar"]
          o.avatar_id = avatar_id
          sess = registry.create("avatar", "musetalk", opt=o, model=MODEL, avatar=_load(avatar_id))
          # Shallow queues: one feature batch and one rendered batch in flight (upstream: two each).
          sess.asr.feat_queue = _WarmingFeatQueue(sess, maxsize=1)
          sess.res_frame_queue = _IdxQueue(sess, o.batch_size)
          sess._acudx_ahead = _bounded(tuning, "ahead_frames", AHEAD_FRAMES, o.batch_size + 2, 40)
          sess._acudx_shift_ms = _bounded(tuning, "av_shift_ms", AV_SHIFT_MS, -1000, 1000)
          sess._acudx_tuning = {"batch_size": o.batch_size, "lookahead_frames": o.r, "ahead_frames": sess._acudx_ahead,
                                "av_shift_ms": sess._acudx_shift_ms}
          sess._acudx_avatar = avatar_id
          _install_crossfade(sess)
          _install_av_shift(sess, sess._acudx_shift_ms)
          return sess


      class _IdxQueue(queue.Queue):
          """The rendered-frame queue; remembers the idle-loop index of the frame being sent, so a
          cross-fade can blend the old picture's frame at the same index (same head pose)."""

          def __init__(self, sess, maxsize: int):
              super().__init__(maxsize=maxsize)
              self._sess = sess

          def get(self, block=True, timeout=None):
              item = super().get(block, timeout)
              try:
                  self._sess._acudx_idx = int(item[2])
              except (TypeError, ValueError, IndexError):
                  pass
              return item


      # A switch waits until the patient has been silent this many frames (0.48 s): never mid-word.
      QUIET_FRAMES = int(os.environ.get("AVATAR_SWITCH_QUIET_FRAMES", "12"))


      def _swap_cycles(sess, av) -> tuple:
          old = (sess.frame_list_cycle, sess.mask_list_cycle, sess.coord_list_cycle, sess.mask_coords_list_cycle,
                 sess.input_latent_list_cycle)
          (sess.frame_list_cycle, sess.mask_list_cycle, sess.coord_list_cycle, sess.mask_coords_list_cycle,
           sess.input_latent_list_cycle) = av
          return old


      def _install_crossfade(sess) -> None:
          """Cross-fade a /switch on matched frames: the switch waits until the patient is silent (no
          speaking frame for QUIET_FRAMES), then each frame of the fade blends the old picture's idle
          frame at the same loop index with the new one (smoothstep over the crossfade time). The base
          and its variants are registered to one frame (acudx_register), so the blend shows one face in
          one pose; two framings that still differ are cut, never blended (framing_differs)."""
          out = sess.output
          orig_v = out.push_video_frame
          st = {"last": None, "from": None, "t0": 0.0, "dur": 0.0, "pending": None, "quiet": 0, "applied": 0}

          def push_video_frame(frame) -> None:
              st["quiet"] = 0 if getattr(sess, "speaking", False) else st["quiet"] + 1
              pend = st["pending"]
              if pend is not None and st["quiet"] >= QUIET_FRAMES:
                  st["pending"] = None
                  av, ms, avatar_id = pend
                  old = _swap_cycles(sess, av)
                  sess._acudx_avatar = avatar_id
                  st["applied"] += 1
                  if ms > 0:
                      st["from"], st["t0"], st["dur"] = old[0], time.monotonic(), ms / 1000.0
              src_cycle = st["from"]
              if src_cycle is not None:
                  u = (time.monotonic() - st["t0"]) / st["dur"] if st["dur"] > 0 else 1.0
                  if u >= 1.0:
                      st["from"] = None
                  else:
                      idx = getattr(sess, "_acudx_idx", None)
                      src = src_cycle[idx % len(src_cycle)] if idx is not None and len(src_cycle) else st["last"]
                      if src is not None and src.shape == frame.shape:
                          a = u * u * (3.0 - 2.0 * u)
                          frame = cv2.addWeighted(src, 1.0 - a, frame, a, 0.0)
                      else:
                          st["from"] = None   # another frame size: never stretch one framing over the other
              st["last"] = frame
              orig_v(frame)

          out.push_video_frame = push_video_frame
          sess._acudx_fade = st


      class TrackedRTCManager(RTCManager):
          """RTCManager that remembers the peer connection and video track per session."""

          def __init__(self, o):
              super().__init__(o)
              self.by_session: dict = {}
              self.video_tracks: dict = {}

          async def _create_pc_and_answer(self, avatar_session, sessionid, offer):
              pc = await super()._create_pc_and_answer(avatar_session, sessionid, offer)
              self.by_session[sessionid] = pc
              for sender in pc.getSenders():
                  if sender.track is not None and sender.track.kind == "video":
                      self.video_tracks[sessionid] = sender.track
              return pc


      session_manager.set_max_session(MAX_SESSIONS)
      session_manager.init_builder(build_avatar_session)
      RTC = TrackedRTCManager(opt)


      def _gpu() -> dict:
          out: dict = {"cuda": torch.cuda.is_available()}
          if torch.cuda.is_available():
              free, total = torch.cuda.mem_get_info()
              out.update({"name": torch.cuda.get_device_name(0), "total_mb": total // 2**20, "free_mb": free // 2**20,
                          "process_reserved_mb": torch.cuda.memory_reserved() // 2**20,
                          "process_allocated_mb": torch.cuda.memory_allocated() // 2**20})
          return out


      def _session_stats(sid: str, sess) -> dict:
          out: dict = {"id": sid[:8], "tuning": getattr(sess, "_acudx_tuning", None),
                       "avatar": getattr(sess, "_acudx_avatar", None),
                       "speaking": bool(getattr(sess, "speaking", False)), "warm_up_ms": getattr(sess, "_acudx_warm_ms", None),
                       "switches_applied": (getattr(sess, "_acudx_fade", None) or {}).get("applied"),
                       "switch_pending": bool((getattr(sess, "_acudx_fade", None) or {}).get("pending"))}
          inf = getattr(sess, "_acudx_infer", None)
          if inf and inf["seconds"] > 0:
              out["infer_fps"] = round(inf["frames"] / inf["seconds"], 1)
              out["inferred_frames"] = inf["frames"]
          audio, video = _tracks(sess)
          out["sender_queue"] = {"audio_frames": audio._queue.qsize() if audio is not None else None,
                                 "video_frames": video._queue.qsize() if video is not None else None}
          track = RTC.video_tracks.get(sid)
          st = getattr(track, "_acudx", None) if track is not None else None
          if st:
              w = st["window"]
              out["sent_frames"] = st["frames"]
              out["underruns"] = st["underruns"]
              if len(w) >= 2 and w[-1] > w[0]:
                  out["out_fps"] = round((len(w) - 1) / (w[-1] - w[0]), 1)
          return out


      async def health(_request: web.Request) -> web.Response:
          active = {k: v for k, v in session_manager.sessions.items() if v is not None}
          prepared = sorted(d for d in os.listdir(AVATAR_ROOT) if _is_prepared(d)) if os.path.isdir(AVATAR_ROOT) else []
          return web.json_response({
              "ok": True, "model": "musetalk-1.5", "runner": "livetalking", "livetalking_ref": LIVETALKING_REF,
              "transport": "webrtc", "fps": opt.fps, "batch_size": BATCH_SIZE, "sessions": len(active),
              "max_sessions": MAX_SESSIONS, "dedicated_gpu": DEDICATED_GPU, "avatars": prepared,
              "infer_fps": STATE["infer_fps"], "prepare_ms": STATE["prepare_ms"], "prep_queue": PREP_QUEUE.depth(), "detector_warm_ms": STATE.get("detector_warm_ms"),
              "defaults": {"batch_size": BATCH_SIZE, "ahead_frames": AHEAD_FRAMES, "lookahead_frames": LOOKAHEAD_FRAMES,
                           "av_shift_ms": AV_SHIFT_MS, "idle_frames": IDLE_FRAMES},
              "calls": [_session_stats(k, v) for k, v in active.items()],
              "model_load_ms": STATE["model_load_ms"], "gpu": _gpu(), "uptime_s": round(time.time() - STATE["started_at"]),
              "media": dict(MEDIA), "audio_in": ["stream", "humanaudio"], "last_speech_trace": TRACE.get("last"),
          })


      async def list_avatars(_request: web.Request) -> web.Response:
          prepared = sorted(d for d in os.listdir(AVATAR_ROOT) if _is_prepared(d)) if os.path.isdir(AVATAR_ROOT) else []
          return web.json_response({"avatars": prepared})


      async def detect_bench(request: web.Request) -> web.Response:
          """POST body = a portrait: the face box and per-phase timings of each detection mode (?modes=legacy,fast),
          on the picture as a preparation sees it. Runs in the preparation queue, so it never overlaps one."""
          body = await request.read()
          if not body or len(body) > MAX_IMAGE_BYTES:
              return web.json_response({"error": "image required (at most 8 MB)"}, status=400)
          img = cv2.imdecode(np.frombuffer(body, dtype=np.uint8), cv2.IMREAD_COLOR)
          if img is None:
              return web.json_response({"error": "image could not be decoded"}, status=400)
          modes = [m for m in (request.query.get("modes") or "legacy,fast").split(",") if m in ("legacy", "fast")]
          h, w = img.shape[:2]
          if h > MAX_FRAME_H:
              img = cv2.resize(img, (int(w * MAX_FRAME_H / h), MAX_FRAME_H), interpolation=cv2.INTER_AREA)
          img = img[: img.shape[0] - img.shape[0] % 2, : img.shape[1] - img.shape[1] % 2]

          def run() -> list:
              out = []
              PREP_QUEUE.acquire(PREP_PRIORITY_LADDER)
              try:
                  for m in modes:
                      t = time.monotonic()
                      box, info = detect_face(img, m)
                      out.append({"mode": m, "box": [round(v, 1) for v in box] if box else None, "info": info,
                                  "wall_ms": round((time.monotonic() - t) * 1000.0, 1)})
              finally:
                  PREP_QUEUE.release()
              return out

          res = await asyncio.get_running_loop().run_in_executor(None, run)
          return web.json_response({"size": [int(img.shape[1]), int(img.shape[0])], "runs": res})


      async def get_avatar(request: web.Request) -> web.Response:
          """A prepared avatar's geometry (frame size, face box, idle frames), for the browser's lip-sync meter."""
          avatar_id = request.match_info["avatar_id"]
          if not AVATAR_ID_RE.match(avatar_id) or not _is_prepared(avatar_id):
              return web.json_response({"error": "not_prepared"}, status=404)
          with open(os.path.join(_avatar_dir(avatar_id), "avator_info.json")) as f:
              info = json.load(f)
          return web.json_response({k: info.get(k) for k in ("avatar_id", "face_box", "width", "height", "idle_frames",
                                                             "extended_px", "ref", "registration")})


      async def put_avatar(request: web.Request) -> web.Response:
          avatar_id = request.match_info["avatar_id"]
          if not AVATAR_ID_RE.match(avatar_id):
              return web.json_response({"error": "bad avatar_id"}, status=400)
          body = await request.read()
          if not body or len(body) > MAX_IMAGE_BYTES:
              return web.json_response({"error": "image missing or larger than 8 MB"}, status=400)
          frames = request.query.get("idle_frames")
          try:
              n = int(frames) if frames else None
          except ValueError:
              return web.json_response({"error": "bad idle_frames"}, status=400)
          ref = request.query.get("ref") or None
          if ref is not None and (not AVATAR_ID_RE.match(ref) or ref == avatar_id):
              return web.json_response({"error": "bad ref"}, status=400)
          # ?priority=call: the picture a learner's call opens on goes ahead of the case's look ladder.
          prio = PREP_PRIORITY_CALL if request.query.get("priority") == "call" else PREP_PRIORITY_LADDER
          try:
              info = await asyncio.get_running_loop().run_in_executor(None, prepare_avatar, avatar_id, body, n, ref,
                                                                      prio)
          except RefNotPrepared as exc:
              return web.json_response({"error": "ref_not_prepared", "ref": str(exc)}, status=409)
          except NoFace as exc:
              return web.json_response({"error": "no_face", "detail": str(exc)}, status=422)
          except ValueError as exc:
              return web.json_response({"error": "bad_image", "detail": str(exc)}, status=400)
          return web.json_response(info)


      def _active() -> int:
          return sum(1 for v in session_manager.sessions.values() if v is not None)


      async def offer(request: web.Request) -> web.Response:
          params = await request.json()
          avatar_id = str(params.get("avatar") or "")
          if not AVATAR_ID_RE.match(avatar_id) or not _is_prepared(avatar_id):
              return web.json_response({"error": "avatar_not_prepared", "avatar": avatar_id}, status=409)
          try:
              await asyncio.get_running_loop().run_in_executor(None, _load, avatar_id)
          except Exception as exc:  # noqa: BLE001 - a broken avatar dir is a client-visible error
              return web.json_response({"error": "avatar_load_failed", "detail": type(exc).__name__}, status=500)
          if _active() >= MAX_SESSIONS:
              return web.json_response({"error": "max_sessions", "max_sessions": MAX_SESSIONS}, status=503)
          try:
              return await RTC.handle_offer(request)
          except MaxSessionError:
              return web.json_response({"error": "max_sessions", "max_sessions": MAX_SESSIONS}, status=503)


      async def switch(request: web.Request) -> web.Response:
          """{sessionid, avatar, crossfade_ms}: swap a live call's face to another prepared avatar (the same
          patient in another state). The idle loop length must match: the session's inference thread
          indexes frames by the length it started with."""
          params = await request.json()
          sid = str(params.get("sessionid") or "")
          avatar_id = str(params.get("avatar") or "")
          ms = _bounded(params, "crossfade_ms", 900, 0, 3000)
          sess = session_manager.get_session(sid)
          if sess is None:
              return web.json_response({"error": "unknown_session"}, status=404)
          if not AVATAR_ID_RE.match(avatar_id) or not _is_prepared(avatar_id):
              return web.json_response({"error": "avatar_not_prepared", "avatar": avatar_id}, status=409)
          t = time.monotonic()
          try:
              av = await asyncio.get_running_loop().run_in_executor(None, _load, avatar_id)
          except Exception as exc:  # noqa: BLE001
              return web.json_response({"error": "avatar_load_failed", "detail": type(exc).__name__}, status=500)
          if len(av[0]) != len(sess.frame_list_cycle) or len(av[4]) != len(sess.input_latent_list_cycle):
              return web.json_response({"error": "frame_count_mismatch", "have": len(sess.frame_list_cycle),
                                        "got": len(av[0])}, status=409)
          previous = getattr(sess, "_acudx_avatar", None)
          # A look whose framing still differs is cut to, never blended: a blend of two framings shows two faces.
          cut = framing_differs(sess.frame_list_cycle[0].shape, sess.coord_list_cycle[0], av[0][0].shape, av[2][0])
          if cut:
              ms = 0
          st = getattr(sess, "_acudx_fade", None)
          deferred = False
          if st is not None:
              # Applied by the sender loop on the next silent frame, at the frame boundary.
              deferred = st["quiet"] < QUIET_FRAMES
              st["pending"] = (av, ms, avatar_id)
          else:
              _swap_cycles(sess, av)
              sess._acudx_avatar = avatar_id
          MEDIA["switches"] = MEDIA.get("switches", 0) + 1
          return web.json_response({"ok": True, "avatar": avatar_id, "previous": previous, "crossfade_ms": ms,
                                    "cut": cut, "deferred_until_silent": deferred,
                                    "switch_ms": round((time.monotonic() - t) * 1000.0, 1)})


      async def tuning(request: web.Request) -> web.Response:
          """{sessionid, av_shift_ms}: move a live call's video against its audio (0 to 1000 ms, video
          later), one frame per frame; the gateway uses it to correct a lip offset the browser measured."""
          params = await request.json()
          sess = session_manager.get_session(str(params.get("sessionid") or ""))
          if sess is None:
              return web.json_response({"error": "unknown_session"}, status=404)
          st = getattr(sess, "_acudx_shift", None)
          if st is None:
              return web.json_response({"error": "shift_not_adjustable"}, status=409)
          ms = _bounded(params, "av_shift_ms", int(st["n"]) * 40, 0, 1000)
          st["n"] = int(round(ms / 40.0))
          sess._acudx_shift_ms = st["n"] * 40
          if isinstance(getattr(sess, "_acudx_tuning", None), dict):
              sess._acudx_tuning["av_shift_ms"] = sess._acudx_shift_ms
          return web.json_response({"ok": True, "av_shift_ms": sess._acudx_shift_ms})


      async def close(request: web.Request) -> web.Response:
          params = await request.json()
          sid = str(params.get("sessionid") or "")
          session_manager.remove_session(sid)
          RTC.video_tracks.pop(sid, None)
          pc = RTC.by_session.pop(sid, None)
          if pc is not None:
              await pc.close()
              RTC.pcs.discard(pc)
          return web.json_response({"ok": True, "closed": pc is not None})


      class _Utterance:
          """Streamed TTS audio -> 16 kHz float32 20 ms frames pushed straight into the session's audio
          queue (LiveTalking ``put_audio_frame``), resampled with a streaming soxr resampler so chunk
          boundaries leave no clicks."""

          CHUNK = 320

          def __init__(self, sess, sample_rate: int):
              self.sess = sess
              self.rate = sample_rate
              self.rs = soxr.ResampleStream(sample_rate, 16000, 1, dtype="float32", quality="HQ") if sample_rate != 16000 else None
              self.buf = np.zeros(0, dtype=np.float32)
              self.odd = b""
              self.frames = 0
              self.started = time.monotonic()
              self.first_frame_ms: float | None = None
              self.bytes_in = 0

          def _push(self, samples: np.ndarray, last: bool) -> None:
              if samples.size:
                  self.buf = np.concatenate([self.buf, samples])
              while self.buf.size >= self.CHUNK:
                  frame, self.buf = self.buf[: self.CHUNK], self.buf[self.CHUNK:]
                  final = last and self.buf.size == 0
                  ev = {"status": "start"} if self.frames == 0 else ({"status": "end"} if final else {})
                  self.sess.put_audio_frame(frame.copy(), ev)
                  if self.frames == 0:
                      self.first_frame_ms = round((time.monotonic() - self.started) * 1000.0, 1)
                      TRACE["speech_in_at"], TRACE["speech_out_at"] = time.monotonic(), None
                  self.frames += 1

          def feed(self, data: bytes) -> None:
              self.bytes_in += len(data)
              data = self.odd + data
              if len(data) % 2:
                  self.odd, data = data[-1:], data[:-1]
              else:
                  self.odd = b""
              if not data:
                  return
              x = np.frombuffer(data, dtype="<i2").astype(np.float32) / 32768.0
              if self.rs is not None:
                  x = self.rs.resample_chunk(x)
              self._push(x.astype(np.float32, copy=False), last=False)

          def finish(self) -> dict:
              tail = self.rs.resample_chunk(np.zeros(0, dtype=np.float32), last=True) if self.rs is not None else np.zeros(0, np.float32)
              if self.buf.size + tail.size:
                  pad = (-(self.buf.size + tail.size)) % self.CHUNK
                  tail = np.concatenate([tail.astype(np.float32), np.zeros(pad, dtype=np.float32)])
              self._push(tail, last=True)
              return {"frames": self.frames, "audio_ms": self.frames * 20, "bytes_in": self.bytes_in,
                      "first_frame_ms": self.first_frame_ms, "elapsed_ms": round((time.monotonic() - self.started) * 1000.0, 1)}


      async def stream_audio(request: web.Request) -> web.WebSocketResponse:
          """Audio in as it is synthesised (see the module docstring for the message shapes)."""
          ws = web.WebSocketResponse(max_msg_size=1 << 20, heartbeat=20)
          await ws.prepare(request)
          cur: _Utterance | None = None
          sess = None
          async for msg in ws:
              if msg.type == WSMsgType.BINARY:
                  if cur is not None:
                      cur.feed(msg.data)
                  continue
              if msg.type != WSMsgType.TEXT:
                  break
              try:
                  m = json.loads(msg.data)
              except ValueError:
                  await ws.send_json({"type": "error", "error": "bad_json"})
                  continue
              kind = m.get("type")
              if kind == "begin":
                  sess = session_manager.get_session(str(m.get("sessionid") or ""))
                  if sess is None:
                      await ws.send_json({"type": "error", "error": "unknown_session"})
                      cur = None
                      continue
                  if m.get("interrupt"):
                      sess.flush_talk()
                  rate = int(m.get("sample_rate") or 16000)
                  if rate not in (8000, 16000, 22050, 24000, 44100, 48000):
                      await ws.send_json({"type": "error", "error": "bad_sample_rate"})
                      continue
                  cur = _Utterance(sess, rate)
                  MEDIA["stream_utterances"] += 1
                  await ws.send_json({"type": "begun"})
              elif kind == "end":
                  if cur is not None:
                      stats = cur.finish()
                      cur = None
                      await ws.send_json({"type": "done", **stats})
              elif kind == "interrupt":
                  if sess is not None:
                      sess.flush_talk()
                  cur = None
                  await ws.send_json({"type": "interrupted"})
              elif kind == "ping":
                  await ws.send_json({"type": "pong"})
          if cur is not None:
              cur.finish()
          return ws


      async def turn_bridge(request: web.Request) -> web.WebSocketResponse:
          """Pipe bytes between a WebSocket and the TURN server's TCP listener (TURN over TCP is a byte stream).
          ``?via=tls``: the host's public 443 router instead, so the bytes are the browser's TLS session
          with coturn's TLS listener (the SNI router picks it by the turn.<domain> server name)."""
          ws = web.WebSocketResponse(max_msg_size=1 << 20, heartbeat=20)
          await ws.prepare(request)
          port = TURN_TLS_EDGE_PORT if request.query.get("via") == "tls" else TURN_TCP_PORT
          try:
              reader, writer = await asyncio.open_connection(TURN_TCP_HOST, port)
          except OSError as exc:
              await ws.close(code=1011, message=f"turn unreachable: {type(exc).__name__}".encode())
              return ws

          async def tcp_to_ws() -> None:
              while True:
                  data = await reader.read(65536)
                  if not data:
                      break
                  await ws.send_bytes(data)

          pump = asyncio.create_task(tcp_to_ws())
          try:
              async for msg in ws:
                  if msg.type == WSMsgType.BINARY:
                      writer.write(msg.data)
                      await writer.drain()
                  elif msg.type in (WSMsgType.CLOSE, WSMsgType.ERROR):
                      break
          finally:
              pump.cancel()
              writer.close()
              await ws.close()
          return ws


      def _turn_credentials(label: str) -> tuple[str, str]:
          username = f"{int(time.time()) + 600}:{label}"
          digest = hmac.new(TURN_SECRET.encode(), username.encode(), hashlib.sha1).digest()
          return username, base64.b64encode(digest).decode()


      async def _allocate(host: str, port: int, transport: str, use_tls: bool) -> dict:
          from aioice import turn as aturn  # noqa: PLC0415 - aiortc's ICE library

          user, cred = _turn_credentials("turn-check")
          started = time.monotonic()
          ctx = ssl.create_default_context() if use_tls else None
          dial = TURN_HOST_ADDR or host
          try:
              if use_tls:
                  # Same TLS as a browser (SNI and certificate checked for the public name), dialled at
                  # the host address: create_connection(host=dial, server_hostname=name).
                  loop = asyncio.get_running_loop()
                  orig = loop.create_connection

                  async def _cc(factory, host=None, port=None, **kw):
                      kw.setdefault("server_hostname", turn_name)
                      return await orig(factory, host=dial, port=port, **kw)

                  turn_name = host
                  loop.create_connection = _cc  # type: ignore[method-assign]
                  try:
                      tt, _proto = await asyncio.wait_for(aturn.create_turn_endpoint(
                          asyncio.DatagramProtocol, server_addr=(host, port), username=user, password=cred,
                          ssl=ctx, transport=transport), timeout=10)
                  finally:
                      loop.create_connection = orig  # type: ignore[method-assign]
              else:
                  tt, _proto = await asyncio.wait_for(aturn.create_turn_endpoint(
                      asyncio.DatagramProtocol, server_addr=(dial, port), username=user, password=cred,
                      ssl=None, transport=transport), timeout=10)
          except Exception as exc:  # noqa: BLE001 - reported per URL
              return {"ok": False, "error": f"{type(exc).__name__}: {exc}"[:200]}
          relayed = tt.get_extra_info("sockname")
          out = {"ok": True, "relayed": f"{relayed[0]}:{relayed[1]}" if relayed else None,
                 "ms": round((time.monotonic() - started) * 1000.0, 1)}
          inner = getattr(getattr(tt, "_TurnTransport__inner_protocol", None), "transport", None)
          sslobj = inner.get_extra_info("ssl_object") if inner is not None else None
          if sslobj is not None:
              cert = sslobj.getpeercert() or {}
              out["tls"] = {"version": sslobj.version(), "cipher": (sslobj.cipher() or [None])[0],
                            "subject": dict(x[0] for x in cert.get("subject", ())).get("commonName"),
                            "issuer": dict(x[0] for x in cert.get("issuer", ())).get("organizationName")}
          tt.close()
          return out


      async def turn_check(_request: web.Request) -> web.Response:
          if not TURN_SECRET or not WORKER_DOMAIN:
              return web.json_response({"ok": False, "error": "TURN_SECRET or WORKER_DOMAIN not set"}, status=503)
          checks = {
              f"turns:turn.{WORKER_DOMAIN}:443?transport=tcp": ("turn." + WORKER_DOMAIN, 443, "tcp", True),
              f"turn:{WORKER_DOMAIN}:3478?transport=tcp": (WORKER_DOMAIN, 3478, "tcp", False),
              f"turn:{WORKER_DOMAIN}:3478?transport=udp": (WORKER_DOMAIN, 3478, "udp", False),
          }
          results = [await _allocate(*v) for v in checks.values()]  # sequential: the TLS dial patches the loop
          out = dict(zip(checks.keys(), results))
          return web.json_response({"ok": all(r["ok"] for r in results), "dialled": TURN_HOST_ADDR or "public names",
                                    "results": out})


      async def on_shutdown(_app: web.Application) -> None:
          await RTC.shutdown()


      def main() -> None:
          os.makedirs(AVATAR_ROOT, exist_ok=True)
          app = web.Application(client_max_size=32 * 1024 * 1024)
          app["rtc_manager"] = RTC
          app["opt"] = opt
          app.on_shutdown.append(on_shutdown)
          app.router.add_get("/health", health)
          app.router.add_get("/avatars", list_avatars)
          app.router.add_put("/avatars/{avatar_id}", put_avatar)
          app.router.add_get("/avatars/{avatar_id}", get_avatar)
          app.router.add_post("/offer", offer)
          app.router.add_get("/stream", stream_audio)
          app.router.add_post("/humanaudio", humanaudio)
          app.router.add_post("/interrupt_talk", interrupt_talk)
          app.router.add_post("/is_speaking", is_speaking)
          app.router.add_post("/close", close)
          app.router.add_post("/switch", switch)
          app.router.add_post("/tuning", tuning)
          app.router.add_get("/turn", turn_bridge)
          app.router.add_get("/turn_check", turn_check)
          app.router.add_post("/detect_bench", detect_bench)
          def _warm_detector() -> None:
              # The first detection on a fresh runner paid 12 to 17 s (cuDNN autotune for the canvas size, live
              # 2026-10-22); pay it here at start-up instead of on the first case's portrait.
              t = time.monotonic()
              PREP_QUEUE.acquire(PREP_PRIORITY_LADDER)
              try:
                  _detect_fixed(np.full((MAX_FRAME_H, 700, 3), 128, dtype=np.uint8), os.path.join(AVATAR_ROOT, ".warm.png"))
              except Exception as exc:  # noqa: BLE001 - a failed warm-up only costs the first preparation
                  log.warning("detector warm-up failed: %s", type(exc).__name__)
              finally:
                  PREP_QUEUE.release()
              STATE["detector_warm_ms"] = round((time.monotonic() - t) * 1000.0, 1)

          threading.Thread(target=_warm_detector, daemon=True).start()
          log.info("acudx avatar runner on :%d (batch %d, ahead %d frames, max sessions %d, model load %.0f ms)",
                   AVATAR_PORT, BATCH_SIZE, AHEAD_FRAMES, MAX_SESSIONS, STATE["model_load_ms"])
          web.run_app(app, host="0.0.0.0", port=AVATAR_PORT, access_log=None)


      if __name__ == "__main__":
          import torch.multiprocessing as tmp
          tmp.set_start_method("spawn", force=True)
          main()
  # Per-case patient appearance (docs/architecture/18 section 6.6): FLUX.2 [klein] 4B, Apache-2.0
  # (https://huggingface.co/black-forest-labs/FLUX.2-klein-4B, revision pinned below), edits the case
  # portrait into the patient's current state (flushed, sweating, pale, breathless...) while keeping
  # the person. The gateway prepares each result as a MuseTalk avatar and switches the live call to it.
  - path: /opt/acudx/imagegen/Dockerfile
    content: |
      # AcuDx image edit server: torch 2.9.1 cu128 + diffusers 0.40.0 (2026-08-20, Flux2KleinPipeline).
      # Every other package is resolved by uv as it stood on 2026-09-01 (--exclude-newer), so the build
      # is reproducible without hand-pinning the whole transformers / huggingface_hub tree.
      FROM python:3.12-slim-bookworm
      ENV PYTHONUNBUFFERED=1 PYTHONDONTWRITEBYTECODE=1 PIP_NO_CACHE_DIR=1
      RUN apt-get update && apt-get install -y --no-install-recommends curl ca-certificates && rm -rf /var/lib/apt/lists/*
      COPY --from=ghcr.io/astral-sh/uv:0.8.22 /uv /bin/uv
      WORKDIR /app
      RUN pip install "torch==2.9.1+cu128" --index-url https://download.pytorch.org/whl/cu128
      RUN printf 'torch==2.9.1+cu128\n' > /app/constraints.txt \
          && uv pip install --system --exclude-newer 2026-09-01T00:00:00Z --constraint /app/constraints.txt \
             "diffusers==0.40.0" transformers accelerate safetensors sentencepiece huggingface_hub aiohttp pillow
      RUN python -c "import torch, diffusers, transformers; from diffusers import Flux2KleinPipeline; print('torch', torch.__version__, 'diffusers', diffusers.__version__, 'transformers', transformers.__version__)"
      # acudx_imagegen.py is mounted at run time (compose), so the image key does not change with it.
      EXPOSE 8020
      HEALTHCHECK --interval=20s --timeout=10s --start-period=20m --retries=3 CMD curl -sf http://localhost:8020/health || exit 1
      CMD ["python", "/app/acudx_imagegen.py"]
  - path: /opt/acudx/imagegen/acudx_imagegen.py
    content: |
      """AcuDx image edit server (FLUX.2 [klein] 4B, Apache-2.0), behind Caddy's bearer at /imagegen/*.

        GET  /health   {ok, loaded, model, revision, mode, gpu, stats}; ok only once the weights are loaded
        POST /edit     {image_b64 (jpeg/png), prompt, seed, steps (1-8, default 4), width?, height?}
                       -> image/jpeg; headers X-Gen-Ms, X-Mode, X-Steps, X-Seed

      Mode: "gpu" when the card has room for the whole pipeline (IMAGEGEN_FULL_MB free), else "offload"
      (diffusers model CPU offload: only the module that runs sits on the GPU, about 9 GB peak), else
      "sequential" (layer by layer, a few GB, slow), else the server reports ok false with reason
      insufficient_vram. One edit at a time (a lock), run in a thread so /health stays responsive. The
      gateway is the only client.
      """

      from __future__ import annotations

      import asyncio
      import base64
      import io
      import logging
      import os
      import threading
      import time

      import torch
      from aiohttp import web
      from PIL import Image

      REPO = os.environ.get("IMAGEGEN_REPO", "black-forest-labs/FLUX.2-klein-4B")
      REVISION = os.environ.get("IMAGEGEN_REVISION", "e7b7dc27f91deacad38e78976d1f2b499d76a294")
      PORT = int(os.environ.get("IMAGEGEN_PORT", "8020"))
      FULL_MB = int(os.environ.get("IMAGEGEN_FULL_MB", "20000"))
      OFFLOAD_MB = int(os.environ.get("IMAGEGEN_OFFLOAD_MB", "9000"))
      SEQUENTIAL_MB = int(os.environ.get("IMAGEGEN_SEQUENTIAL_MB", "3000"))
      MAX_SIDE = 1024

      log = logging.getLogger("acudx.imagegen")
      logging.basicConfig(level=logging.INFO, format="%(asctime)s %(levelname)s %(name)s %(message)s")
      STATE: dict = {"loaded": False, "mode": None, "reason": None, "load_ms": None, "edits": 0, "last_ms": None,
                     "started_at": time.time()}
      PIPE = None
      LOCK = threading.Lock()


      def _free_mb() -> int:
          free, _total = torch.cuda.mem_get_info()
          return free // 2**20


      def load() -> None:
          global PIPE
          t = time.monotonic()
          try:
              from diffusers import Flux2KleinPipeline  # noqa: PLC0415

              free = _free_mb()
              if free < SEQUENTIAL_MB:
                  STATE.update(reason=f"insufficient_vram: {free} MB free, {SEQUENTIAL_MB} MB needed")
                  log.warning(STATE["reason"])
                  return
              # Weights only (the repository also carries a single-file checkpoint of the same model).
              from huggingface_hub import snapshot_download  # noqa: PLC0415

              path = snapshot_download(REPO, revision=REVISION, allow_patterns=[
                  "model_index.json", "scheduler/*", "text_encoder/*", "tokenizer/*", "transformer/*", "vae/*"])
              pipe = Flux2KleinPipeline.from_pretrained(path, torch_dtype=torch.bfloat16)
              if free >= FULL_MB:
                  pipe.to("cuda")
                  mode = "gpu"
              elif free >= OFFLOAD_MB:
                  pipe.enable_model_cpu_offload()
                  mode = "offload"
              else:
                  # 40 GB cards after vLLM, voice and the runner: layer by layer, slow but a few GB.
                  pipe.enable_sequential_cpu_offload()
                  mode = "sequential"
              pipe.set_progress_bar_config(disable=True)
              PIPE = pipe
              # Warm-up edit: the first real edit on a fresh worker took 147 to 154 s (weights paged in
              # from the network filesystem, kernels picked), the next ones 14 to 16 s (live 2026-10-21).
              # Pay that here, before /health reports loaded.
              w0 = time.monotonic()
              try:
                  _edit(Image.new("RGB", (512, 512), (128, 128, 128)), "a grey square", 0, 2, 512, 512)
              except Exception as exc:  # noqa: BLE001 - reported, the server still serves
                  log.warning("imagegen warm-up failed: %s", type(exc).__name__)
              STATE.update(loaded=True, mode=mode, reason=None, free_mb_at_load=free,
                           warm_ms=round((time.monotonic() - w0) * 1000.0, 1),
                           load_ms=round((time.monotonic() - t) * 1000.0, 1))
              log.info("FLUX.2 klein 4B loaded (%s, %s MB free) in %.0f ms", mode, free, STATE["load_ms"])
          except Exception as exc:  # noqa: BLE001 - reported in /health
              STATE.update(reason=f"load_failed: {type(exc).__name__}: {exc}"[:300])
              log.exception("imagegen load failed")


      def _edit(image: Image.Image, prompt: str, seed: int, steps: int, width: int, height: int) -> Image.Image:
          gen = torch.Generator(device="cuda").manual_seed(seed)
          with LOCK, torch.inference_mode():
              try:
                  try:
                      out = PIPE(image=image, prompt=prompt, width=width, height=height, num_inference_steps=steps,
                                 guidance_scale=1.0, generator=gen)
                  except TypeError:
                      out = PIPE(image=image, prompt=prompt, num_inference_steps=steps, generator=gen)
              finally:
                  # Give the card back after every edit. Live 2026-10-21 on an A100 40 GB: after eight
                  # edits this process held 8.8 GB in torch's cache with 82 MB left on the card, so the
                  # call's runner could not prepare the next face and both answered 500.
                  if torch.cuda.is_available():
                      torch.cuda.empty_cache()
          return out.images[0]


      def _step_down() -> bool:
          """Move the pipeline to the next lighter placement after an out-of-memory."""
          order = ["gpu", "offload", "sequential"]
          mode = STATE.get("mode")
          if mode not in order or mode == "sequential":
              return False
          with LOCK:
              try:
                  PIPE.remove_all_hooks()
                  PIPE.to("cpu")
                  torch.cuda.empty_cache()
                  if mode == "gpu":
                      PIPE.enable_model_cpu_offload()
                      STATE["mode"] = "offload"
                  else:
                      PIPE.enable_sequential_cpu_offload()
                      STATE["mode"] = "sequential"
              except Exception as exc:  # noqa: BLE001 - reported; the old placement stays
                  log.warning("imagegen step-down failed: %s", type(exc).__name__)
                  return False
          log.info("imagegen stepped down from %s to %s", mode, STATE["mode"])
          return True


      def _size(w: int, h: int) -> tuple[int, int]:
          s = min(1.0, MAX_SIDE / max(w, h))
          return max(256, int(w * s) // 16 * 16), max(256, int(h * s) // 16 * 16)


      async def health(_r: web.Request) -> web.Response:
          gpu = {}
          if torch.cuda.is_available():
              free, total = torch.cuda.mem_get_info()
              gpu = {"name": torch.cuda.get_device_name(0), "free_mb": free // 2**20, "total_mb": total // 2**20,
                     "reserved_mb": torch.cuda.memory_reserved() // 2**20}
          return web.json_response({"ok": bool(STATE["loaded"]), "model": REPO, "revision": REVISION,
                                    "licence": "Apache-2.0", **STATE, "gpu": gpu})


      async def edit(request: web.Request) -> web.Response:
          if not STATE["loaded"]:
              return web.json_response({"error": "not_loaded", "reason": STATE["reason"]}, status=503)
          body = await request.json()
          try:
              raw = base64.b64decode(str(body.get("image_b64") or ""), validate=True)
              src = Image.open(io.BytesIO(raw)).convert("RGB")
          except Exception:  # noqa: BLE001
              return web.json_response({"error": "bad_image"}, status=400)
          prompt = str(body.get("prompt") or "").strip()[:2000]
          if not prompt:
              return web.json_response({"error": "prompt required"}, status=400)
          seed = int(body.get("seed") or 0) & 0x7FFFFFFF
          steps = max(1, min(8, int(body.get("steps") or 4)))
          w, h = _size(int(body.get("width") or src.width), int(body.get("height") or src.height))
          t = time.monotonic()
          try:
              out = await asyncio.get_running_loop().run_in_executor(None, _edit, src.resize((w, h), Image.LANCZOS),
                                                                     prompt, seed, steps, w, h)
          except torch.cuda.OutOfMemoryError:
              # The card is shared with live calls; give the memory back and step down one mode
              # (gpu -> offload -> sequential) so the next try fits, then let the gateway retry.
              torch.cuda.empty_cache()
              STATE["oom"] = STATE.get("oom", 0) + 1
              stepped = await asyncio.get_running_loop().run_in_executor(None, _step_down)
              return web.json_response({"error": "oom", "free_mb": _free_mb(), "mode": STATE["mode"],
                                        "stepped_down": stepped}, status=503)
          except Exception as exc:  # noqa: BLE001 - reported to the gateway, which retries 5xx
              log.exception("edit failed")
              return web.json_response({"error": "edit_failed", "detail": type(exc).__name__}, status=500)
          ms = round((time.monotonic() - t) * 1000.0, 1)
          out = out.convert("RGB").resize((src.width, src.height), Image.LANCZOS)
          buf = io.BytesIO()
          out.save(buf, format="JPEG", quality=93)
          STATE["edits"] += 1
          STATE["last_ms"] = ms
          return web.Response(body=buf.getvalue(), content_type="image/jpeg", headers={
              "X-Gen-Ms": str(ms), "X-Mode": str(STATE["mode"]), "X-Steps": str(steps), "X-Seed": str(seed)})


      def main() -> None:
          threading.Thread(target=load, daemon=True).start()
          app = web.Application(client_max_size=16 * 1024 * 1024)
          app.router.add_get("/health", health)
          app.router.add_post("/edit", edit)
          web.run_app(app, host="0.0.0.0", port=PORT, access_log=None)


      if __name__ == "__main__":
          main()
  - path: /opt/acudx/imagegen.sh
    permissions: "0755"
    content: |
      #!/usr/bin/env bash
      # Image edit server bring-up: build while vLLM loads, start once the avatar runner has taken its
      # memory (so the server's own free-VRAM check sees the real headroom), on IMAGEGEN_GPU.
      set -u
      cd /opt/acudx
      set -a; . ./.env; set +a
      compose="docker compose -f /opt/acudx/docker-compose.yml"
      . /opt/acudx/images.sh
      ensure_image imagegen acudx/imagegen:flux2-klein-4b-cu128 "$(imagegen_key)" \
        sh -c "$compose build imagegen >/var/log/acudx-imagegen-build.log 2>&1" || { echo "acudx imagegen: build failed"; exit 1; }
      for _ in $(seq 1 720); do
        s=$(cat /opt/acudx/public/avatar-status/status.json 2>/dev/null)
        case "$s" in *'"state":"ready"'*|*'"state":"disabled"'*) break ;; esac
        sleep 5
      done
      # vLLM starts after the runner and reserves its share of the card; the edit server takes what is left.
      for _ in $(seq 1 480); do
        $compose exec -T vllm curl -sf -o /dev/null http://localhost:8000/health >/dev/null 2>&1 && break
        cid=$($compose ps -aq vllm 2>/dev/null)
        [ -n "$cid" ] && [ "$(docker inspect -f '{{.State.Status}}' "$cid" 2>/dev/null)" = exited ] && break
        sleep 5
      done
      $compose up -d imagegen
      mark "imagegen: container started"
      echo "acudx imagegen: started on GPU ${IMAGEGEN_GPU:-0} $(date -u)"
  # Prebuilt images (docs/architecture/18 section 6.8). The three images built from source
  # (Chatterbox, the avatar runner, the image edit server) are keyed by the sha256 of what goes into
  # them (Dockerfile, constraint file, pinned upstream commit; the AcuDx Python files are mounted at
  # run time, so a code change never invalidates an image). Each is taken from the first source that
  # has it: the local Docker store, the registry (ACUDX_IMAGE_REGISTRY, ghcr.io, built by
  # .github/workflows/gpu-worker-images.yml), the Lambda filesystem cache
  # ($FS/acudx-images/<name>-<key>.tar, written after a build), else it is built here and saved to the
  # cache for the next worker. infra/gpu-worker/worker_images.py computes the same keys.
  - path: /opt/acudx/images.sh
    permissions: "0755"
    content: |
      #!/bin/sh
      # Source me (POSIX sh: cloud-init runs runcmd with /bin/sh): image_key <pin> <files...>;
      # ensure_image <name> <local tag> <key> <build command...>; mark <event>
      ACUDX_FS=${ACUDX_FS:-$(ls -d /lambda/nfs/* 2>/dev/null | head -1)}
      ACUDX_IMAGE_CACHE=${ACUDX_IMAGE_CACHE:-${ACUDX_FS:+$ACUDX_FS/acudx-images}}
      TIMELINE=${TIMELINE:-/opt/acudx/public/avatar-status/timeline.txt}
      mark() {
        mkdir -p "$(dirname "$TIMELINE")"
        printf '%s %s\n' "$(date -u +%s)" "$*" >> "$TIMELINE"
        chmod 0644 "$TIMELINE" 2>/dev/null || true
      }
      image_key() {
        # The files' bytes in order, then the pin string (an upstream commit), sha256, 16 hex characters.
        pin=$1
        shift
        { for f in "$@"; do cat "$f"; done; printf '%s' "$pin"; } | sha256sum | cut -c1-16
      }
      ensure_image() {
        local name=$1 tag=$2 key=$3
        shift 3
        local cached="acudx-cache/$name:$key"
        if docker image inspect "$cached" >/dev/null 2>&1; then
          docker tag "$cached" "$tag"; mark "image $name local $key"; return 0
        fi
        if [ -n "${ACUDX_IMAGE_REGISTRY:-}" ]; then
          local remote="$ACUDX_IMAGE_REGISTRY/acudx-$name:$key"
          mark "image $name pulling $key"
          if timeout 1200 docker pull -q "$remote" >/dev/null 2>&1; then
            docker tag "$remote" "$tag" && docker tag "$remote" "$cached"; mark "image $name pulled $key"; return 0
          fi
          mark "image $name not in registry $key"
        fi
        local tar="${ACUDX_IMAGE_CACHE:-/nonexistent}/$name-$key.tar"
        if [ -n "${ACUDX_IMAGE_CACHE:-}" ] && [ -s "$tar" ]; then
          mark "image $name loading $key"
          if docker load -i "$tar" >/dev/null 2>&1 && docker image inspect "$cached" >/dev/null 2>&1; then
            docker tag "$cached" "$tag"; mark "image $name loaded $key"; return 0
          fi
          mark "image $name cache unreadable $key"
        fi
        mark "image $name building $key"
        "$@" || { mark "image $name build failed $key"; return 1; }
        docker tag "$tag" "$cached"
        mark "image $name built $key"
        if [ -n "${ACUDX_IMAGE_CACHE:-}" ]; then
          mkdir -p "$ACUDX_IMAGE_CACHE"
          ( docker save -o "$ACUDX_IMAGE_CACHE/.$name-$key.tar.part" "$cached" \
              && mv -f "$ACUDX_IMAGE_CACHE/.$name-$key.tar.part" "$tar" && mark "image $name saved to cache $key" \
              || rm -f "$ACUDX_IMAGE_CACHE/.$name-$key.tar.part" ) &
        fi
        return 0
      }
      chatterbox_key() { image_key "$CHATTERBOX_REF" /opt/acudx/chatterbox.Dockerfile; }
      avatar_key() { image_key "$LIVETALKING_REF" /opt/acudx/avatar/Dockerfile.acudx /opt/acudx/avatar/acudx-constraints.txt; }
      imagegen_key() { image_key "" /opt/acudx/imagegen/Dockerfile; }
  - path: /opt/acudx/avatar.sh
    permissions: "0755"
    content: |
      #!/usr/bin/env bash
      # Avatar runner bring-up (LiveTalking + MuseTalk 1.5 and the coturn TURN server).
      # Started in the background right after the NVIDIA runtime is registered: the image
      # builds while vLLM loads, and the containers start only after vLLM is healthy and the
      # other GPU side-cars have taken their memory, so the VRAM check sees the real headroom.
      # Progress and the final verdict go to /opt/acudx/public/avatar-status/status.json, which
      # Caddy serves at /avatar-status/status.json behind the bearer (the gateway reads it
      # when /avatar/health does not answer, and reports it in /v1/voice/capabilities).
      set -u
      cd /opt/acudx
      set -a; . ./.env; set +a
      st=/opt/acudx/public/avatar-status
      compose="docker compose -f /opt/acudx/docker-compose.yml"
      mkdir -p "$st" /opt/acudx/avatars
      status() {
        # state reason [total_mb free_mb]
        printf '{"state":"%s","reason":"%s","total_mb":%s,"free_mb":%s,"required_mb":%s,"livetalking_ref":"%s","at":"%s"}\n' \
          "$1" "$2" "${3:-null}" "${4:-null}" "$AVATAR_REQUIRED_MB" "$LIVETALKING_REF" "$(date -u +%FT%TZ)" > "$st/status.json.tmp"
        mv "$st/status.json.tmp" "$st/status.json"
        chmod 0644 "$st/status.json"
        echo "acudx avatar: $1 $2 $(date -u)"
      }
      gpu_mem() { nvidia-smi -i "${AVATAR_GPU:-0}" --query-gpu=memory.total,memory.used --format=csv,noheader,nounits | head -1 | tr -d ' ' | tr ',' ' '; }
      status building ""
      if [ ! -d /opt/acudx/livetalking/.git ]; then
        git clone --filter=blob:none https://github.com/lipku/LiveTalking /opt/acudx/livetalking || { status disabled clone_failed; exit 1; }
      fi
      git -C /opt/acudx/livetalking checkout --quiet "$LIVETALKING_REF" || { status disabled checkout_failed; exit 1; }
      install -m 0644 /opt/acudx/avatar/Dockerfile.acudx /opt/acudx/avatar/acudx-constraints.txt \
        /opt/acudx/avatar/acudx_avatar_server.py /opt/acudx/avatar/acudx_fetch_models.py /opt/acudx/livetalking/
      . /opt/acudx/images.sh
      ensure_image avatar acudx/avatar-runner:c726943-cu128 "$(avatar_key)" \
        sh -c "$compose build avatar >/var/log/acudx-avatar-build.log 2>&1" || { status disabled build_failed; exit 1; }
      # Parallel start-up (docs/architecture/18 6.8): the runner waits for neither vLLM nor the voice; it
      # loads next to Chatterbox, and vLLM starts after both (runcmd waits for this status), so vLLM's own
      # free-memory check at start-up sees every side-car already loaded.
      mark "avatar: image ready"
      read -r total used <<< "$(gpu_mem)"
      free=$((total - used))
      if [ "$free" -lt "$AVATAR_REQUIRED_MB" ]; then
        # 40 GB cards: vLLM 0.60 + Chatterbox + speaches + Kokoro may leave too little for MuseTalk.
        status disabled insufficient_vram "$total" "$free"
        exit 0
      fi
      status starting "" "$total" "$free"
      # TURN over TLS on 443 (turn.<domain>, routed by edge.conf): coturn runs as nobody and cannot
      # read Caddy's 0600 key in place, so the certificate pair is copied for it. Caddy requested
      # it at boot; give it up to 5 minutes, else TURN starts without TLS (UDP/TCP 3478 only).
      certdir="/opt/acudx/caddy/caddy/certificates/acme-v02.api.letsencrypt.org-directory/turn.$WORKER_DOMAIN"
      for _ in $(seq 1 60); do [ -s "$certdir/turn.$WORKER_DOMAIN.crt" ] && break; sleep 5; done
      if [ -s "$certdir/turn.$WORKER_DOMAIN.crt" ] && [ -s "$certdir/turn.$WORKER_DOMAIN.key" ]; then
        install -d -m 0750 -o 65534 -g 65534 /opt/acudx/turn-tls
        install -m 0644 -o 65534 -g 65534 "$certdir/turn.$WORKER_DOMAIN.crt" /opt/acudx/turn-tls/turn.crt
        install -m 0600 -o 65534 -g 65534 "$certdir/turn.$WORKER_DOMAIN.key" /opt/acudx/turn-tls/turn.key
        export TURN_TLS_ARGS="--tls-listening-port=5349 --cert=/tls/turn.crt --pkey=/tls/turn.key"
        echo "acudx avatar: TURN over TLS on 443 (turn.$WORKER_DOMAIN)"
      else
        mkdir -p /opt/acudx/turn-tls
        echo "acudx avatar: no certificate for turn.$WORKER_DOMAIN yet; TURN without TLS"
      fi
      $compose up -d turn avatar
      mark "avatar: container started"
      for _ in $(seq 1 600); do
        if $compose exec -T avatar curl -sf -o /dev/null http://localhost:8010/health >/dev/null 2>&1; then
          read -r total2 used2 <<< "$(gpu_mem)"
          status ready "used_by_avatar_mb=$((used2 - used))" "$total2" "$((total2 - used2))"
          mark "avatar: ready"
          exit 0
        fi
        sleep 2
      done
      status disabled start_timeout "$total" "$free"
runcmd:
  - mkdir -p /opt/acudx/caddy /opt/acudx/chatterbox-cache /opt/acudx/chatterbox-voices /opt/acudx/public/diag /opt/acudx/public/avatar-status /opt/acudx/avatars /opt/acudx/avatar-cache
  # Diagnostics secret: HMAC-SHA256(key=WORKER_TOKEN, "acudx-diag-v1"), hex, 32 characters.
  # The gateway derives the same value (server/providers/gpu_worker.py diag_secret).
  - |
    . /opt/acudx/.env
    if ! grep -q '^WORKER_DIAG_SECRET=' /opt/acudx/.env; then
      s=$(printf '%s' acudx-diag-v1 | openssl dgst -sha256 -hmac "$WORKER_TOKEN" -r | cut -c1-32)
      [ ${#s} -eq 32 ] || { echo "acudx: could not derive the diagnostics secret" >&2; exit 1; }
      echo "WORKER_DIAG_SECRET=$s" >> /opt/acudx/.env
    fi
  # TURN secret for the avatar call: HMAC-SHA256(key=WORKER_TOKEN, "acudx-turn-v1"), hex, 32
  # characters (server/voice/avatar/musetalk.py turn_secret); relay on the primary address.
  - |
    . /opt/acudx/.env
    if ! grep -q '^TURN_SECRET=' /opt/acudx/.env; then
      t=$(printf '%s' acudx-turn-v1 | openssl dgst -sha256 -hmac "$WORKER_TOKEN" -r | cut -c1-32)
      [ ${#t} -eq 32 ] || { echo "acudx: could not derive the TURN secret" >&2; exit 1; }
      echo "TURN_SECRET=$t" >> /opt/acudx/.env
      echo "TURN_RELAY_IP=$(ip -4 route get 1.1.1.1 | awk '{for (i = 1; i < NF; i++) if ($i == "src") print $(i + 1)}')" >> /opt/acudx/.env
    fi
  - nohup /opt/acudx/diag.sh >/dev/null 2>&1 &
  - |
    FS=$(ls -d /lambda/nfs/* 2>/dev/null | head -1)
    if [ -n "$FS" ]; then mkdir -p "$FS/hf" && rm -rf /opt/acudx/hf && ln -s "$FS/hf" /opt/acudx/hf; else mkdir -p /opt/acudx/hf; fi
    # Chatterbox's model files on the filesystem too (about 3 GB, downloaded on every boot before).
    if [ -n "$FS" ]; then mkdir -p "$FS/chatterbox-cache" && sed -i "s|^CHATTERBOX_CACHE=.*|CHATTERBOX_CACHE=$FS/chatterbox-cache|" /opt/acudx/.env; fi
    # Prepared avatars by content key (docs/architecture/18 6.8.1): kept on the filesystem when there is one.
    if [ -n "$FS" ]; then mkdir -p "$FS/acudx-avatars" && sed -i "s|^AVATAR_CACHE=.*|AVATAR_CACHE=$FS/acudx-avatars|" /opt/acudx/.env; fi
    . /opt/acudx/images.sh && mark "cloud-init: runcmd started (filesystem ${FS:-none})"
  # The public IP is not known before launch, so the manager renders
  # WORKER_DOMAIN=auto and the worker derives <ip-with-dashes>.sslip.io itself
  # (the manager derives the identical name from the API-reported IP).
  - |
    if grep -q '^WORKER_DOMAIN=auto$' /opt/acudx/.env; then
      ip=""
      for src in https://api.ipify.org https://checkip.amazonaws.com https://ifconfig.me/ip; do
        ip=$(curl -fsS --max-time 10 --retry 5 --retry-delay 3 "$src" | tr -d '[:space:]') && [ -n "$ip" ] && break
      done
      [ -n "$ip" ] || { echo "acudx: could not resolve public IP" >&2; exit 1; }
      sed -i "s|^WORKER_DOMAIN=auto$|WORKER_DOMAIN=$(echo "$ip" | tr . -).sslip.io|" /opt/acudx/.env
    fi
  # Chatterbox Multilingual is built from the pinned commit (no published multilingual image)
  # with the AcuDx override Dockerfile copied into the checkout.
  - |
    set -a && . /opt/acudx/.env && set +a
    if [ ! -d /opt/acudx/chatterbox-tts-api ]; then
      git clone --filter=blob:none https://github.com/travisvn/chatterbox-tts-api /opt/acudx/chatterbox-tts-api
    fi
    git -C /opt/acudx/chatterbox-tts-api checkout --quiet "$CHATTERBOX_REF"
    install -m 0644 /opt/acudx/chatterbox.Dockerfile /opt/acudx/chatterbox-tts-api/docker/Dockerfile.acudx.gpu
    install -m 0644 /opt/acudx/chatterbox-acudx-patch.py /opt/acudx/chatterbox-tts-api/app/acudx_patch.py
  # Core first (Caddy, vLLM, STT, Kokoro) so /healthz turns green as soon as the model
  # loads; the Chatterbox image build runs afterwards and attaches when done.
  # Lambda Stack ships the NVIDIA container toolkit but dockerd has no "nvidia" runtime
  # name registered (boot log 2026-10-20: "unknown or invalid runtime name: nvidia");
  # register it and restart docker so both --gpus and device reservations work.
  - (command -v nvidia-ctk >/dev/null && nvidia-ctk runtime configure --runtime=docker && systemctl restart docker) || true
  # The avatar image builds in parallel with the vLLM start; avatar.sh waits for vLLM and Chatterbox
  # health and checks VRAM before starting the runner (it never blocks the steps below).
  # NVSwitch hosts (gpu_4x/8x SXM): CUDA answers "Error 802: system not yet initialized" until the
  # fabric manager has registered the fabric (live 2026-10-21, gpu_4x_h100_sxm5: vLLM, the runner and
  # the image edit server all failed with 802). Start it and wait for the fabric before anything uses CUDA.
  # Only hosts with NVSwitch need it: on a gpu_2x_h100_sxm5 (no NVSwitch, Lambda removes the unit from the boot
  # targets) "systemctl enable --now" blocked until systemd gave up, 7.7 min before any image was fetched (live
  # 2026-10-22). The start is bounded too.
  - |
    if [ "$(nvidia-smi -L 2>/dev/null | wc -l)" -ge 2 ] && { ls /dev/nvidia-nvswitch* >/dev/null 2>&1 || lspci 2>/dev/null | grep -qi nvswitch; }; then
      . /opt/acudx/images.sh && mark "fabric manager: starting (NVSwitch host)"
      timeout 90 systemctl enable --now nvidia-fabricmanager 2>/dev/null || echo "acudx: nvidia-fabricmanager did not start within 90 s or is not present"
      for _ in $(seq 1 90); do
        st=$(nvidia-smi -q 2>/dev/null | awk '/Fabric/{f=1} f && /State/{print $3; exit}')
        case "$st" in Completed|N/A|"") break ;; esac
        sleep 5
      done
      echo "acudx: GPU fabric state ${st:-none}"
      mark "fabric manager: state ${st:-none}"
    else
      echo "acudx: no NVSwitch on this host; the fabric manager is not needed"
    fi
  # GPU layout. One GPU: every service shares card 0. Two or more (gpu_2x_*, gpu_8x_*): the avatar runner
  # gets card 1 to itself (more calls per worker) and the image edit server the next card.
  - |
    if ! grep -q '^AVATAR_GPU=' /opt/acudx/.env; then
      n=$(nvidia-smi -L 2>/dev/null | wc -l)
      if [ "${n:-1}" -ge 2 ]; then
        img=$([ "$n" -ge 3 ] && echo 2 || echo 1)
        printf 'GPU_COUNT=%s\nAVATAR_GPU=1\nAVATAR_DEDICATED_GPU=1\nIMAGEGEN_GPU=%s\n' "$n" "$img" >> /opt/acudx/.env
        sed -i 's/^AVATAR_MAX_SESSIONS=.*/AVATAR_MAX_SESSIONS=4/' /opt/acudx/.env
      else
        printf 'GPU_COUNT=1\nAVATAR_GPU=0\nAVATAR_DEDICATED_GPU=0\nIMAGEGEN_GPU=0\n' >> /opt/acudx/.env
      fi
      # A card under 70 GB shares vLLM with voice, the runner and the image edits: vLLM takes 0.45 of
      # it (18 GB on 40 GB: Qwen3-14B-AWQ weights about 10 GB, KV cache for about 37k tokens at 16k
      # max length), larger cards keep 0.60. At 0.50 a live call still left too little for the edits.
      # Live 2026-10-21 on an A100 40 GB at 0.55: 7.2 GB stayed free after the runner, below the 9 GB the
      # image edit server needs for model offload, so it ran layer by layer at 154 s per picture.
      total=$(nvidia-smi --query-gpu=memory.total --format=csv,noheader,nounits | head -1 | tr -d ' ')
      if [ "${n:-1}" -lt 2 ] && [ "${total:-0}" -lt 70000 ]; then echo 'VLLM_GPU_UTIL=0.45' >> /opt/acudx/.env; fi
      # One 80 GB card serving live calls: vLLM takes 0.50 (40 GB, Qwen3-32B-AWQ weights about 18 GB plus
      # KV cache), so both Chatterbox replicas, the runner with its calls and the image edits in gpu mode
      # (20 GB) fit beside it with room to spare (at 0.60 the edits dropped to model offload).
      if [ "${n:-1}" -lt 2 ] && [ "${total:-0}" -ge 70000 ]; then echo 'VLLM_GPU_UTIL=0.50' >> /opt/acudx/.env; fi
    fi
  # Parallel start-up (docs/architecture/18 6.8, live 2026-10-21: 17 min 20 s from a cold launch to live
  # video, with vLLM, the Chatterbox build, the runner and the edit server one after another). Now every
  # image is fetched at once (pulls, or the three built images from the registry or the filesystem cache),
  # the voices and the runner start as soon as their images are there, and vLLM starts last: it reserves
  # a fraction of the card and refuses to start, or dies during its memory profile, when another process
  # takes memory meanwhile (worker 10, 2026-10-20), so it goes once the side-cars have loaded.
  - |
    cd /opt/acudx && set -a && . ./.env && set +a && . ./images.sh
    mark "images: fetching"
    for img in vllm/vllm-openai:v0.11.0 ghcr.io/speaches-ai/speaches:0.8.3-cuda ghcr.io/remsky/kokoro-fastapi-gpu:v0.2.4 \
               caddy:2.9.1 nginx:1.30.6-alpine ghcr.io/coturn/coturn:4.18.0-debian; do
      ( for i in 1 2 3; do docker pull -q "$img" >/dev/null 2>&1 && break; sleep 10; done; mark "image pulled $img" ) &
    done
    # The Chatterbox image: registry, filesystem cache, else built from the pinned checkout (retried, since
    # one upstream hiccup otherwise leaves the worker without a voice for its whole life).
    nohup bash -c '. /opt/acudx/images.sh; cd /opt/acudx; set -a; . ./.env; set +a
      for i in 1 2 3; do
        ensure_image chatterbox acudx/chatterbox-tts-api:a5f4661-cu124 "$(chatterbox_key)" \
          sh -c "docker compose build chatterbox >>/var/log/acudx-chatterbox-build.log 2>&1" && exit 0
        echo "acudx: chatterbox image attempt $i failed" >&2; sleep 30
      done
      touch /opt/acudx/public/avatar-status/chatterbox-failed' >/var/log/acudx-chatterbox-image.log 2>&1 &
  - nohup /opt/acudx/avatar.sh >/var/log/acudx-avatar.log 2>&1 &
  - nohup /opt/acudx/imagegen.sh >/var/log/acudx-imagegen.log 2>&1 &
  - cd /opt/acudx && set -a && . ./.env && set +a && docker compose up -d edge caddy
  # The voices first (the runner waits for Chatterbox), then the runner, then vLLM.
  - |
    cd /opt/acudx && set -a && . ./.env && set +a && . ./images.sh
    docker compose up -d speaches kokoro kokoro2 && mark "speaches and kokoro started"
    for _ in $(seq 1 720); do
      docker image inspect acudx/chatterbox-tts-api:a5f4661-cu124 >/dev/null 2>&1 && break
      [ -f /opt/acudx/public/avatar-status/chatterbox-failed ] && break
      sleep 5
    done
    if docker image inspect acudx/chatterbox-tts-api:a5f4661-cu124 >/dev/null 2>&1; then
      docker compose up -d --no-build chatterbox && mark "chatterbox started"
      # A second Chatterbox replica for two concurrent Turkish calls, only where the VRAM allows it (about
      # 4 GB; a 40 GB card keeps that room for the avatar runner).
      total=$(nvidia-smi --query-gpu=memory.total --format=csv,noheader,nounits | head -1 | tr -d ' ')
      if [ "${total:-0}" -ge 70000 ]; then docker compose up -d --no-build chatterbox2; else echo "acudx: chatterbox2 skipped (${total} MiB)"; fi
      # Voice library and the warm-up lines (conditionals cache) as soon as the voice is up, not after vLLM.
      nohup /opt/acudx/seed-voices.sh >/var/log/acudx-seed-voices.log 2>&1 &
    fi
  - |
    cd /opt/acudx && set -a && . ./.env && set +a && . ./images.sh
    # vLLM after the runner has its memory (avatar.sh status ready or disabled) and Chatterbox has loaded
    # its model (its /health answers 200 while it loads), 15 min at most.
    for _ in $(seq 1 180); do
      av=0; cb=0
      case "$(cat /opt/acudx/public/avatar-status/status.json 2>/dev/null)" in *'"state":"ready"'*|*'"state":"disabled"'*) av=1 ;; esac
      docker compose exec -T chatterbox curl -sf http://localhost:4123/health 2>/dev/null | grep -q '"initialization_state":"ready"' && cb=1
      [ -f /opt/acudx/public/avatar-status/chatterbox-failed ] && cb=1
      [ "$av" = 1 ] && [ "$cb" = 1 ] && break
      sleep 5
    done
    mark "vllm: starting"
    timeout 2400 docker compose up -d --wait vllm || echo "acudx - vllm did not become healthy within 40 min" >&2
    mark "vllm: healthy"
  # Task 24 check: a fresh container from the same service definition reports what torch sees.
  - |
    cd /opt/acudx && set -a && . ./.env && set +a
    docker compose run --rm --no-deps --entrypoint /app/.venv/bin/python chatterbox -c "import torch; print('torch', torch.__version__, 'cuda build', torch.version.cuda, 'cuda available', torch.cuda.is_available(), 'devices', torch.cuda.device_count())" >/var/log/acudx-chatterbox-gpu.log 2>&1 || echo "acudx: chatterbox torch check failed" >>/var/log/acudx-chatterbox-gpu.log
