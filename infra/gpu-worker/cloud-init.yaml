  - path: /opt/acudx/avatar/acudx_fetch_models.py
    content: |
      """Fetch the MuseTalk 1.5 weights the LiveTalking musetalk backend loads, pinned by revision.

      Layout written under /app/models (what avatars/musetalk/utils/utils.py::load_all_model,
      models/vae.py, whisper/audio2feature.py and utils/face_parsing expect):

        musetalkV15/unet.pth, musetalkV15/musetalk.json   TMElyralab/MuseTalk @ 2bcb936e2fddb4d86db4c62fd45b387d0c061571
        sd-vae/config.json, diffusion_pytorch_model.bin   stabilityai/sd-vae-ft-mse @ 31f26fdeee1355a5c34592e401dd41e45d25a493
        whisper/config.json, pytorch_model.bin, preprocessor_config.json
                                                          openai/whisper-tiny @ 169d4a4341b33bc18d8881c4b69c2e104e1cc0af
        face-parse-bisent/79999_iter.pth, resnet18-5c106cde.pth
                                                          ManyOtherFunctions/face-parse-bisent @ 0073b233a5a3c4b1377d4dbf49245017938a72b5
                                                          (sha256 checked against the LFS oids)
        avatars/musetalk/utils/face_detection/detection/sfd/s3fd.pth
                                                          the face_alignment S3FD detector, sha256 prefix 619a316812 (its file name)

      Files land in HF_HOME (the worker keeps it on the Lambda filesystem, so later boots skip the
      download) and are linked into place. Exits non-zero on any mismatch.
      """

      from __future__ import annotations

      import hashlib
      import os
      import shutil
      import sys
      import urllib.request

      from huggingface_hub import hf_hub_download

      APP = os.environ.get("LIVETALKING_DIR", "/app")
      HF = [
          ("TMElyralab/MuseTalk", "2bcb936e2fddb4d86db4c62fd45b387d0c061571",
           [("musetalkV15/unet.pth", "musetalkV15/unet.pth"), ("musetalkV15/musetalk.json", "musetalkV15/musetalk.json")]),
          ("stabilityai/sd-vae-ft-mse", "31f26fdeee1355a5c34592e401dd41e45d25a493",
           [("config.json", "sd-vae/config.json"), ("diffusion_pytorch_model.bin", "sd-vae/diffusion_pytorch_model.bin")]),
          ("openai/whisper-tiny", "169d4a4341b33bc18d8881c4b69c2e104e1cc0af",
           [("config.json", "whisper/config.json"), ("pytorch_model.bin", "whisper/pytorch_model.bin"),
            ("preprocessor_config.json", "whisper/preprocessor_config.json")]),
          ("ManyOtherFunctions/face-parse-bisent", "0073b233a5a3c4b1377d4dbf49245017938a72b5",
           [("79999_iter.pth", "face-parse-bisent/79999_iter.pth"),
            ("resnet18-5c106cde.pth", "face-parse-bisent/resnet18-5c106cde.pth")]),
      ]
      SHA256 = {
          "face-parse-bisent/79999_iter.pth": "468e13ca13a9b43cc0881a9f99083a430e9c0a38abd935431d1c28ee94b26567",
          "face-parse-bisent/resnet18-5c106cde.pth": "5c106cde386e87d4033832f2996f5493238eda96ccf559d1d62760c4de0613f8",
      }
      S3FD_URL = "https://www.adrianbulat.com/downloads/python-fan/s3fd-619a316812.pth"
      S3FD_PREFIX = "619a316812"
      S3FD_DEST = os.path.join(APP, "avatars/musetalk/utils/face_detection/detection/sfd/s3fd.pth")


      def sha256(path: str) -> str:
          h = hashlib.sha256()
          with open(path, "rb") as f:
              for block in iter(lambda: f.read(1 << 20), b""):
                  h.update(block)
          return h.hexdigest()


      def link(src: str, dest: str) -> None:
          os.makedirs(os.path.dirname(dest), exist_ok=True)
          if os.path.lexists(dest):
              os.remove(dest)
          os.symlink(os.path.realpath(src), dest)


      def main() -> int:
          models = os.path.join(APP, "models")
          for repo, rev, files in HF:
              for remote, local in files:
                  path = hf_hub_download(repo_id=repo, filename=remote, revision=rev)
                  want = SHA256.get(local)
                  if want and sha256(path) != want:
                      print(f"acudx: sha256 mismatch for {repo}/{remote}", file=sys.stderr)
                      return 1
                  link(path, os.path.join(models, local))
                  print(f"ok {repo}@{rev[:8]} {remote} -> models/{local}")
          cache = os.path.join(os.environ.get("HF_HOME", "/hf"), "acudx-s3fd", "s3fd-619a316812.pth")
          if not os.path.isfile(cache):
              os.makedirs(os.path.dirname(cache), exist_ok=True)
              tmp = cache + ".part"
              with urllib.request.urlopen(S3FD_URL, timeout=120) as r, open(tmp, "wb") as f:
                  shutil.copyfileobj(r, f)
              os.replace(tmp, cache)
          if not sha256(cache).startswith(S3FD_PREFIX):
              print("acudx: s3fd checksum mismatch", file=sys.stderr)
              return 1
          link(cache, S3FD_DEST)
          print("ok s3fd -> " + S3FD_DEST)
          return 0


      if __name__ == "__main__":
          sys.exit(main())
  - path: /opt/acudx/avatar/acudx_register.py
    content: |
      """Register an edited portrait onto the case portrait it was made from (pure OpenCV + numpy).

      The image edit server (FLUX.2 klein) keeps the person, clothes and background but not the exact
      framing: its output can be a few pixels off, a little larger or smaller, and of another size. When
      the live call cross-faded from the plain portrait to such an edit, two faces showed for a moment
      (live 2026-10-21, "ghosting"). Every edited picture is therefore warped onto the base portrait
      before it is prepared, with a similarity transform (shift, scale, small rotation) estimated from
      the unchanged background and hair, so the base and every variant share one frame, one crop and
      one face box. Where the warp leaves no data the base pixels are used.
      """

      from __future__ import annotations

      import math

      import cv2
      import numpy as np

      MAX_SCALE_DEV = 0.18      # accepted scale 0.82 .. 1.18
      MAX_ROT_DEG = 8.0
      MAX_SHIFT_FRAC = 0.15
      MIN_INLIERS = 25


      def fit_size(img: np.ndarray, w: int, h: int) -> np.ndarray:
          """Centre-crop ``img`` to the aspect of w x h, then resize to exactly w x h."""
          ih, iw = img.shape[:2]
          target = w / float(h)
          have = iw / float(ih)
          if abs(have - target) > 1e-3:
              if have > target:
                  nw = int(round(ih * target))
                  x0 = (iw - nw) // 2
                  img = img[:, x0:x0 + nw]
              else:
                  nh = int(round(iw / target))
                  y0 = (ih - nh) // 2
                  img = img[y0:y0 + nh, :]
          if img.shape[1] != w or img.shape[0] != h:
              img = cv2.resize(img, (w, h), interpolation=cv2.INTER_AREA if img.shape[1] > w else cv2.INTER_CUBIC)
          return img


      def _params(m: np.ndarray) -> tuple[float, float, float, float]:
          """(scale, rotation degrees, tx, ty) of a 2x3 similarity matrix."""
          a, b = float(m[0, 0]), float(m[1, 0])
          return math.hypot(a, b), math.degrees(math.atan2(b, a)), float(m[0, 2]), float(m[1, 2])


      def _plausible(m: np.ndarray | None, w: int, h: int) -> bool:
          if m is None or not np.all(np.isfinite(m)):
              return False
          s, rot, tx, ty = _params(m)
          return (abs(s - 1.0) <= MAX_SCALE_DEV and abs(rot) <= MAX_ROT_DEG
                  and abs(tx) <= MAX_SHIFT_FRAC * w + abs(s - 1.0) * w and abs(ty) <= MAX_SHIFT_FRAC * h + abs(s - 1.0) * h)


      def _orb(ref_g: np.ndarray, img_g: np.ndarray) -> tuple[np.ndarray | None, int]:
          orb = cv2.ORB_create(nfeatures=3000, scaleFactor=1.2, nlevels=8, fastThreshold=10)
          k1, d1 = orb.detectAndCompute(img_g, None)
          k2, d2 = orb.detectAndCompute(ref_g, None)
          if d1 is None or d2 is None or len(k1) < MIN_INLIERS or len(k2) < MIN_INLIERS:
              return None, 0
          pairs = cv2.BFMatcher(cv2.NORM_HAMMING).knnMatch(d1, d2, k=2)
          good = [p[0] for p in pairs if len(p) == 2 and p[0].distance < 0.8 * p[1].distance]
          if len(good) < MIN_INLIERS:
              return None, len(good)
          src = np.float32([k1[g.queryIdx].pt for g in good]).reshape(-1, 1, 2)
          dst = np.float32([k2[g.trainIdx].pt for g in good]).reshape(-1, 1, 2)
          m, inl = cv2.estimateAffinePartial2D(src, dst, method=cv2.RANSAC, ransacReprojThreshold=3.0,
                                               maxIters=4000, confidence=0.995)
          n = int(inl.sum()) if inl is not None else 0
          return (m if n >= MIN_INLIERS else None), n


      def _ecc(ref_g: np.ndarray, img_g: np.ndarray, init: np.ndarray | None) -> np.ndarray | None:
          """Refine (or find, from identity) a Euclidean-plus-scale warp by ECC on a 320 px pyramid level."""
          h, w = ref_g.shape[:2]
          f = 320.0 / max(w, h) if max(w, h) > 320 else 1.0
          r = cv2.resize(ref_g, (int(w * f), int(h * f)), interpolation=cv2.INTER_AREA).astype(np.float32)
          i = cv2.resize(img_g, (int(w * f), int(h * f)), interpolation=cv2.INTER_AREA).astype(np.float32)
          # ECC estimates the map ref -> img (inverse of what warpAffine with WARP_INVERSE_MAP needs).
          if init is None:
              warp = np.eye(2, 3, dtype=np.float32)
          else:
              inv = cv2.invertAffineTransform(init.astype(np.float32))
              warp = inv.copy()
              warp[:, 2] *= f
          try:
              _cc, warp = cv2.findTransformECC(r, i, warp, cv2.MOTION_AFFINE,
                                               (cv2.TERM_CRITERIA_EPS | cv2.TERM_CRITERIA_COUNT, 200, 1e-6), None, 5)
          except cv2.error:
              return None
          warp = warp.astype(np.float64)
          warp[:, 2] /= f
          return cv2.invertAffineTransform(warp)


      def align_to(ref: np.ndarray, img: np.ndarray) -> tuple[np.ndarray, dict]:
          """``img`` (an edit of ``ref``) warped into ``ref``'s frame: same size, same framing.

          Returns the aligned BGR image and what was done: ``method`` (orb+ecc, orb, ecc, identity),
          ``scale``, ``rotation_deg``, ``shift_px``, ``inliers``, and the mean background difference
          to the base before and after (``residual_before`` / ``residual_after``, 0..255)."""
          h, w = ref.shape[:2]
          img = fit_size(img, w, h)
          ref_g = cv2.cvtColor(ref, cv2.COLOR_BGR2GRAY)
          img_g = cv2.cvtColor(img, cv2.COLOR_BGR2GRAY)
          m, inliers = _orb(ref_g, img_g)
          method = "orb"
          if m is not None and not _plausible(m, w, h):
              m = None
          refined = _ecc(ref_g, img_g, m)
          if refined is not None and _plausible(refined, w, h):
              m, method = refined, ("orb+ecc" if m is not None else "ecc")
          if m is None:
              m, method = np.eye(2, 3, dtype=np.float64), "identity"
          out = cv2.warpAffine(img, m, (w, h), flags=cv2.INTER_LINEAR, borderMode=cv2.BORDER_CONSTANT, borderValue=0)
          valid = cv2.warpAffine(np.full((h, w), 255, np.uint8), m, (w, h), flags=cv2.INTER_NEAREST,
                                 borderMode=cv2.BORDER_CONSTANT, borderValue=0)
          valid = cv2.erode(valid, np.ones((3, 3), np.uint8))
          keep = (valid.astype(np.float32) / 255.0)[..., None]
          out = np.clip(keep * out.astype(np.float32) + (1.0 - keep) * ref.astype(np.float32), 0, 255).astype(np.uint8)
          s, rot, tx, ty = _params(m)
          ring = border_mask(h, w)
          return out, {"method": method, "scale": round(s, 4), "rotation_deg": round(rot, 3),
                       "shift_px": [round(tx, 1), round(ty, 1)], "inliers": inliers,
                       "residual_before": round(residual(ref, img, ring), 2),
                       "residual_after": round(residual(ref, out, ring), 2)}


      def border_mask(h: int, w: int, frac: float = 0.16) -> np.ndarray:
          """The frame's outer band (background, shoulders): where an edit should not change anything."""
          m = np.zeros((h, w), bool)
          bh, bw = max(2, int(h * frac)), max(2, int(w * frac))
          m[:bh, :] = m[-bh:, :] = True
          m[:, :bw] = m[:, -bw:] = True
          return m


      def residual(a: np.ndarray, b: np.ndarray, mask: np.ndarray) -> float:
          d = np.abs(a.astype(np.int16) - b.astype(np.int16)).mean(axis=2)
          return float(d[mask].mean()) if mask.any() else float(d.mean())


      def ghost_score(a: np.ndarray, b: np.ndarray) -> float:
          """How far apart two frames' edges are (0 = same framing): 1 - the normalised cross-correlation of
          their gradient magnitudes. A cross-fade between frames with a high score shows a double image."""
          ga = _grad(a)
          gb = _grad(b)
          ga -= ga.mean()
          gb -= gb.mean()
          den = float(np.sqrt((ga * ga).sum() * (gb * gb).sum()))
          return 1.0 if den < 1e-9 else round(1.0 - float((ga * gb).sum()) / den, 4)


      def _grad(img: np.ndarray) -> np.ndarray:
          g = cv2.cvtColor(img, cv2.COLOR_BGR2GRAY).astype(np.float32) if img.ndim == 3 else img.astype(np.float32)
          g = cv2.GaussianBlur(g, (0, 0), 1.2)
          return cv2.magnitude(cv2.Sobel(g, cv2.CV_32F, 1, 0), cv2.Sobel(g, cv2.CV_32F, 0, 1))
  - path: /opt/acudx/avatar/acudx_avatar_server.py
    content: |
      """AcuDx avatar runner: LiveTalking (pinned commit) + MuseTalk 1.5, WebRTC out, audio in.

      Runs inside the LiveTalking checkout (cwd /app) on the GPU worker, behind Caddy's
      bearer check at /avatar/*. The gateway (server/voice/avatar/musetalk.py) is the only
      client of the control routes; the browser only ever sees the SDP answer and media.

      Routes (all JSON unless noted):
        GET  /health                 model, sessions (with per-call fps and underruns), prepared avatars,
                                     VRAM, measured infer fps, the call limit
        GET  /avatars                prepared avatar ids
        GET  /avatars/{avatar_id}    frame size, face box and idle frames of a prepared avatar
        PUT  /avatars/{avatar_id}    body = portrait image bytes (jpeg/png); prepares the MuseTalk
                                     latents, face boxes and blend masks for that face: a short idle
                                     loop (subtle head motion) generated from the one portrait;
                                     ?ref=<base id>: the picture is an edit of that base portrait and
                                     is registered onto its frame (same crop, face box and loop)
        POST /offer                  {sdp, type, avatar, tuning?} -> {sdp, type, sessionid}; tuning =
                                     {batch_size, ahead_frames, lookahead_frames, av_shift_ms}, bounded
        GET  /stream                 WebSocket audio in: {"type":"begin","sessionid","sample_rate"} text,
                                     then binary s16le mono PCM chunks as the TTS produces them, then
                                     {"type":"end"} -> {"type":"done", frames, ...}. Lip sync starts on
                                     the first 20 ms of audio; no file upload, no full-utterance wait
        POST /humanaudio             multipart sessionid + file (wav or mp3): the whole-file fallback
        POST /interrupt_talk         {sessionid}
        POST /is_speaking            {sessionid}
        POST /close                  {sessionid}: stop the render threads and close the peer connection
        POST /switch                 {sessionid, avatar, crossfade_ms}: another prepared picture of the same
                                     patient; applied once the patient is silent, faded on matched frames
        POST /tuning                 {sessionid, av_shift_ms}: move the call's video against its audio
        GET  /turn                   WebSocket <-> TCP byte bridge to the worker's TURN server, for
                                     clients whose network only allows HTTPS (see docs/architecture/18 6.3)
        POST /detect_bench           body = portrait: face box and per-phase timings of each detection mode
                                     (?modes=legacy,fast), in the preparation queue
        GET  /turn_check             TURN Allocate against this worker's public TURN endpoints, from
                                     inside the worker: turns:turn.<domain>:443 (TLS, certificate and
                                     host name verified), turn:<domain>:3478 over TCP and UDP

      The avatar preparation below is a port of LiveTalking avatars/musetalk/genavatar.py
      (Apache-2.0) that reuses the already-loaded VAE instead of loading a second UNet,
      and writes the frames as 00000000.png ... (load_avatar sorts frames by integer file name).
      """

      from __future__ import annotations

      import asyncio
      import base64
      import collections
      import concurrent.futures
      import copy
      import hashlib
      import hmac
      import json
      import logging
      import math
      import os
      import pickle
      import queue
      import re
      import ssl
      import sys
      import threading
      import time

      AVATAR_PORT = int(os.environ.get("AVATAR_PORT", "8010"))
      MAX_SESSIONS = int(os.environ.get("AVATAR_MAX_SESSIONS", "2"))
      # True on multi-GPU hosts where the runner has a GPU of its own (cloud-init AVATAR_GPU): the
      # gateway then takes MAX_SESSIONS as this worker's call limit.
      DEDICATED_GPU = os.environ.get("AVATAR_DEDICATED_GPU", "0") == "1"
      BATCH_SIZE = int(os.environ.get("AVATAR_BATCH_SIZE", "4"))
      # Frames the render loop keeps ahead of the WebRTC sender (queued + in flight). Upstream throttles
      # on the video queue alone (5 frames) while two feature batches and 16 rendered frames pile up
      # behind it, about 1.5 s; counting every stage keeps the lead to this many frames.
