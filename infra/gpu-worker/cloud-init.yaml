      def _from_cache(avatar_id: str, key: str) -> bool:
          """Copy a preparation another worker (or this one, under another id) made from the same picture."""
          if not AVATAR_CACHE_DIR:
              return False
          src = os.path.join(AVATAR_CACHE_DIR, key)
          if not os.path.isfile(os.path.join(src, "avator_info.json")):
              return False
          import shutil  # noqa: PLC0415
          dst = _avatar_dir(avatar_id)
          tmp = dst + ".incoming"
          shutil.rmtree(tmp, ignore_errors=True)
          shutil.copytree(src, tmp)
          with open(os.path.join(tmp, "avator_info.json")) as f:
              info = json.load(f)
          info["avatar_id"] = avatar_id
          with open(os.path.join(tmp, "avator_info.json"), "w") as f:
              json.dump(info, f)
          shutil.rmtree(dst, ignore_errors=True)
          os.replace(tmp, dst)
          return _is_prepared(avatar_id)


      def _to_cache(avatar_id: str, key: str) -> None:
          if not AVATAR_CACHE_DIR:
