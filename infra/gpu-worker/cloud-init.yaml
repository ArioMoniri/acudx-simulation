  - path: /opt/acudx/avatar/acudx_fetch_models.py
    content: |
      """Fetch the MuseTalk 1.5 weights the LiveTalking musetalk backend loads, pinned by revision.

      Layout written under /app/models (what avatars/musetalk/utils/utils.py::load_all_model,
      models/vae.py, whisper/audio2feature.py and utils/face_parsing expect):

        musetalkV15/unet.pth, musetalkV15/musetalk.json   TMElyralab/MuseTalk @ 2bcb936e2fddb4d86db4c62fd45b387d0c061571
        sd-vae/config.json, diffusion_pytorch_model.bin   stabilityai/sd-vae-ft-mse @ 31f26fdeee1355a5c34592e401dd41e45d25a493
        whisper/config.json, pytorch_model.bin, preprocessor_config.json
                                                          openai/whisper-tiny @ 169d4a4341b33bc18d8881c4b69c2e104e1cc0af
        face-parse-bisent/79999_iter.pth, resnet18-5c106cde.pth
                                                          ManyOtherFunctions/face-parse-bisent @ 0073b233a5a3c4b1377d4dbf49245017938a72b5
                                                          (sha256 checked against the LFS oids)
        avatars/musetalk/utils/face_detection/detection/sfd/s3fd.pth
                                                          the face_alignment S3FD detector, sha256 prefix 619a316812 (its file name)

      Files land in HF_HOME (the worker keeps it on the Lambda filesystem, so later boots skip the
      download) and are linked into place. Exits non-zero on any mismatch.
      """

      from __future__ import annotations

      import hashlib
      import os
      import shutil
      import sys
      import urllib.request

      from huggingface_hub import hf_hub_download

      APP = os.environ.get("LIVETALKING_DIR", "/app")
      HF = [
          ("TMElyralab/MuseTalk", "2bcb936e2fddb4d86db4c62fd45b387d0c061571",
           [("musetalkV15/unet.pth", "musetalkV15/unet.pth"), ("musetalkV15/musetalk.json", "musetalkV15/musetalk.json")]),
          ("stabilityai/sd-vae-ft-mse", "31f26fdeee1355a5c34592e401dd41e45d25a493",
           [("config.json", "sd-vae/config.json"), ("diffusion_pytorch_model.bin", "sd-vae/diffusion_pytorch_model.bin")]),
          ("openai/whisper-tiny", "169d4a4341b33bc18d8881c4b69c2e104e1cc0af",
           [("config.json", "whisper/config.json"), ("pytorch_model.bin", "whisper/pytorch_model.bin"),
            ("preprocessor_config.json", "whisper/preprocessor_config.json")]),
          ("ManyOtherFunctions/face-parse-bisent", "0073b233a5a3c4b1377d4dbf49245017938a72b5",
           [("79999_iter.pth", "face-parse-bisent/79999_iter.pth"),
            ("resnet18-5c106cde.pth", "face-parse-bisent/resnet18-5c106cde.pth")]),
      ]
      SHA256 = {
          "face-parse-bisent/79999_iter.pth": "468e13ca13a9b43cc0881a9f99083a430e9c0a38abd935431d1c28ee94b26567",
          "face-parse-bisent/resnet18-5c106cde.pth": "5c106cde386e87d4033832f2996f5493238eda96ccf559d1d62760c4de0613f8",
      }
      S3FD_URL = "https://www.adrianbulat.com/downloads/python-fan/s3fd-619a316812.pth"
      S3FD_PREFIX = "619a316812"
      S3FD_DEST = os.path.join(APP, "avatars/musetalk/utils/face_detection/detection/sfd/s3fd.pth")


      def sha256(path: str) -> str:
          h = hashlib.sha256()
          with open(path, "rb") as f:
              for block in iter(lambda: f.read(1 << 20), b""):
                  h.update(block)
          return h.hexdigest()


      def link(src: str, dest: str) -> None:
          os.makedirs(os.path.dirname(dest), exist_ok=True)
          if os.path.lexists(dest):
              os.remove(dest)
          os.symlink(os.path.realpath(src), dest)


      def main() -> int:
          models = os.path.join(APP, "models")
          for repo, rev, files in HF:
              for remote, local in files:
                  path = hf_hub_download(repo_id=repo, filename=remote, revision=rev)
                  want = SHA256.get(local)
                  if want and sha256(path) != want:
                      print(f"acudx: sha256 mismatch for {repo}/{remote}", file=sys.stderr)
                      return 1
                  link(path, os.path.join(models, local))
                  print(f"ok {repo}@{rev[:8]} {remote} -> models/{local}")
          cache = os.path.join(os.environ.get("HF_HOME", "/hf"), "acudx-s3fd", "s3fd-619a316812.pth")
          if not os.path.isfile(cache):
              os.makedirs(os.path.dirname(cache), exist_ok=True)
              tmp = cache + ".part"
              with urllib.request.urlopen(S3FD_URL, timeout=120) as r, open(tmp, "wb") as f:
                  shutil.copyfileobj(r, f)
              os.replace(tmp, cache)
          if not sha256(cache).startswith(S3FD_PREFIX):
              print("acudx: s3fd checksum mismatch", file=sys.stderr)
              return 1
          link(cache, S3FD_DEST)
          print("ok s3fd -> " + S3FD_DEST)
          return 0


      if __name__ == "__main__":
          sys.exit(main())
  - path: /opt/acudx/avatar/acudx_avatar_server.py
    content: |
      """AcuDx avatar runner: LiveTalking (pinned commit) + MuseTalk 1.5, WebRTC out, audio in.

      Runs inside the LiveTalking checkout (cwd /app) on the GPU worker, behind Caddy's
      bearer check at /avatar/*. The gateway (server/voice/avatar/musetalk.py) is the only
      client of the control routes; the browser only ever sees the SDP answer and media.

      Routes (all JSON unless noted):
        GET  /health                 model, sessions (with per-call fps and underruns), prepared avatars,
                                     VRAM, measured infer fps, the call limit
        GET  /avatars                prepared avatar ids
        GET  /avatars/{avatar_id}    frame size, face box and idle frames of a prepared avatar
        PUT  /avatars/{avatar_id}    body = portrait image bytes (jpeg/png); prepares the MuseTalk
                                     latents, face boxes and blend masks for that face: a short idle
                                     loop (subtle head motion) generated from the one portrait
        POST /offer                  {sdp, type, avatar, tuning?} -> {sdp, type, sessionid}; tuning =
                                     {batch_size, ahead_frames, lookahead_frames, av_shift_ms}, bounded
        GET  /stream                 WebSocket audio in: {"type":"begin","sessionid","sample_rate"} text,
                                     then binary s16le mono PCM chunks as the TTS produces them, then
                                     {"type":"end"} -> {"type":"done", frames, ...}. Lip sync starts on
                                     the first 20 ms of audio; no file upload, no full-utterance wait
        POST /humanaudio             multipart sessionid + file (wav or mp3): the whole-file fallback
        POST /interrupt_talk         {sessionid}
        POST /is_speaking            {sessionid}
        POST /close                  {sessionid}: stop the render threads and close the peer connection
        GET  /turn                   WebSocket <-> TCP byte bridge to the worker's TURN server, for
                                     clients whose network only allows HTTPS (see docs/architecture/18 6.3)
        GET  /turn_check             TURN Allocate against this worker's public TURN endpoints, from
                                     inside the worker: turns:turn.<domain>:443 (TLS, certificate and
                                     host name verified), turn:<domain>:3478 over TCP and UDP

      The avatar preparation below is a port of LiveTalking avatars/musetalk/genavatar.py
      (Apache-2.0) that reuses the already-loaded VAE instead of loading a second UNet,
      and writes the frames as 00000000.png ... (load_avatar sorts frames by integer file name).
      """

      from __future__ import annotations

      import asyncio
      import base64
      import collections
      import copy
      import hashlib
      import hmac
      import json
      import logging
      import math
      import os
      import pickle
      import queue
      import re
      import ssl
      import sys
      import threading
      import time

      AVATAR_PORT = int(os.environ.get("AVATAR_PORT", "8010"))
      MAX_SESSIONS = int(os.environ.get("AVATAR_MAX_SESSIONS", "2"))
      # True on multi-GPU hosts where the runner has a GPU of its own (cloud-init AVATAR_GPU): the
      # gateway then takes MAX_SESSIONS as this worker's call limit.
      DEDICATED_GPU = os.environ.get("AVATAR_DEDICATED_GPU", "0") == "1"
      BATCH_SIZE = int(os.environ.get("AVATAR_BATCH_SIZE", "4"))
      # Frames the render loop keeps ahead of the WebRTC sender (queued + in flight). Upstream throttles
      # on the video queue alone (5 frames) while two feature batches and 16 rendered frames pile up
      # behind it, about 1.5 s; counting every stage keeps the lead to this many frames.
      AHEAD_FRAMES = int(os.environ.get("AVATAR_AHEAD_FRAMES", "6"))
      # Right audio context the whisper features need, in 20 ms audio frames (upstream -r 10).
      LOOKAHEAD_FRAMES = int(os.environ.get("AVATAR_LOOKAHEAD_FRAMES", "4"))
      # Positive: the video leaves this many ms after its audio (fixes lips leading the voice).
      AV_SHIFT_MS = int(os.environ.get("AVATAR_AV_SHIFT_MS", "0"))
      IDLE_FRAMES = int(os.environ.get("AVATAR_IDLE_FRAMES", "75"))
      TURN_TCP_HOST = os.environ.get("AVATAR_TURN_TCP_HOST", "host.docker.internal")
      TURN_TCP_PORT = int(os.environ.get("AVATAR_TURN_TCP_PORT", "3478"))
      TURN_SECRET = os.environ.get("TURN_SECRET", "")
      # The host's own address for the TURN self-check (the public IP is NATed and does not hairpin).
      TURN_HOST_ADDR = os.environ.get("AVATAR_TURN_HOST_ADDR", "")
      WORKER_DOMAIN = os.environ.get("WORKER_DOMAIN", "")
      LIVETALKING_REF = os.environ.get("LIVETALKING_REF", "")
      MAX_IMAGE_BYTES = 8 * 1024 * 1024
      AVATAR_ID_RE = re.compile(r"^[a-z0-9_-]{1,64}$")
      MAX_FRAME_H = 720
      PREP_VERSION = 2  # 2: reflected + blurred extension, idle loop; older avatar dirs are re-prepared

      # LiveTalking parses its own argv; set it before importing anything from the checkout.
      sys.argv = [sys.argv[0], "--config", "", "--model", "musetalk", "--avatar_id", "acudx_none",
                  "--transport", "webrtc", "--stun", "", "--tts", "edgetts", "--max_session", str(MAX_SESSIONS),
                  "--batch_size", str(BATCH_SIZE), "--listenport", str(AVATAR_PORT)]

      import cv2  # noqa: E402
      import numpy as np  # noqa: E402
      import soxr  # noqa: E402  (librosa dependency, streaming resampler)
      import torch  # noqa: E402
      from aiohttp import WSMsgType, web  # noqa: E402

      from config import parse_args  # noqa: E402

      opt = parse_args()

      import registry  # noqa: E402
      import avatars.musetalk_avatar as mt  # noqa: E402
      from avatars.musetalk.utils.blending import get_crop_box, get_image_prepare_material  # noqa: E402
      from avatars.musetalk.utils.face_parsing import FaceParsing  # noqa: E402
      from avatars.musetalk.utils.preprocessing import coord_placeholder, get_landmark_and_bbox  # noqa: E402
      from server.rtc_manager import RTCManager  # noqa: E402
      from server.routes import humanaudio, interrupt_talk, is_speaking  # noqa: E402
      from server.session_manager import MaxSessionError, session_manager  # noqa: E402

      log = logging.getLogger("acudx.avatar")
      logging.basicConfig(level=logging.INFO, format="%(asctime)s %(levelname)s %(name)s %(message)s")

      STATE: dict = {"infer_fps": None, "infer_fps_at": None, "started_at": time.time(), "ready": False,
                     "prepare_ms": {}}


      class _FpsTap(logging.Handler):
          """LiveTalking logs '------actual avg infer fps:<x>' every 100 frames; keep the last value."""

          def emit(self, record: logging.LogRecord) -> None:
              msg = record.getMessage()
              m = re.search(r"actual avg infer fps:([0-9.]+)", msg)
              if m:
                  STATE["infer_fps"] = round(float(m.group(1)), 2)
                  STATE["infer_fps_at"] = time.time()


      logging.getLogger("utils.logger").addHandler(_FpsTap())

      # Media counters for /health: how many audio frames left for WebRTC and how many carried
      # sound, and how many speaking frames could not be blended (each one would otherwise drop
      # its video frame AND its two audio frames in LiveTalking's process_frames).
      MEDIA = {"audio_frames": 0, "audio_frames_with_sound": 0, "audio_peak": 0, "video_frames": 0,
               "blend_errors": 0, "stream_utterances": 0}
      import server.webrtc as _lt_webrtc  # noqa: E402

      _orig_push_audio = _lt_webrtc.HumanPlayer.push_audio
      _orig_push_video = _lt_webrtc.HumanPlayer.push_video


      TRACE: dict = {}


      def _push_audio(self, frame, eventpoint=None):
          MEDIA["audio_frames"] += 1
          peak = int(np.abs(frame).max()) if frame.size else 0
          if peak > 64:
              MEDIA["audio_frames_with_sound"] += 1
              MEDIA["audio_peak"] = max(MEDIA["audio_peak"], peak)
              t_in = TRACE.get("speech_in_at")
              if t_in is not None and TRACE.get("speech_out_at") is None:
                  TRACE["speech_out_at"] = time.monotonic()
                  a = getattr(self, "_HumanPlayer__audio", None)
                  v = getattr(self, "_HumanPlayer__video", None)
                  TRACE["last"] = {"in_to_sender_ms": round((TRACE["speech_out_at"] - t_in) * 1000.0, 1),
                                   "audio_queue_frames": a._queue.qsize() if a is not None else None,
                                   "video_queue_frames": v._queue.qsize() if v is not None else None}
          return _orig_push_audio(self, frame, eventpoint)


      def _push_video(self, frame):
          MEDIA["video_frames"] += 1
          return _orig_push_video(self, frame)


      _lt_webrtc.HumanPlayer.push_audio = _push_audio
      _lt_webrtc.HumanPlayer.push_video = _push_video

      # Per-track delivery: frames handed to the encoder per second, and underruns (the sender
      # asked for a video frame and none was ready: the call stutters). Read per session in /health.
      _orig_recv = _lt_webrtc.PlayerStreamTrack.recv


      async def _recv(self):
          if self.kind == "video":
              st = self.__dict__.setdefault("_acudx", {"frames": 0, "underruns": 0, "window": collections.deque(maxlen=50)})
              if st["frames"] and self._queue.empty():
                  st["underruns"] += 1
          frame = await _orig_recv(self)
          if self.kind == "video":
              st["frames"] += 1
              st["window"].append(time.monotonic())
          return frame


      _lt_webrtc.PlayerStreamTrack.recv = _recv

      t0 = time.monotonic()
      MODEL = mt.load_model()
      mt.warm_up(BATCH_SIZE, MODEL)
      VAE = MODEL[0]
      FACE_PARSER = FaceParsing(left_cheek_width=90, right_cheek_width=90)
      STATE["model_load_ms"] = round((time.monotonic() - t0) * 1000.0, 1)
      _orig_paste = mt.MuseReal.paste_back_frame


      def _paste_back_frame(self, pred_frame, idx: int):
          """Blend the generated mouth into the frame; on a blend failure keep the plain frame so the
          frame and, above all, its audio still go out (upstream drops both on any exception)."""
          try:
              return _orig_paste(self, pred_frame, idx)
          except Exception:  # noqa: BLE001 - counted and surfaced in /health
              MEDIA["blend_errors"] += 1
              return self.frame_list_cycle[idx].copy()


      mt.MuseReal.paste_back_frame = _paste_back_frame

      _orig_infer = mt.MuseReal.inference_batch


      def _inference_batch(self, index, audiofeat_batch):
          """One UNet + VAE batch on this call's own CUDA stream (two calls overlap on the GPU instead of
          serialising on the default stream), timed per call for /health."""
          st = self.__dict__.get("_acudx_stream")
          if st is None and torch.cuda.is_available():
              st = self._acudx_stream = torch.cuda.Stream()
          self._acudx_inflight = 1
          t = time.perf_counter()
          try:
              if st is not None:
                  with torch.cuda.stream(st):
                      out = _orig_infer(self, index, audiofeat_batch)
                  st.synchronize()
              else:
                  out = _orig_infer(self, index, audiofeat_batch)
          finally:
              self._acudx_inflight = 0
          stats = self.__dict__.setdefault("_acudx_infer", {"frames": 0, "seconds": 0.0})
          stats["frames"] += len(out)
          stats["seconds"] += time.perf_counter() - t
          return out


      mt.MuseReal.inference_batch = _inference_batch


      def _render(self, quit_event):
          """LiveTalking BaseAvatar.render with a latency-bounded throttle.

          Upstream sleeps only when the WebRTC video queue holds 5 frames, so the feature queue (2
          batches) and the rendered-frame queue (2 batches) stay full and new speech waits behind
          about 1.5 s of silence. Here the loop counts every stage (sender queue, rendered frames,
          queued feature batches, the batch in the UNet) and extracts the next batch only while that
          total is below ``ahead_frames``.
          """
          from threading import Event, Thread  # noqa: PLC0415

          self.quit_event = quit_event
          self.init_customindex()
          self.tts.render(quit_event)
          infer_quit, process_quit = Event(), Event()
          infer_thread = Thread(target=self.inference, args=(infer_quit,), daemon=True)
          process_thread = Thread(target=self.process_frames, args=(process_quit,), daemon=True)
          infer_thread.start()
          process_thread.start()
          b = self.batch_size
          target = int(getattr(self, "_acudx_ahead", AHEAD_FRAMES))
          while not quit_event.is_set():
              out_q = _sender_depth(self)
              ahead = (out_q + self.res_frame_queue.qsize()
                       + (self.asr.feat_queue.qsize() + int(getattr(self, "_acudx_inflight", 0))) * b)
              if ahead >= target:
                  time.sleep(0.004)
                  continue
              self.asr.run_step()
          infer_quit.set()
          infer_thread.join()
          process_quit.set()
          process_thread.join()
          log.info("render thread for %s stopped", getattr(self, "sessionid", "?"))


      mt.MuseReal.render = _render


      def _tracks(sess) -> tuple:
          player = getattr(getattr(sess, "output", None), "_player", None)
          if player is None:
              return None, None
          return getattr(player, "_HumanPlayer__audio", None), getattr(player, "_HumanPlayer__video", None)


      def _sender_depth(sess) -> int:
          """Frames waiting in the WebRTC sender, in video frames: the deeper of the video queue and the
          audio queue (two 20 ms frames per video frame). Upstream looks at the video queue only, so an
          audio backlog (audio is never dropped) adds its full length to the voice latency unseen."""
          audio, video = _tracks(sess)
          vq = video._queue.qsize() if video is not None else 0
          aq = audio._queue.qsize() if audio is not None else 0
          return max(vq, (aq + 1) // 2)


      def _install_av_shift(sess, shift_ms: int) -> None:
          """Re-pair audio and video by index: the WebRTC tracks emit frame k at start + k * 40 ms, so a
          delay line only shifts lips against voice if it emits one frame per frame pushed (prefilled
          with the first frame). Positive ``shift_ms`` shows video frame k - n with audio frame k."""
          n = int(round(abs(shift_ms) / 40.0))
          if n == 0:
              return
          out = sess.output
          if shift_ms > 0:
              orig_v = out.push_video_frame
              line: collections.deque = collections.deque()

              def push_video_frame(frame) -> None:
                  if not line:
                      line.extend(frame for _ in range(n))
                  line.append(frame)
                  orig_v(line.popleft())

              out.push_video_frame = push_video_frame
          else:
              orig_a = out.push_audio_frame
              aline: collections.deque = collections.deque((np.zeros(320, dtype=np.int16), None) for _ in range(2 * n))

              def push_audio_frame(frame, eventpoint=None) -> None:
                  aline.append((frame, eventpoint))
                  f, ev = aline.popleft()
                  orig_a(f, ev)

              out.push_audio_frame = push_audio_frame


      AVATARS: dict[str, tuple] = {}
      PREP_LOCK = threading.Lock()
      AVATAR_ROOT = "./data/avatars"


      def _avatar_dir(avatar_id: str) -> str:
          return os.path.join(AVATAR_ROOT, avatar_id)


      def _is_prepared(avatar_id: str) -> bool:
          root = _avatar_dir(avatar_id)
          if not os.path.isfile(os.path.join(root, "latents.pt")):
              return False
          try:
              with open(os.path.join(root, "avator_info.json")) as f:
                  return int(json.load(f).get("acudx_prep", 1)) >= PREP_VERSION
          except (OSError, ValueError):
              return False


      def _load(avatar_id: str) -> tuple:
          if avatar_id not in AVATARS:
              AVATARS[avatar_id] = mt.load_avatar(avatar_id)
          return AVATARS[avatar_id]


      class NoFace(ValueError):
          pass


      def extend_portrait(img: np.ndarray, top: int, bottom: int, left: int, right: int) -> np.ndarray:
          """Grow the portrait on the sides that need it without streaks. Right at the seam the border
          is the mirrored image (texture continues, no hard edge); within ``feather`` px it fades into
          the edge colours smeared outwards and blurred across (replicate, then a wide Gaussian), so the
          old edge-replicate streaks are averaged away and no mirrored features (a second chin, an ear)
          appear. The original pixels are kept exactly."""
          if max(top, bottom, left, right) <= 0:
              return img
          h, w = img.shape[:2]
          mirrored = cv2.copyMakeBorder(img, top, bottom, left, right, cv2.BORDER_REFLECT_101)
          smeared = cv2.copyMakeBorder(img, top, bottom, left, right, cv2.BORDER_REPLICATE)
          pad = max(top, bottom, left, right)
          sigma = max(8.0, pad / 2.0)
          blurred = cv2.GaussianBlur(smeared, (0, 0), sigmaX=sigma, sigmaY=sigma, borderType=cv2.BORDER_REPLICATE)
          H, W = mirrored.shape[:2]
          ys = np.arange(H, dtype=np.float32)[:, None]
          xs = np.arange(W, dtype=np.float32)[None, :]
          dx = np.maximum(np.maximum(left - xs, xs - (left + w - 1)), 0.0)
          dy = np.maximum(np.maximum(top - ys, ys - (top + h - 1)), 0.0)
          d = np.sqrt(dx * dx + dy * dy)
          feather = float(max(6, min(16, pad // 3)))
          keep = np.clip(1.0 - d / feather, 0.0, 1.0)
          keep = (keep * keep * (3.0 - 2.0 * keep))[..., None]  # smoothstep: no visible seam in the fade
          out = keep * mirrored.astype(np.float32) + (1.0 - keep) * blurred.astype(np.float32)
          out[top:top + h, left:left + w] = img
          return np.clip(out, 0, 255).astype(np.uint8)


      def _ease(u: float, k: int) -> float:
          """(1 - cos(k pi u)) / 2: zero velocity at u = 0 and u = 1, so LiveTalking's ping-pong
          playback of the loop (mirror_index) turns around without a jolt."""
          return (1.0 - math.cos(k * math.pi * u)) / 2.0


      def idle_transforms(n: int, box: list[int]) -> list[np.ndarray]:
          """Affine transforms for a subtle idle head motion around a pivot under the chin: a slow
          sway (+-0.7 degrees), a small nod (1.2 px) and a slight drift (0.8 px); identity for n == 1."""
          x1, y1, x2, y2 = box
          bh = y2 - y1
          pivot = ((x1 + x2) / 2.0, y2 + 0.25 * bh)
          out = []
          for t in range(n):
              u = t / (n - 1) if n > 1 else 0.0
              angle = 0.7 * (2.0 * _ease(u, 1) - 1.0) if n > 1 else 0.0
              nod = 1.2 * _ease(u, 2) if n > 1 else 0.0
              drift = 0.8 * (2.0 * _ease(u, 3) - 1.0) if n > 1 else 0.0
              m = cv2.getRotationMatrix2D(pivot, angle, 1.0 + 0.003 * _ease(u, 2))
              m[0, 2] += drift
              m[1, 2] += nod
              out.append(m)
          return out


      def head_mask(shape: tuple, box: list[int]) -> np.ndarray:
          """Soft ellipse over the head (face box, hair above, chin), 1 inside, feathered: only the head
          moves in the idle loop, shoulders and background stay still."""
          x1, y1, x2, y2 = box
          bw, bh = x2 - x1, y2 - y1
          top, bottom = y1 - 0.75 * bh, y2 + 0.12 * bh
          center = (int(round((x1 + x2) / 2.0)), int(round((top + bottom) / 2.0)))
          axes = (int(round(0.85 * bw)), int(round((bottom - top) / 2.0)))
          m = np.zeros(shape[:2], dtype=np.float32)
          cv2.ellipse(m, center, axes, 0, 0, 360, 1.0, -1)
          sigma = max(3.0, 0.12 * bh)
          return cv2.GaussianBlur(m, (0, 0), sigmaX=sigma, sigmaY=sigma)[..., None]


      def _box_after(m: np.ndarray, box: list[int], shape: tuple) -> list[int]:
          x1, y1, x2, y2 = box
          pts = np.array([[x1, y1, 1], [x2, y1, 1], [x1, y2, 1], [x2, y2, 1]], dtype=np.float32) @ m.T
          cx, cy = pts[:, 0].mean(), pts[:, 1].mean()
          w, h = x2 - x1, y2 - y1
          nx1, ny1 = int(round(cx - w / 2.0)), int(round(cy - h / 2.0))
          nx1 = max(0, min(nx1, shape[1] - w))
          ny1 = max(0, min(ny1, shape[0] - h))
          return [nx1, ny1, nx1 + w, ny1 + h]


      @torch.no_grad()
      def prepare_avatar(avatar_id: str, image_bytes: bytes, idle_frames: int | None = None) -> dict:
          """Portrait -> MuseTalk avatar: an idle loop of ``idle_frames`` frames (latents, face boxes,
          blend masks per frame). 1 frame = the still portrait."""
          started = time.monotonic()
          n = max(1, min(int(idle_frames if idle_frames is not None else IDLE_FRAMES), 150))
          img = cv2.imdecode(np.frombuffer(image_bytes, dtype=np.uint8), cv2.IMREAD_COLOR)
          if img is None:
              raise ValueError("image could not be decoded")
          h, w = img.shape[:2]
          if h > MAX_FRAME_H:
              scale = MAX_FRAME_H / h
              img = cv2.resize(img, (int(w * scale), MAX_FRAME_H), interpolation=cv2.INTER_AREA)
              h, w = img.shape[:2]
          # H.264 and VP8 encoders want even dimensions.
          img = img[: h - h % 2, : w - w % 2]
          padded = 0
          with PREP_LOCK:
              root = _avatar_dir(avatar_id)
              full_dir = os.path.join(root, "full_imgs")
              mask_dir = os.path.join(root, "mask")
              for d in (full_dir, mask_dir):
                  os.makedirs(d, exist_ok=True)
                  for f in os.listdir(d):
                      os.remove(os.path.join(d, f))
              frame_path = os.path.join(full_dir, "00000000.png")
              for _attempt in range(3):
                  cv2.imwrite(frame_path, img)
                  coord_list, frame_list = get_landmark_and_bbox([frame_path], 0)
                  if not coord_list or tuple(coord_list[0]) == tuple(coord_placeholder):
                      raise NoFace("no face found in the portrait")
                  x1, y1, x2, y2 = (int(v) for v in coord_list[0])
                  frame = frame_list[0]
                  y2 = min(y2 + 10, frame.shape[0])  # v1.5 extra_margin, as in genavatar.py
                  coords = [x1, y1, x2, y2]
                  # The blend step pastes into the face box expanded 1.5x (blending.get_crop_box). A
                  # close-up portrait puts that box outside the frame, every speaking frame then fails
                  # in paste_back_frame and is dropped together with its audio, so the call is silent.
                  # Extend the portrait (mirrored, blurred; see extend_portrait) until the expanded box
                  # fits with room for the idle motion, then detect again.
                  (cx1, cy1, cx2, cy2), _s = get_crop_box(coords, 1.5)
                  fh, fw = frame.shape[:2]
                  margin = 12
                  need = [max(0, -cy1), max(0, cy2 - fh), max(0, -cx1), max(0, cx2 - fw)]  # top, bottom, left, right
                  if max(need) == 0:
                      break
                  sides = [n + margin if n else 0 for n in need]
                  # Keep the result within MAX_FRAME_H by shrinking the portrait first (the face box and
                  # so the needed border shrink with it), instead of padding and then shrinking again.
                  grown_h = img.shape[0] + sides[0] + sides[1]
                  if grown_h > MAX_FRAME_H:
                      s = MAX_FRAME_H / float(grown_h)
                      img = cv2.resize(img, (int(img.shape[1] * s), int(img.shape[0] * s)), interpolation=cv2.INTER_AREA)
                      sides = [int(math.ceil(n * s)) if n else 0 for n in sides]
                  padded = max(padded, max(sides))
                  img = extend_portrait(img, *sides)
                  img = img[: img.shape[0] - img.shape[0] % 2, : img.shape[1] - img.shape[1] % 2]
              else:
                  raise NoFace("the face fills the portrait; no room for the blend box")
              base = frame
              mask = head_mask(base.shape, coords) if n > 1 else None
              coords_list, mask_coords, latents = [], [], []
              for i, m in enumerate(idle_transforms(n, coords)):
                  if mask is not None and i > 0:
                      warped = cv2.warpAffine(base, m, (base.shape[1], base.shape[0]), flags=cv2.INTER_LINEAR,
                                              borderMode=cv2.BORDER_REFLECT_101)
                      fr = np.clip(mask * warped.astype(np.float32) + (1.0 - mask) * base.astype(np.float32),
                                   0, 255).astype(np.uint8)
                      box = _box_after(m, coords, base.shape)
                  else:
                      fr, box = base, list(coords)
                  bx1, by1, bx2, by2 = box
                  crop = cv2.resize(fr[by1:by2, bx1:bx2], (256, 256), interpolation=cv2.INTER_LANCZOS4)
                  latents.append(VAE.get_latents_for_unet(crop))
                  fmask, crop_box = get_image_prepare_material(fr, box, fp=FACE_PARSER, mode="jaw")
                  name = f"{i:08d}.png"
                  cv2.imwrite(os.path.join(full_dir, name), fr)
                  cv2.imwrite(os.path.join(mask_dir, name), fmask)
                  coords_list.append(box)
                  mask_coords.append(crop_box)
              with open(os.path.join(root, "mask_coords.pkl"), "wb") as f:
                  pickle.dump(mask_coords, f)
              with open(os.path.join(root, "coords.pkl"), "wb") as f:
                  pickle.dump(coords_list, f)
              torch.save(latents, os.path.join(root, "latents.pt"))
              with open(os.path.join(root, "avator_info.json"), "w") as f:
                  json.dump({"avatar_id": avatar_id, "video_path": "portrait", "bbox_shift": 0,
                             "acudx_prep": PREP_VERSION, "idle_frames": n, "extended_px": padded,
                             "face_box": [int(v) for v in coords], "width": int(base.shape[1]),
                             "height": int(base.shape[0])}, f)
              AVATARS.pop(avatar_id, None)
              _load(avatar_id)
          ms = round((time.monotonic() - started) * 1000.0, 1)
          STATE["prepare_ms"][avatar_id] = ms
          return {"avatar_id": avatar_id, "width": int(base.shape[1]), "height": int(base.shape[0]),
                  "face_box": [int(v) for v in coords], "idle_frames": n, "extended_px": padded,
                  "extension": "mirrored+blurred" if padded else "none", "prepare_ms": ms}


      class _WarmingFeatQueue(queue.Queue):
          """The session's feature queue. Its consumer is the session's inference thread, so the first
          UNet + VAE batch on that thread and its CUDA stream can be paid here, during the idle frames
          right after the call connects, instead of on the patient's first line (live run 2026-10-20:
          the first line of every call spent 2.06 s between audio in and audio out, the next ones 56 to
          86 ms). It runs after a few idle batches so the first frame is not delayed."""

          def __init__(self, sess, maxsize: int = 1, after: int = 3):
              super().__init__(maxsize=maxsize)
              self._sess, self._after, self._gets = sess, after, 0

          def get(self, block=True, timeout=None):
              item = super().get(block, timeout)
              self._gets += 1
              if self._gets == self._after:
                  _warm_session(self._sess)
              return item


      @torch.no_grad()
      def _warm_session(sess) -> None:
          t = time.perf_counter()
          feats = [np.zeros((50, 384), dtype=np.float32) for _ in range(sess.batch_size)]
          st = sess.__dict__.get("_acudx_stream")
          if st is None and torch.cuda.is_available():
              st = sess._acudx_stream = torch.cuda.Stream()
          try:
              if st is not None:
                  with torch.cuda.stream(st):
                      _orig_infer(sess, 0, feats)
                  st.synchronize()
              else:
                  _orig_infer(sess, 0, feats)
          except Exception as exc:  # noqa: BLE001 - a failed warm-up only costs the first line its latency
              log.warning("session warm-up failed: %s", type(exc).__name__)
          sess._acudx_warm_ms = round((time.perf_counter() - t) * 1000.0, 1)
          log.info("session %s warm-up %.0f ms", getattr(sess, "sessionid", "?"), sess._acudx_warm_ms)


      def _bounded(params: dict, key: str, default: int, lo: int, hi: int) -> int:
          try:
              v = int(params.get(key, default))
          except (TypeError, ValueError):
              v = default
          return max(lo, min(hi, v))


      def build_avatar_session(sessionid: str, params: dict):
          tuning = params.get("tuning") if isinstance(params.get("tuning"), dict) else {}
          o = copy.deepcopy(opt)
          o.sessionid = sessionid
          o.batch_size = _bounded(tuning, "batch_size", BATCH_SIZE, 2, 16)
          o.r = _bounded(tuning, "lookahead_frames", LOOKAHEAD_FRAMES, 4, 10)
          avatar_id = params["avatar"]
          o.avatar_id = avatar_id
          sess = registry.create("avatar", "musetalk", opt=o, model=MODEL, avatar=_load(avatar_id))
          # Shallow queues: one feature batch and one rendered batch in flight (upstream: two each).
          sess.asr.feat_queue = _WarmingFeatQueue(sess, maxsize=1)
          sess.res_frame_queue = queue.Queue(o.batch_size)
          sess._acudx_ahead = _bounded(tuning, "ahead_frames", AHEAD_FRAMES, o.batch_size + 2, 40)
          sess._acudx_shift_ms = _bounded(tuning, "av_shift_ms", AV_SHIFT_MS, -1000, 1000)
          sess._acudx_tuning = {"batch_size": o.batch_size, "lookahead_frames": o.r, "ahead_frames": sess._acudx_ahead,
                                "av_shift_ms": sess._acudx_shift_ms}
          sess._acudx_avatar = avatar_id
          _install_crossfade(sess)
          _install_av_shift(sess, sess._acudx_shift_ms)
          return sess


      def _install_crossfade(sess) -> None:
          """Keep the last frame sent; after a /switch the next frames fade from that frame into the new
          appearance (smoothstep over the switch's crossfade time), so a change of the patient's state
          never cuts. Frames of a different size are resized for the blend."""
          out = sess.output
          orig_v = out.push_video_frame
          st = {"last": None, "from": None, "t0": 0.0, "dur": 0.0}

          def push_video_frame(frame) -> None:
              src = st["from"]
              if src is not None:
                  u = (time.monotonic() - st["t0"]) / st["dur"] if st["dur"] > 0 else 1.0
                  if u >= 1.0:
                      st["from"] = None
                  else:
                      if src.shape != frame.shape:
                          src = cv2.resize(src, (frame.shape[1], frame.shape[0]), interpolation=cv2.INTER_AREA)
                      a = u * u * (3.0 - 2.0 * u)
                      frame = cv2.addWeighted(src, 1.0 - a, frame, a, 0.0)
              st["last"] = frame
              orig_v(frame)

          out.push_video_frame = push_video_frame
          sess._acudx_fade = st


      class TrackedRTCManager(RTCManager):
          """RTCManager that remembers the peer connection and video track per session."""

          def __init__(self, o):
              super().__init__(o)
              self.by_session: dict = {}
              self.video_tracks: dict = {}

          async def _create_pc_and_answer(self, avatar_session, sessionid, offer):
              pc = await super()._create_pc_and_answer(avatar_session, sessionid, offer)
              self.by_session[sessionid] = pc
              for sender in pc.getSenders():
                  if sender.track is not None and sender.track.kind == "video":
                      self.video_tracks[sessionid] = sender.track
              return pc


      session_manager.set_max_session(MAX_SESSIONS)
      session_manager.init_builder(build_avatar_session)
      RTC = TrackedRTCManager(opt)


      def _gpu() -> dict:
          out: dict = {"cuda": torch.cuda.is_available()}
          if torch.cuda.is_available():
              free, total = torch.cuda.mem_get_info()
              out.update({"name": torch.cuda.get_device_name(0), "total_mb": total // 2**20, "free_mb": free // 2**20,
                          "process_reserved_mb": torch.cuda.memory_reserved() // 2**20,
                          "process_allocated_mb": torch.cuda.memory_allocated() // 2**20})
          return out


      def _session_stats(sid: str, sess) -> dict:
          out: dict = {"id": sid[:8], "tuning": getattr(sess, "_acudx_tuning", None),
                       "avatar": getattr(sess, "_acudx_avatar", None),
                       "speaking": bool(getattr(sess, "speaking", False)), "warm_up_ms": getattr(sess, "_acudx_warm_ms", None)}
          inf = getattr(sess, "_acudx_infer", None)
          if inf and inf["seconds"] > 0:
              out["infer_fps"] = round(inf["frames"] / inf["seconds"], 1)
              out["inferred_frames"] = inf["frames"]
          audio, video = _tracks(sess)
          out["sender_queue"] = {"audio_frames": audio._queue.qsize() if audio is not None else None,
                                 "video_frames": video._queue.qsize() if video is not None else None}
          track = RTC.video_tracks.get(sid)
          st = getattr(track, "_acudx", None) if track is not None else None
          if st:
              w = st["window"]
              out["sent_frames"] = st["frames"]
              out["underruns"] = st["underruns"]
              if len(w) >= 2 and w[-1] > w[0]:
                  out["out_fps"] = round((len(w) - 1) / (w[-1] - w[0]), 1)
          return out


      async def health(_request: web.Request) -> web.Response:
          active = {k: v for k, v in session_manager.sessions.items() if v is not None}
          prepared = sorted(d for d in os.listdir(AVATAR_ROOT) if _is_prepared(d)) if os.path.isdir(AVATAR_ROOT) else []
          return web.json_response({
              "ok": True, "model": "musetalk-1.5", "runner": "livetalking", "livetalking_ref": LIVETALKING_REF,
              "transport": "webrtc", "fps": opt.fps, "batch_size": BATCH_SIZE, "sessions": len(active),
              "max_sessions": MAX_SESSIONS, "dedicated_gpu": DEDICATED_GPU, "avatars": prepared,
              "infer_fps": STATE["infer_fps"], "prepare_ms": STATE["prepare_ms"],
              "defaults": {"batch_size": BATCH_SIZE, "ahead_frames": AHEAD_FRAMES, "lookahead_frames": LOOKAHEAD_FRAMES,
                           "av_shift_ms": AV_SHIFT_MS, "idle_frames": IDLE_FRAMES},
              "calls": [_session_stats(k, v) for k, v in active.items()],
              "model_load_ms": STATE["model_load_ms"], "gpu": _gpu(), "uptime_s": round(time.time() - STATE["started_at"]),
              "media": dict(MEDIA), "audio_in": ["stream", "humanaudio"], "last_speech_trace": TRACE.get("last"),
          })


      async def list_avatars(_request: web.Request) -> web.Response:
          prepared = sorted(d for d in os.listdir(AVATAR_ROOT) if _is_prepared(d)) if os.path.isdir(AVATAR_ROOT) else []
          return web.json_response({"avatars": prepared})


      async def get_avatar(request: web.Request) -> web.Response:
          """A prepared avatar's geometry (frame size, face box, idle frames), for the browser's lip-sync meter."""
          avatar_id = request.match_info["avatar_id"]
          if not AVATAR_ID_RE.match(avatar_id) or not _is_prepared(avatar_id):
              return web.json_response({"error": "not_prepared"}, status=404)
          with open(os.path.join(_avatar_dir(avatar_id), "avator_info.json")) as f:
              info = json.load(f)
          return web.json_response({k: info.get(k) for k in ("avatar_id", "face_box", "width", "height", "idle_frames",
                                                             "extended_px")})


      async def put_avatar(request: web.Request) -> web.Response:
          avatar_id = request.match_info["avatar_id"]
          if not AVATAR_ID_RE.match(avatar_id):
              return web.json_response({"error": "bad avatar_id"}, status=400)
          body = await request.read()
          if not body or len(body) > MAX_IMAGE_BYTES:
              return web.json_response({"error": "image missing or larger than 8 MB"}, status=400)
          frames = request.query.get("idle_frames")
          try:
              n = int(frames) if frames else None
          except ValueError:
              return web.json_response({"error": "bad idle_frames"}, status=400)
          try:
              info = await asyncio.get_running_loop().run_in_executor(None, prepare_avatar, avatar_id, body, n)
          except NoFace as exc:
              return web.json_response({"error": "no_face", "detail": str(exc)}, status=422)
          except ValueError as exc:
              return web.json_response({"error": "bad_image", "detail": str(exc)}, status=400)
          return web.json_response(info)


      def _active() -> int:
          return sum(1 for v in session_manager.sessions.values() if v is not None)


      async def offer(request: web.Request) -> web.Response:
          params = await request.json()
          avatar_id = str(params.get("avatar") or "")
          if not AVATAR_ID_RE.match(avatar_id) or not _is_prepared(avatar_id):
              return web.json_response({"error": "avatar_not_prepared", "avatar": avatar_id}, status=409)
          try:
              await asyncio.get_running_loop().run_in_executor(None, _load, avatar_id)
          except Exception as exc:  # noqa: BLE001 - a broken avatar dir is a client-visible error
              return web.json_response({"error": "avatar_load_failed", "detail": type(exc).__name__}, status=500)
          if _active() >= MAX_SESSIONS:
              return web.json_response({"error": "max_sessions", "max_sessions": MAX_SESSIONS}, status=503)
          try:
              return await RTC.handle_offer(request)
          except MaxSessionError:
              return web.json_response({"error": "max_sessions", "max_sessions": MAX_SESSIONS}, status=503)


      async def switch(request: web.Request) -> web.Response:
          """{sessionid, avatar, crossfade_ms}: swap a live call's face to another prepared avatar (the same
          patient in another state). The idle loop length must match: the session's inference thread
          indexes frames by the length it started with."""
          params = await request.json()
          sid = str(params.get("sessionid") or "")
          avatar_id = str(params.get("avatar") or "")
          ms = _bounded(params, "crossfade_ms", 900, 0, 3000)
          sess = session_manager.get_session(sid)
          if sess is None:
              return web.json_response({"error": "unknown_session"}, status=404)
          if not AVATAR_ID_RE.match(avatar_id) or not _is_prepared(avatar_id):
              return web.json_response({"error": "avatar_not_prepared", "avatar": avatar_id}, status=409)
          t = time.monotonic()
          try:
              av = await asyncio.get_running_loop().run_in_executor(None, _load, avatar_id)
          except Exception as exc:  # noqa: BLE001
              return web.json_response({"error": "avatar_load_failed", "detail": type(exc).__name__}, status=500)
          if len(av[0]) != len(sess.frame_list_cycle) or len(av[4]) != len(sess.input_latent_list_cycle):
              return web.json_response({"error": "frame_count_mismatch", "have": len(sess.frame_list_cycle),
                                        "got": len(av[0])}, status=409)
          st = getattr(sess, "_acudx_fade", None)
          if st is not None and st.get("last") is not None and ms > 0:
              st["from"], st["t0"], st["dur"] = st["last"].copy(), time.monotonic(), ms / 1000.0
          (sess.frame_list_cycle, sess.mask_list_cycle, sess.coord_list_cycle, sess.mask_coords_list_cycle,
           sess.input_latent_list_cycle) = av
          previous = getattr(sess, "_acudx_avatar", None)
          sess._acudx_avatar = avatar_id
          MEDIA["switches"] = MEDIA.get("switches", 0) + 1
          return web.json_response({"ok": True, "avatar": avatar_id, "previous": previous, "crossfade_ms": ms,
                                    "switch_ms": round((time.monotonic() - t) * 1000.0, 1)})


      async def close(request: web.Request) -> web.Response:
          params = await request.json()
          sid = str(params.get("sessionid") or "")
          session_manager.remove_session(sid)
          RTC.video_tracks.pop(sid, None)
          pc = RTC.by_session.pop(sid, None)
          if pc is not None:
              await pc.close()
              RTC.pcs.discard(pc)
          return web.json_response({"ok": True, "closed": pc is not None})


      class _Utterance:
          """Streamed TTS audio -> 16 kHz float32 20 ms frames pushed straight into the session's audio
          queue (LiveTalking ``put_audio_frame``), resampled with a streaming soxr resampler so chunk
          boundaries leave no clicks."""

          CHUNK = 320

          def __init__(self, sess, sample_rate: int):
              self.sess = sess
              self.rate = sample_rate
              self.rs = soxr.ResampleStream(sample_rate, 16000, 1, dtype="float32", quality="HQ") if sample_rate != 16000 else None
              self.buf = np.zeros(0, dtype=np.float32)
              self.odd = b""
              self.frames = 0
              self.started = time.monotonic()
              self.first_frame_ms: float | None = None
              self.bytes_in = 0

          def _push(self, samples: np.ndarray, last: bool) -> None:
              if samples.size:
                  self.buf = np.concatenate([self.buf, samples])
              while self.buf.size >= self.CHUNK:
                  frame, self.buf = self.buf[: self.CHUNK], self.buf[self.CHUNK:]
                  final = last and self.buf.size == 0
                  ev = {"status": "start"} if self.frames == 0 else ({"status": "end"} if final else {})
                  self.sess.put_audio_frame(frame.copy(), ev)
                  if self.frames == 0:
                      self.first_frame_ms = round((time.monotonic() - self.started) * 1000.0, 1)
                      TRACE["speech_in_at"], TRACE["speech_out_at"] = time.monotonic(), None
                  self.frames += 1

          def feed(self, data: bytes) -> None:
              self.bytes_in += len(data)
              data = self.odd + data
              if len(data) % 2:
                  self.odd, data = data[-1:], data[:-1]
              else:
                  self.odd = b""
              if not data:
                  return
              x = np.frombuffer(data, dtype="<i2").astype(np.float32) / 32768.0
              if self.rs is not None:
                  x = self.rs.resample_chunk(x)
              self._push(x.astype(np.float32, copy=False), last=False)

          def finish(self) -> dict:
              tail = self.rs.resample_chunk(np.zeros(0, dtype=np.float32), last=True) if self.rs is not None else np.zeros(0, np.float32)
              if self.buf.size + tail.size:
                  pad = (-(self.buf.size + tail.size)) % self.CHUNK
                  tail = np.concatenate([tail.astype(np.float32), np.zeros(pad, dtype=np.float32)])
              self._push(tail, last=True)
              return {"frames": self.frames, "audio_ms": self.frames * 20, "bytes_in": self.bytes_in,
                      "first_frame_ms": self.first_frame_ms, "elapsed_ms": round((time.monotonic() - self.started) * 1000.0, 1)}


      async def stream_audio(request: web.Request) -> web.WebSocketResponse:
          """Audio in as it is synthesised (see the module docstring for the message shapes)."""
          ws = web.WebSocketResponse(max_msg_size=1 << 20, heartbeat=20)
          await ws.prepare(request)
          cur: _Utterance | None = None
          sess = None
          async for msg in ws:
              if msg.type == WSMsgType.BINARY:
                  if cur is not None:
                      cur.feed(msg.data)
                  continue
              if msg.type != WSMsgType.TEXT:
                  break
              try:
                  m = json.loads(msg.data)
              except ValueError:
                  await ws.send_json({"type": "error", "error": "bad_json"})
                  continue
              kind = m.get("type")
              if kind == "begin":
                  sess = session_manager.get_session(str(m.get("sessionid") or ""))
                  if sess is None:
                      await ws.send_json({"type": "error", "error": "unknown_session"})
                      cur = None
                      continue
                  if m.get("interrupt"):
                      sess.flush_talk()
                  rate = int(m.get("sample_rate") or 16000)
                  if rate not in (8000, 16000, 22050, 24000, 44100, 48000):
                      await ws.send_json({"type": "error", "error": "bad_sample_rate"})
                      continue
                  cur = _Utterance(sess, rate)
                  MEDIA["stream_utterances"] += 1
                  await ws.send_json({"type": "begun"})
              elif kind == "end":
                  if cur is not None:
                      stats = cur.finish()
                      cur = None
                      await ws.send_json({"type": "done", **stats})
              elif kind == "interrupt":
                  if sess is not None:
                      sess.flush_talk()
                  cur = None
                  await ws.send_json({"type": "interrupted"})
              elif kind == "ping":
                  await ws.send_json({"type": "pong"})
          if cur is not None:
              cur.finish()
          return ws


      async def turn_bridge(request: web.Request) -> web.WebSocketResponse:
          """Pipe bytes between a WebSocket and the TURN server's TCP listener (TURN over TCP is a byte stream)."""
          ws = web.WebSocketResponse(max_msg_size=1 << 20, heartbeat=20)
          await ws.prepare(request)
          try:
              reader, writer = await asyncio.open_connection(TURN_TCP_HOST, TURN_TCP_PORT)
          except OSError as exc:
              await ws.close(code=1011, message=f"turn unreachable: {type(exc).__name__}".encode())
              return ws

          async def tcp_to_ws() -> None:
              while True:
                  data = await reader.read(65536)
                  if not data:
                      break
                  await ws.send_bytes(data)

          pump = asyncio.create_task(tcp_to_ws())
          try:
              async for msg in ws:
                  if msg.type == WSMsgType.BINARY:
                      writer.write(msg.data)
                      await writer.drain()
                  elif msg.type in (WSMsgType.CLOSE, WSMsgType.ERROR):
                      break
          finally:
              pump.cancel()
              writer.close()
              await ws.close()
          return ws


      def _turn_credentials(label: str) -> tuple[str, str]:
          username = f"{int(time.time()) + 600}:{label}"
          digest = hmac.new(TURN_SECRET.encode(), username.encode(), hashlib.sha1).digest()
          return username, base64.b64encode(digest).decode()


      async def _allocate(host: str, port: int, transport: str, use_tls: bool) -> dict:
          from aioice import turn as aturn  # noqa: PLC0415 - aiortc's ICE library

          user, cred = _turn_credentials("turn-check")
          started = time.monotonic()
          ctx = ssl.create_default_context() if use_tls else None
          dial = TURN_HOST_ADDR or host
          try:
              if use_tls:
                  # Same TLS as a browser (SNI and certificate checked for the public name), dialled at
                  # the host address: create_connection(host=dial, server_hostname=name).
                  loop = asyncio.get_running_loop()
                  orig = loop.create_connection

                  async def _cc(factory, host=None, port=None, **kw):
                      kw.setdefault("server_hostname", turn_name)
                      return await orig(factory, host=dial, port=port, **kw)

                  turn_name = host
                  loop.create_connection = _cc  # type: ignore[method-assign]
                  try:
                      tt, _proto = await asyncio.wait_for(aturn.create_turn_endpoint(
                          asyncio.DatagramProtocol, server_addr=(host, port), username=user, password=cred,
                          ssl=ctx, transport=transport), timeout=10)
                  finally:
                      loop.create_connection = orig  # type: ignore[method-assign]
              else:
                  tt, _proto = await asyncio.wait_for(aturn.create_turn_endpoint(
                      asyncio.DatagramProtocol, server_addr=(dial, port), username=user, password=cred,
                      ssl=None, transport=transport), timeout=10)
          except Exception as exc:  # noqa: BLE001 - reported per URL
              return {"ok": False, "error": f"{type(exc).__name__}: {exc}"[:200]}
          relayed = tt.get_extra_info("sockname")
          out = {"ok": True, "relayed": f"{relayed[0]}:{relayed[1]}" if relayed else None,
                 "ms": round((time.monotonic() - started) * 1000.0, 1)}
          inner = getattr(getattr(tt, "_TurnTransport__inner_protocol", None), "transport", None)
          sslobj = inner.get_extra_info("ssl_object") if inner is not None else None
          if sslobj is not None:
              cert = sslobj.getpeercert() or {}
              out["tls"] = {"version": sslobj.version(), "cipher": (sslobj.cipher() or [None])[0],
                            "subject": dict(x[0] for x in cert.get("subject", ())).get("commonName"),
                            "issuer": dict(x[0] for x in cert.get("issuer", ())).get("organizationName")}
          tt.close()
          return out


      async def turn_check(_request: web.Request) -> web.Response:
          if not TURN_SECRET or not WORKER_DOMAIN:
              return web.json_response({"ok": False, "error": "TURN_SECRET or WORKER_DOMAIN not set"}, status=503)
          checks = {
              f"turns:turn.{WORKER_DOMAIN}:443?transport=tcp": ("turn." + WORKER_DOMAIN, 443, "tcp", True),
              f"turn:{WORKER_DOMAIN}:3478?transport=tcp": (WORKER_DOMAIN, 3478, "tcp", False),
              f"turn:{WORKER_DOMAIN}:3478?transport=udp": (WORKER_DOMAIN, 3478, "udp", False),
          }
          results = [await _allocate(*v) for v in checks.values()]  # sequential: the TLS dial patches the loop
          out = dict(zip(checks.keys(), results))
          return web.json_response({"ok": all(r["ok"] for r in results), "dialled": TURN_HOST_ADDR or "public names",
                                    "results": out})


      async def on_shutdown(_app: web.Application) -> None:
          await RTC.shutdown()


      def main() -> None:
          os.makedirs(AVATAR_ROOT, exist_ok=True)
          app = web.Application(client_max_size=32 * 1024 * 1024)
          app["rtc_manager"] = RTC
          app["opt"] = opt
          app.on_shutdown.append(on_shutdown)
          app.router.add_get("/health", health)
          app.router.add_get("/avatars", list_avatars)
          app.router.add_put("/avatars/{avatar_id}", put_avatar)
          app.router.add_get("/avatars/{avatar_id}", get_avatar)
          app.router.add_post("/offer", offer)
          app.router.add_get("/stream", stream_audio)
          app.router.add_post("/humanaudio", humanaudio)
          app.router.add_post("/interrupt_talk", interrupt_talk)
          app.router.add_post("/is_speaking", is_speaking)
          app.router.add_post("/close", close)
          app.router.add_post("/switch", switch)
          app.router.add_get("/turn", turn_bridge)
          app.router.add_get("/turn_check", turn_check)
          log.info("acudx avatar runner on :%d (batch %d, ahead %d frames, max sessions %d, model load %.0f ms)",
                   AVATAR_PORT, BATCH_SIZE, AHEAD_FRAMES, MAX_SESSIONS, STATE["model_load_ms"])
          web.run_app(app, host="0.0.0.0", port=AVATAR_PORT, access_log=None)


      if __name__ == "__main__":
          import torch.multiprocessing as tmp
          tmp.set_start_method("spawn", force=True)
          main()
