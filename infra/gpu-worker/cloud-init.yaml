      def content_key(image_bytes: bytes, ref: str | None, idle_frames: int) -> str:
          """The preparation's cache key: the picture's bytes, the base's own key for an edit (the edit is
          registered onto that base), the preparation version and the idle loop length."""
          h = hashlib.sha256()
          h.update(image_bytes)
          if ref:
              try:
                  h.update(str(_base_info(ref).get("content_key") or ref).encode())
              except (OSError, ValueError):
                  h.update(ref.encode())
          h.update(f"|v{PREP_VERSION}|n{int(idle_frames)}".encode())
          return h.hexdigest()[:24]


      def _prepared_key(avatar_id: str) -> str | None:
