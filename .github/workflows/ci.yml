name: CI

# Typecheck, lint, unit-test and build the web app; pytest the gateway; run the
# Playwright end-to-end suite against the dev server + the ws relay.
# The app is client-only and air-gapped at runtime; CI needs no secrets and
# makes no network calls beyond the npm/PyPI registries and the Playwright
# browser CDN during install.

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref to save runner minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  web:
    name: web (typecheck, lint, test, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

  server:
    name: server (pytest)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            server/requirements.txt
            server/requirements-dev.txt

      - name: Install dependencies
        run: python -m pip install -r server/requirements.txt -r server/requirements-dev.txt

      - name: Run tests
        run: python -m pytest server/tests -q

      # Terminology gate (offline): the committed ICD-10-CM / ICD-11 / LOINC outputs
      # match data/terminology/MANIFEST.json, the web order catalogue matches the
      # server catalogues, and every LOINC code in use was verified and is active.
      - name: Terminology and order catalogue check
        run: python scripts/terminology/build_terminology.py check

  e2e:
    name: e2e (Playwright, 4 viewports)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            multiplayer/package-lock.json

      - name: Install web dependencies
        working-directory: web
        run: npm ci

      - name: Install relay dependencies
        working-directory: multiplayer
        run: npm ci

      # CI only: the sandbox used for local runs ships Chromium preinstalled
      # under PLAYWRIGHT_BROWSERS_PATH and must never run `playwright install`.
      - name: Install Chromium
        working-directory: web
        run: npx playwright install --with-deps chromium

      - name: Run Playwright
        working-directory: web
        run: npm run test:e2e

      - name: Upload HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: web/playwright-report
          retention-days: 14

      - name: Upload traces and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: |
            web/test-results
            web/e2e/__screenshots__
          retention-days: 14
